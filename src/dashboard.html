<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ateam 调度台</title>
<style>
:root {
  --bg: #e9ece6;
  --surface: #f7f8f4;
  --sunken: #dfe3dc;
  --ink: #1f2a24;
  --muted: #5f6e64;
  --line: #c9cfc6;
  --pending: #8b958e;
  --working: #2d5d9f;
  --rework: #b5562b;
  --asking: #a87f0e;
  --submitted: #6a4fa3;
  --approved: #2f7d4f;
  --held: #8a3b5c;
  --focus: #2d5d9f;
  /* 角色色：按角色名固定分配，前端/后端等常用名有固定颜色 */
  --role-0: #1d6f8c; --role-1: #9c4f1c; --role-2: #5b6b1e; --role-3: #7a3f8f; --role-4: #a3324a; --role-5: #3d5a99;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141a17;
    --surface: #1c2420;
    --sunken: #101512;
    --ink: #e3e9e2;
    --muted: #93a197;
    --line: #2f3a34;
    --pending: #7d877f;
    --working: #6d9be0;
    --rework: #e08a5f;
    --asking: #d9b44a;
    --submitted: #a88ee0;
    --approved: #5fbf86;
    --held: #d27a9f;
    --focus: #6d9be0;
    --role-0: #5cb8d6; --role-1: #e39a62; --role-2: #a9bd5a; --role-3: #c58ad8; --role-4: #e57890; --role-5: #8ea9e8;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  font-variant-numeric: tabular-nums;
  min-height: 100vh;
}
button { font: inherit; color: inherit; }
.meta { color: var(--muted); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

header.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px;
  padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--surface);
}
header.top h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: .02em; }
.workers { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
.worker {
  appearance: none; display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 11px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--bg); color: var(--ink); font: inherit; font-size: 12.5px; line-height: 1;
}
.worker .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--approved); flex: none; }
.worker .task { color: var(--muted); }
.worker.offline { color: var(--muted); opacity: .6; }
/* leader 标签：放在最前面，和 worker 之间留一道间隔；未连接时红点 */
.leader-chip { margin-right: 6px; }
.leader-chip.offline-lead { border-color: color-mix(in srgb, var(--rework) 45%, var(--line)); }
.leader-chip.offline-lead .dot { background: var(--rework); }
.leader-chip.offline-lead .task { color: var(--rework); }
button.worker { cursor: pointer; }
button.worker:hover { border-color: var(--muted); }
.helper-btn { margin-left: auto; }
.btn.attention { border-color: var(--rework); color: var(--rework); font-weight: 600; }
.btn.attention[hidden] { display: none; }
.att-modal { width: min(640px, 100%); }
.att-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.att-head h4 { font-size: 13px; color: var(--muted); margin: 16px 0 6px; font-weight: 600; }
.att-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; }
.att-pick { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; }
.att-pick input { margin-top: 3px; }
.btn.attention + .helper-btn, #notify-btn + .helper-btn { margin-left: 0; }
#notify-btn[hidden] { display: none; }
/* 提示词面板：顶部右侧弹出 */
.helper {
  position: fixed; top: 56px; right: 16px; z-index: 15; width: min(520px, calc(100vw - 32px));
  max-height: calc(100vh - 80px); overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 12px 32px rgba(15, 25, 20, .22); padding: 14px 16px 16px;
}
.helper[hidden] { display: none; }
.rules-editor {
  display: block; width: 100%; margin-top: 8px; padding: 10px 12px; resize: vertical;
  border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink);
  font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
}
.rules-actions { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.btn:disabled { opacity: .45; cursor: default; }
.helper-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.helper-head b { font-size: 15px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 8px 0 10px; }
.tab {
  appearance: none; border: none; background: none; cursor: pointer; font: inherit; font-size: 13px;
  color: var(--muted); padding: 6px 14px; margin-bottom: -1px; border-bottom: 2px solid transparent;
}
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
.helper-sec { display: flex; align-items: center; gap: 8px; margin: 18px 0 2px; }
.helper-sec h4 { font-size: 13px; color: var(--muted); margin: 0; font-weight: 600; margin-right: auto; }
.helper .hint { margin: 2px 0 0; }
/* 每个 worker 一张卡片：上面一行信息 + 操作，下面是提示词 */
.wcard { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px 12px; margin-top: 10px; }
.wcard.focus { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
.wcard-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.wcard-head .grow { margin-right: auto; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.pill { padding: 1px 7px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: color-mix(in srgb, var(--asking) 18%, transparent); color: var(--asking); }

.worker.offline .dot { background: var(--pending); }
.worker .meta { color: var(--muted); }
.banner { padding: 8px 20px; background: var(--rework); color: #fff; font-size: 13px; }
.banner[hidden] { display: none; }
.banner.stale { background: var(--asking); }
.needs { padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line); border-left: 4px solid var(--asking); }
.needs[hidden] { display: none; }
.needs-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.needs-row + .needs-row { margin-top: 8px; }
.needs b { font-weight: 600; }
.prompt { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 6px; }
/* 提示词块：文字铺满，复制按钮嵌在右上角 */
.pblock { position: relative; margin-top: 8px; }
.pblock code {
  display: block; background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 64px 10px 12px; user-select: all; white-space: pre-wrap; line-height: 1.6; font-size: 12.5px;
}
.pblock .btn { position: absolute; top: 6px; right: 6px; }
/* 按钮：统一高度；primary 实色，ghost 无边框 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  height: 28px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--sunken); }
.btn.sm { height: 24px; padding: 0 9px; font-size: 12px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--sunken); color: var(--ink); }
.btn.done { border-color: var(--approved); color: var(--approved); }
.hint { color: var(--muted); font-size: 12.5px; }

.layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: calc(100vh - 56px); }
nav.jobs { border-right: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; gap: 6px; }
nav.jobs h2, main h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
.job {
  display: block; width: 100%; text-align: left; cursor: pointer;
  padding: 10px 12px; border: 1px solid transparent; border-radius: 8px; background: none;
}
.job:hover { background: var(--surface); }
.job[aria-current="true"] { background: var(--surface); border-color: var(--line); }
.job .title { font-weight: 600; }
.job .sub .accepted { color: var(--approved); font-weight: 600; }
.accepted-toggle {
  display: flex; align-items: center; gap: 6px; width: 100%; margin-top: 10px; padding: 8px 12px;
  border: none; border-top: 1px solid var(--line); background: none; cursor: pointer;
  color: var(--muted); font-size: 13px; font-weight: 600; text-align: left;
}
.accepted-toggle:hover { color: var(--ink); }
.report-bar .hint { flex-basis: 100%; color: var(--muted); font-size: 12.5px; }
.job .sub { color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; margin-top: 4px; }

/* 需求进度：每个任务一格，按状态着色 */
.strip { display: flex; gap: 2px; margin-top: 8px; height: 8px; }
.strip span { flex: 1; border-radius: 2px; background: var(--pending); opacity: .45; }
.strip span.s-approved { background: var(--approved); opacity: 1; }
.strip span.s-working { background: var(--working); opacity: .9; }
.strip span.s-rework { background: var(--rework); opacity: .9; }
.strip span.s-asking { background: var(--asking); opacity: .9; }
.strip span.s-submitted { background: var(--submitted); opacity: .9; }
.strip span.s-held { background: var(--held); opacity: .9; }
.strip.big { height: 14px; gap: 3px; margin: 14px 0 6px; }

main { padding: 20px 24px 40px; min-width: 0; }
.empty { color: var(--muted); padding: 40px 0; max-width: 46ch; }
.job-head h2.job-title { font-size: 22px; color: var(--ink); font-weight: 650; margin: 0; }
.job-head .desc { color: var(--muted); margin: 4px 0 0; max-width: 72ch; white-space: pre-wrap; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 22px; color: var(--muted); font-size: 13px; margin-bottom: 18px; }
.stats b { color: var(--ink); font-weight: 600; }

/* 需求页上的汇报提示条：一行，点按钮进入阅读页 */
.report-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--approved);
  border-radius: 8px; padding: 10px 14px; margin-bottom: 20px;
}
.report-bar .what { font-weight: 600; color: var(--approved); }
.report-bar .when { color: var(--muted); font-size: 12.5px; margin-right: auto; }
.btn.primary { background: var(--approved); border-color: var(--approved); color: #fff; font-weight: 600; }
.btn.primary:hover { background: var(--approved); filter: brightness(1.08); }
.btn.warn { background: var(--rework); border-color: var(--rework); color: #fff; font-weight: 600; }
.btn.warn:hover { background: var(--rework); filter: brightness(1.08); }

/* 汇报阅读页：全屏，正文居中 */
.modal-back { position: fixed; inset: 0; z-index: 30; background: rgba(15, 25, 20, .35); display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal-back[hidden] { display: none; }
.modal {
  width: min(560px, 100%); max-height: calc(100vh - 32px); overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 16px 40px rgba(15, 25, 20, .3); padding: 18px 20px;
}
.modal h3 { margin: 0 0 4px; font-size: 16px; }
.modal .stale-item + .stale-item { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 14px; }
.modal .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.report-page { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; }
.report-page[hidden] { display: none; }
.report-top {
  position: sticky; top: 0; display: flex; align-items: center; gap: 14px;
  padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.report-top .crumb { color: var(--muted); font-size: 13px; margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.report-sheet {
  max-width: 760px; margin: 32px auto 80px; padding: 36px 48px 44px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
.report-meta { display: flex; flex-wrap: wrap; gap: 6px 20px; color: var(--muted); font-size: 13px; padding-bottom: 18px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
.report-meta b { color: var(--ink); font-weight: 600; }
.report-sheet .md { font-size: 15px; line-height: 1.8; }
.report-sheet .md h1 { font-size: 24px; line-height: 1.35; margin: 18px 0 14px; }
.report-sheet .md h2 { font-size: 18px; margin: 30px 0 10px; padding-top: 4px; }
.report-sheet .md h3 { font-size: 15.5px; margin: 22px 0 8px; }
.report-sheet .md li { margin: 4px 0; }
.report-sheet .md code { font-size: 13px; }
@media (max-width: 700px) { .report-sheet { margin: 0; border: none; border-radius: 0; padding: 20px 16px 40px; } }

.board { display: grid; grid-template-columns: repeat(7, minmax(168px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.lane { background: var(--sunken); border-radius: 8px; padding: 8px; min-height: 120px; }
.lane h3 { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 600; margin: 2px 4px 8px; }
.lane h3 .n { color: var(--muted); font-weight: 400; }
.lane h3::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--c); align-self: center; margin-right: 6px; }
.lane h3 .label { margin-right: auto; }
.card {
  display: block; width: 100%; text-align: left; cursor: pointer; margin-bottom: 6px;
  background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--c);
  border-radius: 6px; padding: 8px 10px;
}
.card:hover { border-color: var(--c); }
.card .id { color: var(--muted); font-size: 12px; }
.card .t { font-weight: 600; margin: 2px 0 6px; overflow-wrap: anywhere; }
.card .m { display: flex; flex-wrap: wrap; gap: 4px; font-size: 11.5px; }
.tag { padding: 0 6px; border-radius: 4px; background: var(--sunken); color: var(--muted); }
.role { color: #fff; background: var(--rc); font-weight: 600; }
@media (prefers-color-scheme: dark) { .role { color: #101512; } }
.role-text { color: var(--rc); font-weight: 600; }
.tag.warn { background: var(--rework); color: #fff; }
.tag.handoff { background: var(--asking); color: #fff; }
.tag.urgent { background: var(--rework); color: #fff; }
.tag.assigned { background: var(--focus); color: #fff; }
.tag.critique { background: color-mix(in srgb, var(--role-5) 22%, transparent); color: var(--ink); }
.critique { background: var(--bg); border-radius: 6px; padding: 8px 12px; margin-top: 8px; font-size: 13px; }
.critique .reply { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 4px; }
.assign-select {
  width: 100%; height: 32px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--ink); font: inherit; font-size: 13px;
}

/* 任务详情抽屉 */
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw);
  background: var(--surface); border-left: 1px solid var(--line);
  box-shadow: -12px 0 32px rgba(15, 25, 20, .18);
  overflow-y: auto; padding: 18px 22px 40px; z-index: 10;
  transform: translateX(0); transition: transform .18s ease-out, width .18s ease-out;
}
.drawer.wide { width: min(1100px, 80vw); }
@media (max-width: 900px) { .drawer.wide { width: 100vw; } }
.drawer[hidden] { display: block; transform: translateX(105%); visibility: hidden; }
.drawer-tools { float: right; display: flex; gap: 6px; }
.drawer .close, .drawer .widen { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 2px 10px; cursor: pointer; }
.drawer .widen { font-size: 15px; line-height: 1.3; min-width: 34px; }
.drawer h2 { font-size: 18px; color: var(--ink); margin: 4px 0 4px; }
.drawer h4 { font-size: 13px; color: var(--muted); margin: 18px 0 6px; font-weight: 600; }
.drawer .facts { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; font-size: 13px; }
.drawer .facts dt { color: var(--muted); }
.drawer .facts dd { margin: 0; overflow-wrap: anywhere; }
.drawer .descbox { background: var(--bg); border-radius: 6px; padding: 4px 14px; font-size: 13px; line-height: 1.65; }
.drawer .descbox.md pre, .drawer .descbox.md code { background: var(--surface); }
.drawer ol, .drawer ul.commits { margin: 0; padding-left: 20px; }
code, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
.timeline { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--line); }
.timeline li { position: relative; padding: 0 0 12px 14px; }
.timeline li::before {
  content: ""; position: absolute; left: -6px; top: 6px; width: 10px; height: 10px;
  border-radius: 50%; background: var(--surface); border: 2px solid var(--c, var(--pending));
}
.timeline .when { color: var(--muted); font-size: 12px; }
.timeline .what { font-weight: 600; font-size: 13px; }
.timeline .text { white-space: pre-wrap; font-size: 13px; overflow-wrap: anywhere; }

.md h1, .md h2, .md h3 { color: var(--ink); margin: 14px 0 6px; }
.md h1 { font-size: 19px; } .md h2 { font-size: 16px; } .md h3 { font-size: 14px; }
.md p { margin: 6px 0; }
.md ul, .md ol { margin: 6px 0; padding-left: 22px; }
.md pre { background: var(--bg); padding: 10px 12px; border-radius: 6px; overflow-x: auto; }
/* 长路径、长链接、长行内代码在任意处折行，不撑出容器 */
.md { overflow-wrap: anywhere; }
.md code { background: var(--bg); padding: 0 4px; border-radius: 3px; overflow-wrap: anywhere; word-break: break-all; }
.md pre code { background: none; padding: 0; word-break: normal; }
.md li { margin: 2px 0; }
.md ul ul, .md ol ul, .md ul ol, .md ol ol { margin: 2px 0; }
.md blockquote { margin: 6px 0; padding: 2px 10px; border-left: 3px solid var(--line); color: var(--muted); }
.md table { border-collapse: collapse; margin: 8px 0; font-size: 12.5px; display: block; max-width: 100%; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
.md a { color: var(--focus); }
.job-head .desc.md { white-space: normal; }
.job-head .desc.md p { margin: 2px 0; }

.c-pending { --c: var(--pending); } .c-working { --c: var(--working); } .c-rework { --c: var(--rework); }
.c-asking { --c: var(--asking); } .c-submitted { --c: var(--submitted); } .c-approved { --c: var(--approved); }
.c-held { --c: var(--held); }
.c-cancelled { --c: var(--pending); }
/* 已作废：放在看板最下面，置灰 */
.cancelled-box { margin-top: 18px; }
.cancelled-box h3 { font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 0 0 8px; }
.cancelled-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.card.cancelled { opacity: .5; filter: grayscale(1); margin-bottom: 0; }
.card.cancelled .t { text-decoration: line-through; font-weight: 500; }
.card.cancelled:hover { opacity: .8; }

/* 宽屏：页面本身不滚动，需求列表和看板各自滚动。
   否则页面滚动条和抽屉的滚动条会在右边并排出现两条 */
@media (min-width: 901px) {
  body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  body > header.top, body > .needs, body > .banner { flex: none; }
  .layout { flex: 1; min-height: 0; grid-template-rows: minmax(0, 1fr); }
  .needs { max-height: 40vh; overflow-y: auto; }
  nav.jobs, main { overflow-y: auto; scrollbar-width: thin; }
}
.drawer, .helper { scrollbar-width: thin; overscroll-behavior: contain; }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  nav.jobs { border-right: none; border-bottom: 1px solid var(--line); }
  main { padding: 16px; }
  .board { grid-template-columns: 1fr; overflow-x: visible; }
  .lane { min-height: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .drawer { transition: none; }
}
</style>
</head>
<body>
<header class="top">
  <h1>ateam 调度台</h1>
  <div class="workers" id="workers"></div>
  <button class="btn attention" id="attention" type="button" hidden></button>
  <button class="btn" id="notify-btn" type="button" hidden title="允许浏览器弹通知：有需求待验收、任务缺 worker、leader 掉线时提醒你">开启通知</button>
  <button class="btn helper-btn" id="helper-btn" type="button">使用说明</button>
</header>
<section class="needs" id="needs" hidden aria-label="需要 worker"></section>

<script>
'use strict';

const LANES = [
  { key: 'pending', label: '待领取' },
  { key: 'working', label: '进行中' },
  { key: 'rework', label: '返工中' },
  { key: 'asking', label: '等待答复' },
  { key: 'submitted', label: '待 review' },
  { key: 'approved', label: '已通过' },
  { key: 'held', label: '已挂起' },
];
const LANE_LABEL = { ...Object.fromEntries(LANES.map((l) => [l.key, l.label])), cancelled: '已作废' };
const JOB_STATUS = { planning: '规划中', active: '进行中', awaiting_acceptance: '待你验收', accepted: '已验收' };
let acceptArm = null; // 「验收通过」两步确认：记需求编号

async function acceptJob(id) {
  try {
    await fetch('/api/jobs/accept', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ ids: [id] }) });
  } catch {}
  acceptArm = null;
  await poll();
}

// 待验收需求的「验收通过」按钮，点两次生效
function acceptButtons(job) {
  if (job.status !== 'awaiting_acceptance') return null;
  if (acceptArm !== job.id) {
    return el('button', { class: 'btn', onclick: (e) => { e.stopPropagation(); acceptArm = job.id; render(); } }, '验收通过');
  }

  ];
}
const ACCEPT_HINT = '测过没问题就点「验收通过」；有问题就在对话里告诉 leader 哪里不对，它会在这个需求下加修复任务。';
const HISTORY = {
  created: ['创建', 'pending'], claimed: ['领取', 'working'], progress: ['进度', 'working'],
  asked: ['提问', 'asking'], answered: ['答复', 'asking'], submitted: ['交付', 'submitted'],
  approved: ['通过', 'approved'], rejected: ['打回', 'rework'], handoff: ['掉线交接', 'held'],
  held: ['挂起', 'held'], released: ['放回', 'pending'], edited: ['修改', 'pending'], cancelled: ['作废', 'cancelled'],
};

let data = null;
let lastJson = '';
let lastEtag = '';
let view = { job: null, task: null, report: false };
let showPrompts = false;
let copied = null; // 刚复制的提示词，用来显示「已复制」
// 抽屉是否展开到大半屏；记在本浏览器里，下次打开保持
let drawerWide = false;
try { drawerWide = localStorage.getItem('ateam.drawerWide') === '1'; } catch {}

// ---------- 小工具 ----------

// 用一组子节点替换 node 的内容；嵌套数组会展开，null/false 跳过，字符串转成文本
function fill(node, ...children) {
  node.replaceChildren(...children.flat(Infinity).filter((c) => c != null && c !== false));
}

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat(Infinity)) {
    if (c == null || c === false) continue;
    node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return node;
}

const pad = (n) => String(n).padStart(2, '0');
function fmtTime(ts) {
  const d = new Date(ts);
  return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function ago(ts) {
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (s < 60) return `${s} 秒前`;
  if (s < 3600) return `${Math.floor(s / 60)} 分钟前`;
  return `${Math.floor(s / 3600)} 小时前`;
}

function laneOf(t) {
  if (t.status === 'working' && t.rejectCount > 0) return 'rework';
  return t.status;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// 极简 markdown：先转义 HTML，再处理标题、列表、代码块、行内代码、粗体
// 极简 markdown：先转义 HTML，再处理标题、（可嵌套的）列表、代码块、表格、引用、行内代码、粗体、链接
function renderMarkdown(src) {
  const lines = escapeHtml(String(src ?? '').replace(/\t/g, '  ')).split('\n');
  const out = [];
  const stack = []; // 打开的列表：{ tag, indent }
  let para = [];
  const inline = (t) => t
    .replace(/`([^`]+)`/g, (_, c) => `<code>${c.replace(/\*/g, '&#42;')}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const flushPara = () => { if (para.length) { out.push(`<p>${para.map(inline).join('<br>')}</p>`); para = []; } };
  const closeLists = (indent = -1) => {
    while (stack.length && stack[stack.length - 1].indent > indent) out.push(`</li></${stack.pop().tag}>`);
  };
  const closeAll = () => { flushPara(); closeLists(); };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    let m;
    if ((m = line.match(/^(\s*)```/))) {
      closeAll();
      const code = [];
      while (++i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i].slice(m[1].length));
      out.push(`<pre><code>${code.join('\n')}</code></pre>`);
      continue;
    }
    if (!line.trim()) { flushPara(); continue; }
    if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { closeAll(); const n = Math.min(m[1].length, 3); out.push(`<h${n}>${inline(m[2])}</h${n}>`); continue; }
    if ((m = line.match(/^\s*&gt;\s?(.*)$/))) { closeAll(); out.push(`<blockquote>${inline(m[1])}</blockquote>`); continue; }
    if (/^\s*\|.*\|\s*$/.test(line)) {
      closeAll();
      const rows = [];
      for (; i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i]); i++) rows.push(lines[i]);
      i--;
      const cells = (r) => r.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
      const body = rows.filter((r) => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      const head = rows.length > 1 && /^\s*\|[\s:|-]+\|\s*$/.test(rows[1]) ? body.shift() : null;
      out.push(`<table>${head ? `<thead><tr>${cells(head).map((c) => `<th>${inline(c)}</th>`).join('')}</tr></thead>` : ''}<tbody>${body.map((r) => `<tr>${cells(r).map((c) => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
      continue;
    }
    if ((m = line.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/))) {
      flushPara();
      const indent = m[1].length;
      const tag = /\d/.test(m[2]) ? 'ol' : 'ul';
      closeLists(indent);
      const top = stack[stack.length - 1];
      if (top && top.indent === indent && top.tag === tag) out.push('</li><li>');
      else {
        if (top && top.indent === indent) out.push(`</li></${stack.pop().tag}>`);
        out.push(`<${tag}><li>`);
        stack.push({ tag, indent });
      }
      out.push(inline(m[3]));
      continue;
    }
    // 列表项下面缩进的续行，归到当前列表项
    if (stack.length && /^\s+/.test(line)) { out.push(`<br>${inline(line.trim())}`); continue; }
    closeLists();
    para.push(line.trim());
  }
  closeAll();
  return out.join('\n');
}

function strip(tasks, big) {
  return el('div', { class: big ? 'strip big' : 'strip', 'aria-hidden': 'true' },
    tasks.map((t) => el('span', { class: `s-${laneOf(t)}`, title: `${t.id} ${LANE_LABEL[laneOf(t)]}` })));
}

function reviewStats(tasks) {
  let reviews = 0;
  let rejects = 0;
  for (const t of tasks) {
    for (const h of t.history) {
      if (h.type === 'approved') reviews++;
      if (h.type === 'rejected') { reviews++; rejects++; }
    }
  }
  const approved = tasks.filter((t) => t.status === 'approved');
  const firstPass = approved.filter((t) => t.rejectCount === 0).length;
  const rate = approved.length ? `${Math.round((firstPass / approved.length) * 100)}%` : '—';
  return { reviews, rejects, rate, approved: approved.length };
}

// ---------- 渲染 ----------

function renderWorkers() {
  const box = document.getElementById('workers');
  const agents = data.state.agents;
  // 掉线的 worker 不再占位：只显示在线的，掉线的折叠成一个灰色计数，鼠标悬停可看编号
  const online = agents.filter((a) => a.status === 'online');
  const offline = agents.filter((a) => a.status !== 'online' && !a.hidden);
  const leader = data.leader || {};
  const leaderChip = el('button', {
    type: 'button',
    class: `worker leader-chip ${leader.online ? 'online' : 'offline-lead'}`,
    title: leader.online
      ? (leader.watching ? 'leader 在线，正在监听事件。点击查看 leader 的提示词' : `leader ${ago(leader.lastSeenAt)}操作过，但没有在监听事件。点击查看提示词`)
      : 'leader 没有连接：没有在监听事件，最近 3 分钟也没有操作。点击查看加入的提示词',
    onclick: (e) => { e.stopPropagation(); helper = { open: true, focus: null, tab: 'lead' }; renderHelper(); },
  }, el('span', { class: 'dot' }), el('b', null, 'leader'), el('span', { class: 'task' }, leader.online ? (leader.watching ? '在线' : '在线，未监听') : '未连接'));
  // 审卡 worker 和 leader 一样常驻，紧挨着 leader 放
  const isCriticAgent = (a) => a.role.trim().toLowerCase() === 'critic';
  const chips = [leaderChip, ...[...online.filter(isCriticAgent), ...online.filter((a) => !isCriticAgent(a))].map((a) => {
    return el('button', {
      type: 'button',
      class: 'worker online',
      title: `${agentLabel(a.id)}，心跳 ${ago(a.lastSeenAt)}。点击查看提示词`,
      onclick: (e) => { e.stopPropagation(); helper = { open: true, focus: a.id }; renderHelper(); },
    },
    el('span', { class: 'dot' }),
    // 新编号本身带角色（frontend-2），就不再单独写角色，只按角色上色；老编号（fr-cbb7）照旧显示角色
    el('b', { class: 'role-text', style: roleStyle(a.role) }, a.name || a.id),
    a.name ? el('span', { class: 'task' }, a.id) : null,
    idHasRole(a) ? null : el('span', { class: 'role-text', style: roleStyle(a.role) }, a.role),
    el('span', { class: 'task' }, isCriticAgent(a) ? '审卡' : a.currentTask ? (a.dismiss ? `${a.currentTask}，做完下线` : a.currentTask) : (a.leaveAsked ? '空闲，申请下线' : '空闲')),
  );
  })];
  if (offline.length) {
    chips.push(el('button', {
      type: 'button', class: 'worker offline', title: '点击查看和移除掉线的 worker',
      onclick: (e) => { e.stopPropagation(); helper = { open: true, focus: null, mode: 'offline' }; renderHelper(); },
    }, el('span', { class: 'dot' }), `${offline.length} 个已掉线`));
  }
  if (chips.length === 1) chips.push(el('span', { class: 'meta' }, '还没有 worker 加入。点右边「使用说明」，按步骤开 leader 和 worker。'));
  box.replaceChildren(...chips);
  renderHelper();
}

// 在线 worker 超过 3 分钟没有任何动静（挂着 wait 的 worker 最多 90 秒就会刷新一次心跳）→ 多半停住了
const STALE_MS = 3 * 60 * 1000;
function isStale(a) {
  return a.status === 'online' && Date.now() - a.lastSeenAt > STALE_MS;
}

let helper = { open: false, focus: null };
let dismissAllArm = false; // 「全部下线」两步确认
let dismissArm = null; // 单个 worker 下线的两步确认（手上有任务，或是本角色最后一个时）

// 本角色唯一在线的 worker（已安排「做完再下线」的不算）：每个角色至少留一个，下线前要用户确认
function isLastOfRole(a) {
  if (a.dismiss) return false;
  const role = a.role.trim().toLowerCase();
  return data.state.agents.filter((x) => x.status === 'online' && !x.dismiss && x.role.trim().toLowerCase() === role).length === 1;
}

function dismissButtons(a) {
  const stop = (fn) => (e) => { e.stopPropagation(); fn(); };
  const last = isLastOfRole(a);
  const lastTip = last ? `${a.role} 角色只剩它一个，下线后这个角色的新任务没人领` : '';
  // 已安排做完再下线：可以撤销，或改成立即下线
  if (a.dismiss) {
    return [
      el('button', { class: 'btn ghost sm', title: '撤销「做完再下线」，它会继续领新任务', onclick: stop(() => keepAgents([a.id])) }, '撤销'),
      el('button', { class: 'btn ghost sm', title: '立即下线；进行中的任务退回待领取', onclick: stop(() => dismissAgents({ ids: [a.id], userApproved: true })) }, '立即下线'),
    ];
  }
  if (dismissArm !== a.id) {
    return el('button', {
      class: 'btn ghost sm',
      onclick: stop(() => {
        // 手上有任务（可以选做完再下线），或是本角色最后一个 worker：先确认
        if (a.currentTask || last) { dismissArm = a.id; renderHelper(); return; }
        dismissAgents({ ids: [a.id] });
      }),
    }, '下线');
  }
  const cancel = el('button', { class: 'btn ghost sm', onclick: stop(() => { dismissArm = null; renderHelper(); }) }, '取消');
  const suffix = last ? `（${a.role} 最后一个）` : '';
  if (!a.currentTask) {
    return [cancel, el('button', {
      class: 'btn warn sm', title: lastTip,
      onclick: stop(() => { dismissArm = null; dismissAgents({ ids: [a.id], userApproved: true }); }),
    }, `确认下线${suffix}`)];
  }
  return [
    cancel,
    el('button', {
      class: 'btn sm', title: `做完 ${a.currentTask}（通过或作废）后下线，期间不领新任务。${lastTip}`,
      onclick: stop(() => { dismissArm = null; dismissAgents({ ids: [a.id], userApproved: true, afterTask: true }); }),
    }, `做完 ${a.currentTask} 再下线`),
    el('button', {
      class: 'btn warn sm', title: `马上停下，${a.currentTask} 若还在进行中就退回待领取。${lastTip}`,
      onclick: stop(() => { dismissArm = null; dismissAgents({ ids: [a.id], userApproved: true }); }),
    }, `立即下线${suffix}`),
  ];
}

// 手上的任务被作废、但 worker 还没收到通知（它正在干活，要等下一次调用 ateam 命令才知道）。
// 用户可以在 agent 窗口里点停止，把这句话发过去，让它马上停手。
function pendingCancel(a) {
  if (a.status !== 'online' || !a.cancelNotice?.wasWorking) return null;
  return data.state.tasks.find((t) => t.id === a.cancelNotice.taskId) || null;
}

function stopPrompt(a, t) {
  return `停下。你手上的任务 ${t.id} 已被作废，立即停手，不要提交。把你为它做的改动还原掉，只动你自己改过的文件：改过的已有文件逐个 git checkout -- <文件路径>，你新建的文件逐个删掉；不要用 git clean、git stash，也不要对整个目录 checkout，同一目录里可能有别人正在改的文件。然后运行 ateam wait --as ${a.id} 回到主循环，中途不要停下来汇报。`;
}

function wakePrompt(a) {
  const doing = a.currentTask ? `继续做 ${a.currentTask}，做完提交后` : '';
  return `继续。你是 ateam worker ${a.id}（角色 ${a.role}）。${doing}运行 ateam wait --as ${a.id} 回到主循环，中途不要停下来汇报。如果提示租约已失效，就重新 ateam join --role ${a.role} --id ${a.id}${a.name ? ` --name ${a.name}` : ''}。`;
}


async function dismissAgents(body) {
  try {
    await fetch('/api/dismiss', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  } catch {}
  await poll();
  renderHelper();
}

async function keepAgents(ids) {
  try {
    await fetch('/api/agents/keep', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ ids }) });
  } catch {}
  await poll();
  renderHelper();
}

async function hideAgents(ids) {
  try {
    await fetch('/api/agents/hide', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ ids }) });
  } catch {}
  await poll();
}

let reconnectOpen = null; // 展开了重连提示词的掉线 worker 编号

// 掉线的 worker 窗口还在时，发给它的那句话：旧编号已失效，重新加入后接着主循环
function reconnectPrompt(a) {
  const name = a.name ? ` --name ${a.name}` : '';
  const dir = data.root ? `项目目录是 ${data.root}。` : '';
  return `继续。你是 ateam worker ${a.id}（角色 ${a.role}），已经掉线。${dir}请按 ateam-worker skill 运行 ateam join --role ${a.role} --id ${a.id}${name} 重新加入（沿用原编号），然后进入 ateam wait 主循环；如果领到「⚠ 接手任务」，先看历史和 git status，在已有改动上继续。中途不要停下来汇报。`;
}

function renderOfflinePanel(panel) {
  const offline = data.state.agents.filter((a) => a.status !== 'online' && !a.hidden)
    .sort((x, y) => y.lastSeenAt - x.lastSeenAt);
  const close = () => { helper = { open: false, focus: null }; renderHelper(); };
  if (!offline.length) { close(); return; }
  fill(panel,
    el('div', { class: 'helper-head' },
      el('b', null, `掉线的 worker（${offline.length}）`),
      el('span', { class: 'prompt', style: 'margin: 0' },
        el('button', { class: 'btn sm', onclick: (e) => { e.stopPropagation(); hideAgents(offline.map((a) => a.id)); } }, '全部移除'),
        el('button', { class: 'btn ghost sm', onclick: (e) => { e.stopPropagation(); close(); } }, '关闭'))),
    el('p', { class: 'hint' }, '窗口还在：点「重连」，把提示词发到它自己的 agent 窗口，它会用原编号重新加入、接着干活。窗口没了：点「移除」，只是不再显示，任务时间线里的记录保留。'),
    offline.map((a) => el('div', { class: 'wcard' },
      el('div', { class: 'wcard-head' },
        el('span', { class: 'grow' },
          el('b', null, agentLabel(a.id)),
          el('span', { class: 'role-text', style: roleStyle(a.role) }, a.role),
          el('span', { class: 'hint' }, `最后心跳 ${ago(a.lastSeenAt)}`)),
        el('button', {
          class: reconnectOpen === a.id ? 'btn primary sm' : 'btn sm',
          onclick: (e) => { e.stopPropagation(); reconnectOpen = reconnectOpen === a.id ? null : a.id; renderHelper(); },
        }, '重连'),
        el('button', { class: 'btn ghost sm', onclick: (e) => { e.stopPropagation(); hideAgents([a.id]); } }, '移除')),
      reconnectOpen === a.id ? promptBlock(reconnectPrompt(a), renderHelper) : null)));
  panel.hidden = false;
}

// 项目规则编辑器的状态。规则不在 /api/state 里，进入「项目规则」页时单独读取
let rules = { loaded: false, saved: '', draft: '', status: '' };

async function loadRules() {
  try {
    const res = await fetch('/api/rules', { cache: 'no-store' });
    const json = await res.json();
    const saved = json.rules || '';
    // 上次没保存的草稿保留着（比如按 Esc 关了面板）
    const keepDraft = rules.loaded && rules.draft !== rules.saved;
    rules = { loaded: true, saved, draft: keepDraft ? rules.draft : saved, status: keepDraft ? '有未保存的修改。' : '' };
  } catch {
    rules = { ...rules, loaded: true, status: '读取失败，请确认服务在运行（规则功能需要新版服务）。' };
  }
  renderHelper(true);
}

async function saveRules() {
  try {
    const res = await fetch('/api/rules', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text: rules.draft }) });
    const json = await res.json();
    if (!json.ok) throw new Error(json.message);
    rules = { loaded: true, saved: json.rules, draft: json.rules, status: '已保存。之后派发的任务都会带上。' };
  } catch (err) {
    rules = { ...rules, status: `保存失败：${err.message}` };
  }
  renderHelper(true);
}

function rulesEditor() {
  if (!rules.loaded) return el('p', { class: 'hint' }, '读取中……');
  const dirty = rules.draft !== rules.saved;
  const area = el('textarea', {
    class: 'rules-editor', rows: '14', spellcheck: 'false',
    placeholder: '比如：\n- 不写新的测试代码\n- 提交前先跑一遍编译，编译通过再提交\n- 新文件沿用旁边文件的代码风格',
  });
  area.value = rules.draft;
  area.addEventListener('input', () => {
    rules.draft = area.value;
    const changed = rules.draft !== rules.saved;
    saveBtn.disabled = !changed;
    resetBtn.disabled = !changed;
  });
  const saveBtn = el('button', { class: 'btn primary sm', disabled: !dirty, onclick: (e) => { e.stopPropagation(); saveRules(); } }, '保存');
  const resetBtn = el('button', { class: 'btn ghost sm', disabled: !dirty, onclick: (e) => { e.stopPropagation(); rules = { ...rules, draft: rules.saved, status: '' }; renderHelper(true); } }, '还原');
  return [
    el('p', { class: 'hint' }, '每个任务都要遵守的约定。worker 领到任务时，这里的内容会自动附在任务后面，leader 不用在每个任务里重复写。一行一条，支持 markdown。'),
    area,
    el('div', { class: 'rules-actions' }, saveBtn, resetBtn, rules.status ? el('span', { class: 'hint' }, rules.status) : null),
    el('p', { class: 'hint' }, '保存在项目的 .ateam/rules.md。leader 也可以用 ateam rules add "<一条规则>" 添加。'),
  ];
}

function renderHelper(force = false) {
  const panel = document.getElementById('helper');
  if (!helper.open || !data) { panel.hidden = true; panel.replaceChildren(); return; }
  // 正在编辑规则：轮询刷新不重画面板，免得输入框被替换、打字丢失
  if (!force && helper.tab === 'rules' && panel.querySelector('.rules-editor')) return;
  if (helper.mode === 'offline') { renderOfflinePanel(panel); return; }
  const { agents, tasks } = data.state;
  const online = agents.filter((a) => a.status === 'online');
  const offline = agents.filter((a) => a.status !== 'online' && !a.hidden)
    .sort((x, y) => y.lastSeenAt - x.lastSeenAt);
  // 角色：标准四个角色 + 还没完成的任务用到的角色 + 所有（未移除的）worker 用过的角色
  const roles = new Map(STANDARD_ROLES.map((r) => [r.key, r.key]));
  for (const t of tasks) if (t.status !== 'approved' && t.status !== 'cancelled') roles.set(t.role.trim().toLowerCase(), t.role);
  for (const a of agents) if (!a.hidden) roles.set(a.role.trim().toLowerCase(), a.role);
  const ordered = online.slice().sort((x, y) => (y.id === helper.focus) - (x.id === helper.focus) || isStale(y) - isStale(x));
  const closeBtn = el('button', { class: 'btn ghost sm', onclick: (e) => { e.stopPropagation(); helper = { open: false, focus: null }; dismissAllArm = false; renderHelper(); } }, '关闭');
  const dismissAll = online.length ? [
    dismissAllArm ? el('button', { class: 'btn ghost sm', onclick: (e) => { e.stopPropagation(); dismissAllArm = false; renderHelper(); } }, '取消') : null,
    el('button', {
      class: dismissAllArm ? 'btn warn sm' : 'btn sm',
      title: '所有 worker 立即下线；进行中的任务退回待领取',
      onclick: (e) => {
        e.stopPropagation();
        if (!dismissAllArm) { dismissAllArm = true; renderHelper(); return; }
        dismissAllArm = false;
        dismissAgents({ all: true, userApproved: true });
      },
    }, dismissAllArm ? '确认全部下线' : '全部下线'),
  ] : null;
  const tab = ['lead', 'install', 'rules'].includes(helper.tab) ? helper.tab : 'worker';
  const tabBtn = (key, label) => el('button', {
    type: 'button', role: 'tab', class: `tab${tab === key ? ' on' : ''}`, 'aria-selected': tab === key ? 'true' : 'false',
    onclick: (e) => {
      e.stopPropagation();
      helper = { ...helper, tab: key };
      dismissAllArm = false;
      if (key === 'rules') loadRules();
      renderHelper(true);
    },
  }, label);
  fill(panel,
    el('div', { class: 'helper-head' }, el('b', null, '使用说明'), closeBtn),
    el('div', { class: 'tabs', role: 'tablist' }, tabBtn('worker', 'worker'), tabBtn('lead', 'leader'), tabBtn('install', '安装'), tabBtn('rules', '项目规则')),
    tab === 'rules' ? null : el('p', { class: 'hint' }, data.root ? `项目目录：${data.root}。每段话发到对应的 agent 窗口里。` : '每段话发到对应的 agent 窗口里。'),
    tab === 'rules' ? rulesEditor() : tab === 'install' ? installGuide() : tab === 'worker' ? [
    el('div', { class: 'helper-sec' }, el('h4', null, '① 开 worker')),
    el('p', { class: 'hint' }, '打开新的 agent 窗口（可以换账号），工作目录选项目目录，发对应角色的那句话。想起名字就在第一行末尾加「，名字 账号B」。'),
    [...roles.values()].map((role) => {
      const key = role.trim().toLowerCase();
      const std = STANDARD_ROLES.find((r) => r.key === key);
      const waiting = tasks.filter((t) => t.status === 'pending' && t.role.trim().toLowerCase() === key).length;
      const working = online.filter((a) => a.role.trim().toLowerCase() === key).length;
      return el('div', { class: 'wcard' },
        el('div', { class: 'wcard-head' },
          el('span', { class: 'tag role', style: roleStyle(role) }, role),
          std ? el('b', null, std.label) : null,
          el('span', { class: 'hint grow' }, std ? std.what : ''),
          el('span', { class: 'hint' }, `在线 ${working}，待领取 ${waiting}`)),
        promptBlock(workerPrompt(role), renderHelper));
    }),
    el('div', { class: 'helper-sec' }, el('h4', null, `② 干活中：在线的 worker（${online.length}）`), dismissAll),
    el('p', { class: 'hint' }, dismissAllArm
      ? '确认后所有 worker 立即下线；进行中的任务退回待领取，已有改动保留。'
      : 'worker 停下来不动时，复制它的叫醒话，发到它自己的 agent 窗口。'),
    ordered.length ? ordered.map((a) => el('div', { class: `wcard${a.id === helper.focus ? ' focus' : ''}` },
      el('div', { class: 'wcard-head' },
        el('span', { class: 'grow' },
          el('b', null, agentLabel(a.id)),
          el('span', { class: 'role-text', style: roleStyle(a.role) }, a.role),
          el('span', { class: 'hint' }, `${a.currentTask || '空闲'}，心跳 ${ago(a.lastSeenAt)}`),
          isStale(a) ? el('span', { class: 'pill' }, '可能停了') : null,
          a.leaveAsked ? el('span', { class: 'pill', title: '空闲太久，向 leader 申请下线' }, '申请下线') : null,
          a.dismiss ? el('span', { class: 'pill', title: '做完手上的任务后下线，不再领新任务' }, '做完下线') : null,
          pendingCancel(a) ? el('span', { class: 'pill', title: '它还在做一个已作废的任务' }, `${pendingCancel(a).id} 已作废，它还不知道`) : null),
        dismissButtons(a)),
      pendingCancel(a) ? [
        el('p', { class: 'hint' }, `${pendingCancel(a).id} 已被作废，但它正在干活，要等下一次调用 ateam 命令才会知道。想让它马上停：在它的 agent 窗口里点停止，把下面这句话发过去。`),
        promptBlock(stopPrompt(a, pendingCancel(a)), renderHelper),
      ] : promptBlock(wakePrompt(a), renderHelper))) : el('p', { class: 'hint' }, '没有在线的 worker。'),
    offline.length ? [
      el('div', { class: 'helper-sec' }, el('h4', null, `③ 掉线了：重连（${offline.length}）`)),
      el('p', { class: 'hint' }, '窗口还在、只是掉线了：把重连话发到它自己的 agent 窗口，它会用原编号重新加入、接着干活，窗口标题不用改。'),
      offline.map((a) => el('div', { class: 'wcard' },
        el('div', { class: 'wcard-head' },
          el('span', { class: 'grow' },
            el('b', null, agentLabel(a.id)),
            el('span', { class: 'role-text', style: roleStyle(a.role) }, a.role),
            el('span', { class: 'hint' }, `最后心跳 ${ago(a.lastSeenAt)}`))),
        promptBlock(reconnectPrompt(a), renderHelper))),
    ] : null,
    el('div', { class: 'helper-sec' }, el('h4', null, '④ 收工')),
    el('p', { class: 'hint' }, '需求都做完了：在 ② 里点「全部下线」，worker 会立即停下。leader 那边对它说「让大家收工」也一样。'),
    ] : [
    el('p', { class: 'hint' }, '在项目目录里开一个 Claude Code 会话，发下面这句话。leader 只需要一个。'),
    el('div', { class: 'wcard' },
      el('div', { class: 'wcard-head' }, el('b', null, '加入'), el('span', { class: 'hint' }, '新开会话、或者上下文满了重开会话，都用这一句')),
      promptBlock(leadPrompt(), renderHelper)),
    el('p', { class: 'hint' }, '加入后直接在对话里跟 leader 说需求，比如「需求是……」。它会拆任务、派给 worker，并告诉你需要开几个什么角色的 worker。'),
    ],
  );
  panel.hidden = false;
}

// 已验收的需求收进左侧底部一个可展开的分组，默认收起
let acceptedOpen = false;
try { acceptedOpen = localStorage.getItem('ateam.acceptedOpen') === '1'; } catch {}

function renderJobs() {
  const nav = document.getElementById('jobs');
  const { jobs, tasks } = data.state;
  const jobItem = (j) => {
    const jt = tasks.filter((t) => t.jobId === j.id && t.status !== 'cancelled');
    const done = jt.filter((t) => t.status === 'approved').length;
    return el('button', {
      class: 'job', 'aria-current': view.job === j.id ? 'true' : 'false',
      onclick: () => { view.job = j.id; view.task = null; view.report = false; saveView(); render(); },
    },
    el('div', { class: 'title' }, `${j.id} ${j.title}`),
    el('div', { class: 'sub' }, j.status === 'accepted' ? el('span', { class: 'accepted' }, '✓ 已验收') : el('span', null, JOB_STATUS[j.status] || j.status), el('span', null, `${done}/${jt.length} 已通过`)),
    jt.length ? strip(jt, false) : null);
  };
  const newest = jobs.slice().reverse();
  const open = newest.filter((j) => j.status !== 'accepted');
  const done = newest.filter((j) => j.status === 'accepted');
  const doneGroup = done.length ? [
    el('button', {
      class: 'accepted-toggle', 'aria-expanded': acceptedOpen ? 'true' : 'false',
      onclick: () => {
        acceptedOpen = !acceptedOpen;
        try { localStorage.setItem('ateam.acceptedOpen', acceptedOpen ? '1' : '0'); } catch {}
        renderJobs();
      },
    }, el('span', null, acceptedOpen ? '▾' : '▸'), `已验收（${done.length}）`),
    acceptedOpen ? done.map(jobItem) : null,
  ] : [];
  const empty = jobs.length ? (open.length ? [] : [el('p', { class: 'hint' }, '需求都验收完了。')])
    : [el('p', { class: 'empty' }, '还没有需求。对 Claude Code 说出你的需求，leader 会在这里建立任务。')];
  fill(nav, el('h2', null, '需求'), open.map(jobItem), empty, doneGroup);
}

function renderMain() {
  const main = document.getElementById('main');
  const job = data.state.jobs.find((j) => j.id === view.job);
  if (!job) {
    main.replaceChildren(el('p', { class: 'empty' }, data.state.jobs.length ? '在左侧选择一个需求，查看任务看板。' : '等待 leader 创建第一个需求。'));
    return;
  }
  const all = data.state.tasks.filter((t) => t.jobId === job.id);
  const tasks = all.filter((t) => t.status !== 'cancelled');
  const cancelled = all.filter((t) => t.status === 'cancelled');
  const st = reviewStats(tasks);
  const head = el('div', { class: 'job-head' },
    el('h2', { class: 'job-title' }, `${job.id} ${job.title}`),
    job.description ? (() => {
      const box = el('div', { class: 'desc md' });
      box.innerHTML = renderMarkdown(job.description); // renderMarkdown 先转义了 HTML
      return box;
    })() : null,
    tasks.length ? strip(tasks, true) : null);
  const stats = el('div', { class: 'stats' },
    el('span', null, '状态 ', el('b', null, JOB_STATUS[job.status] || job.status)),
    el('span', null, '已通过 ', el('b', null, `${st.approved}/${tasks.length}`)),
    el('span', null, 'review ', el('b', null, st.reviews), ' 次'),
    el('span', null, '一次通过率 ', el('b', null, st.rate)),
    el('span', null, '打回 ', el('b', null, st.rejects), ' 次'));

  let report = null;
  if (job.status === 'awaiting_acceptance' && job.report) {
    report = el('div', { class: 'report-bar' },
      el('span', { class: 'what' }, 'leader 已提交汇报，等你验收'),
      el('span', { class: 'when' }, `${fmtTime(job.updatedAt)} 提交`),
      el('button', { class: 'btn primary', onclick: (e) => { e.stopPropagation(); openReport(); } }, '查看汇报'),
      acceptButtons(job),
      el('span', { class: 'hint' }, ACCEPT_HINT));
  } else if (job.status === 'accepted' && job.report) {
    report = el('div', { class: 'report-bar' },
      el('span', { class: 'what' }, '已验收通过'),
      el('span', { class: 'when' }, job.acceptedAt ? `${fmtTime(job.acceptedAt)} 验收` : ''),
      el('button', { class: 'btn', onclick: (e) => { e.stopPropagation(); openReport(); } }, '查看汇报'));
  }

  const board = el('div', { class: 'board' }, LANES.map((lane) => {
    const cards = tasks.filter((t) => laneOf(t) === lane.key);
    // 待领取一列按派发顺序排：优先的在最上面（与服务端 dispatchOrder 一致）
    if (lane.key === 'pending') cards.sort((a, b) => ((b.priority ?? 0) - (a.priority ?? 0)) || (b.handoff - a.handoff) || (Number(a.id.slice(1)) - Number(b.id.slice(1))));
    return el('section', { class: `lane c-${lane.key}`, 'aria-label': lane.label },
      el('h3', null, el('span', { class: 'label' }, lane.label), el('span', { class: 'n' }, cards.length)),
      cards.map((t) => card(t, lane.key)));
  }));

  const cancelledBox = cancelled.length ? el('section', { class: 'cancelled-box', 'aria-label': '已作废' },
    el('h3', null, `已作废（${cancelled.length}）`),
    el('div', { class: 'cancelled-list' }, cancelled.map((t) => card(t, 'cancelled')))) : null;

  fill(main, head, stats, report, tasks.length ? board : el('p', { class: 'empty' }, 'leader 还在拆分任务。'), cancelledBox);
}

function card(t, lane) {
  const handedOff = t.history.some((h) => h.type === 'handoff');
  return el('button', { class: `card c-${lane}${lane === 'cancelled' ? ' cancelled' : ''}`, onclick: () => { view.task = t.id; saveView(); renderDrawer(true); } },
    el('div', { class: 'id' }, t.id),
    el('div', { class: 't' }, t.title),
    el('div', { class: 'm' },
      el('span', { class: 'tag role', style: roleStyle(t.role) }, t.role),
      t.assignee ? el('span', { class: 'tag', title: t.assignee }, agentName(t.assignee)) : null,
      t.rejectCount ? el('span', { class: 'tag warn' }, `打回 ${t.rejectCount}`) : null,
      handedOff ? el('span', { class: 'tag handoff' }, '接手') : null,
      t.priority && (t.status === 'pending' || t.status === 'held') ? el('span', { class: 'tag urgent' }, '优先') : null,
      t.assignTo && (t.status === 'pending' || t.status === 'held') ? el('span', { class: 'tag assigned', title: `你指派给了 ${t.assignTo}` }, `→ ${agentName(t.assignTo)}`) : null,
      critiqueTag(t)));
}

function renderDrawer(fresh) {
  const drawer = document.getElementById('drawer');
  const t = view.task && data.state.tasks.find((x) => x.id === view.task);
  if (!t) { drawer.hidden = true; drawer.replaceChildren(); return; }
  const scroll = fresh ? 0 : drawer.scrollTop;
  const lane = laneOf(t);
  // 子节点里有条件出现的数组和 null：走 fill，与 el() 一样展开并过滤
  fill(drawer,
    el('div', { class: 'drawer-tools' },
      el('button', {
        class: 'widen',
        title: drawerWide ? '收窄' : '展开到大半屏',
        'aria-label': drawerWide ? '收窄' : '展开到大半屏',
        onclick: (e) => {
          e.stopPropagation();
          drawerWide = !drawerWide;
          try { localStorage.setItem('ateam.drawerWide', drawerWide ? '1' : '0'); } catch {}
          renderDrawer(false);
        },
      }, drawerWide ? '→' : '←'),
      el('button', { class: 'close', onclick: closeDrawer }, '关闭')),
    el('div', { class: 'id mono' }, `${t.id}，属于需求 ${t.jobId}`),
    el('h2', null, t.title),
    el('dl', { class: 'facts' },
      el('dt', null, '状态'), el('dd', { class: `c-${lane}` }, LANE_LABEL[lane]),
      el('dt', null, '角色'), el('dd', null, el('span', { class: 'tag role', style: roleStyle(t.role) }, t.role)),
      el('dt', null, '处理人'), el('dd', null, t.assignee ? agentLabel(t.assignee) : '无'),
      el('dt', null, '路径'), el('dd', null, t.paths.map((p, i) => [i ? '、' : '', el('code', null, p)])),
      el('dt', null, '依赖'), el('dd', null, t.dependsOn.length ? t.dependsOn.join('、') : '无'),
      el('dt', null, '打回'), el('dd', null, `${t.rejectCount} 次`)),
    (t.status === 'working' || t.status === 'asking') && t.assignee ? reclaimBox(t) : null,
    t.status === 'pending' || t.status === 'held' ? [assignBox(t), priorityBox(t)] : null,
    critiqueBox(t),
    (() => {
      // 作废了、但拿着它的 worker 还不知道：给出叫停的话
      const a = t.status === 'cancelled' && data.state.agents.find((x) => pendingCancel(x)?.id === t.id);
      return a ? [
        el('h4', null, `${agentLabel(a.id)} 还在做这个任务`),
        el('p', { class: 'hint' }, '它要等下一次调用 ateam 命令才会知道已作废。想让它马上停：在它的 agent 窗口里点停止，把下面这句话发过去。'),
        promptBlock(stopPrompt(a, t), () => renderDrawer(false)),
      ] : null;
    })(),
    t.status === 'pending' ? [
      el('h4', null, t.handoff ? '让新 worker 接手' : '找 worker 来做'),
      el('p', { class: 'hint' }, '在新的 agent 窗口（可以换账号）里发这句话。已有同角色 worker 在线时不用开新窗口，它做完手上的会自动领。'),
      promptBox(t.role),
    ] : null,
    el('h4', null, '验收标准'),
    t.acceptance.length ? el('ol', null, t.acceptance.map((a) => el('li', null, a))) : el('p', { class: 'meta' }, '未填写'),
    el('h4', null, '描述'),
    (() => {
      const box = el('div', { class: 'descbox md' });
      if (t.description?.trim()) box.innerHTML = renderMarkdown(t.description); // renderMarkdown 先转义了 HTML
      else box.textContent = '（无）';
      return box;
    })(),
    el('h4', null, '提交'),
    t.commits.length ? el('ul', { class: 'commits' }, t.commits.map((c) => el('li', null, el('code', null, c)))) : el('p', { class: 'meta' }, '暂无'),
    el('h4', null, '时间线'),
    el('ol', { class: 'timeline' }, t.history.map((h) => {
      const [label, color] = HISTORY[h.type] || [h.type, 'pending'];
      return el('li', { class: `c-${color}` },
        el('div', null, el('span', { class: 'what' }, label), ' ', el('span', { class: 'when' }, `${fmtTime(h.ts)}  ${agentLabel(h.actor)}`)),
        h.text ? el('div', { class: 'text' }, h.text) : null,
        h.commit ? el('div', { class: 'when' }, '提交 ', el('code', null, h.commit)) : null);
    })));
  drawer.hidden = false;
  drawer.scrollTop = scroll;
  drawer.classList.toggle('wide', drawerWide);
  if (fresh) drawer.querySelector('.close').focus();
}

function closeDrawer() {
  view.task = null;
  saveView();
  renderDrawer();
}

// 设为优先 / 取消优先：只影响同角色 worker 领任务的先后
let priorityError = null;
// ---------- 审卡意见 ----------
const CRITIQUE_STATUS = { open: '待 leader 处理', resolved: '已处理', disputed: '等你裁决', redo: '你要求按意见改，待 leader 处理', overruled: '你维持了原样' };

function critiqueTag(t) {
  const list = t.critiques || [];
  if (list.some((c) => c.status === 'disputed')) return el('span', { class: 'tag warn' }, '审卡：待你裁决');
  const open = list.filter((c) => c.status === 'open' || c.status === 'redo').length;
  return open ? el('span', { class: 'tag critique' }, `审卡意见 ${open}`) : null;
}

let critiqueError = null;
function critiqueBox(t) {
  const list = t.critiques || [];
  if (!list.length) return null;
  const disputed = list.some((c) => c.status === 'disputed');
  const rule = async (side) => {
    try {
      const res = await fetch('/api/critique/rule', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: t.id, side }) });
      const out = await res.json();
      critiqueError = out.ok ? null : out.message;
    } catch { critiqueError = '连不上 ateam 服务。'; }
    await poll();
    renderDrawer(false);
  };
  return [
    el('h4', null, `审卡意见（${list.length}）`),
    list.map((c) => {
      const box = el('div', { class: 'critique' },
        el('div', { class: 'hint' }, `#${c.id} ${c.by}，${fmtTime(c.ts)}${c.because ? `，重新审：${c.because}` : ''}　`, el('b', null, CRITIQUE_STATUS[c.status] || c.status)),
        el('div', { class: 'md' }));
      box.lastChild.innerHTML = renderMarkdown(c.text); // renderMarkdown 先转义了 HTML
      if (c.reply) {
        const reply = el('div', { class: 'md reply' });
        reply.innerHTML = renderMarkdown(`**leader：**${c.reply}`);
        box.append(reply);
      }
      return box;
    }),
    disputed ? [

// 指派：用户在看板上把任务交给某个 worker（比如难的任务交给 Claude 的窗口）。只有它能领，它优先领。
let assignError = null;
function assignBox(t) {
  const role = t.role.trim().toLowerCase();
  const online = data.state.agents.filter((a) => a.status === 'online' && a.role.trim().toLowerCase() === role);
  const current = t.assignTo && data.state.agents.find((a) => a.id === t.assignTo);
  const select = el('select', { class: 'assign-select' },
    el('option', { value: '' }, '不指派（同角色谁都能领）'),
    online.map((a) => el('option', { value: a.id }, `${agentLabel(a.id)}${a.currentTask ? `（正在做 ${a.currentTask}）` : '（空闲）'}`)),
    current && current.status !== 'online' ? el('option', { value: current.id }, `${agentLabel(current.id)}（不在线）`) : null);
  select.value = t.assignTo || '';
  select.addEventListener('click', (e) => e.stopPropagation());
  select.addEventListener('change', async () => {
    try {
      const res = await fetch('/api/tasks/assign', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: t.id, to: select.value }) });
      const out = await res.json();
      assignError = out.ok ? null : out.message;
    } catch { assignError = '连不上 ateam 服务。'; }
    await poll();
    renderDrawer(false);
  });
  let hint;
  if (!t.assignTo) hint = `想交给某个 worker（比如难的任务交给 Claude 的窗口），在这里选它。只有它能领，它优先领。只能选 ${t.role} 角色在线的 worker。`;
  else if (!current || current.status !== 'online') hint = `${t.assignTo} 现在不在线，这个任务会一直等它。它回不来的话，改派给别人或选「不指派」。`;
  else if (current.currentTask) hint = `${agentLabel(t.assignTo)} 正在做 ${current.currentTask}，做完就领这个${t.dependsOn.length ? '（依赖通过后）' : ''}。`;
  else hint = `${agentLabel(t.assignTo)} 下一次来领任务时就会领到它${t.dependsOn.length ? '（依赖通过后）' : ''}。`;
  return [
    el('h4', null, '指派给'),
    select,
    el('p', { class: 'hint' }, hint),
    assignError ? el('p', { class: 'hint' }, assignError) : null,
  ];
}

function priorityBox(t) {
  const on = !!t.priority;
  return [
    el('h4', null, '派发顺序'),

      : `急着要的话可以设为优先，${t.role} 的 worker 下一个先领它，不用等前面排着的任务。正在做别的任务的 worker 不会被打断。`),

// 收回任务：两步确认，避免误点
let reclaimArm = null;   // 已点过一次「收回任务」的任务编号
let reclaimError = null;
function reclaimBox(t) {

      : `如果 ${agentLabel(t.assignee)} 的窗口已经关了或 token 用完，不必等它超时掉线，可以立即收回，交给新 worker 接手。窗口只是停住了的话，用顶部的叫醒话就行。`),

}

function agentLabel(id) {

// 角色 → 颜色。常用名固定，其他按名字哈希，同一角色永远同一颜色
const ROLE_FIXED = { frontend: 0, fe: 0, 前端: 0, backend: 1, be: 1, 后端: 1, test: 2, qa: 2, 测试: 2, product: 3, pm: 3, 产品: 3, critic: 5, 审卡: 5, docs: 4, 文档: 4 };
function roleStyle(role) {
  const key = String(role).trim().toLowerCase();
  let i = ROLE_FIXED[key];
  if (i === undefined) {
    let h = 0;
    for (const ch of key) h = (h * 31 + ch.codePointAt(0)) >>> 0;
    i = h % 6;
  }
  return `--rc: var(--role-${i})`;
}

// 一段可复制的提示词；rerender 用来刷新「已复制」状态
function promptBlock(text, rerender) {
  const done = copied === text;
  return el('div', { class: 'pblock' },
    el('code', null, text),
    el('button', {
      class: `btn sm${done ? ' done' : ''}`,
      onclick: async (e) => {
        e.stopPropagation();
        try { await navigator.clipboard.writeText(text); copied = text; } catch { copied = null; }
        rerender();
        setTimeout(() => { if (copied === text) { copied = null; rerender(); } }, 2000);
      },
    }, done ? '已复制' : '复制'));
}

// 待领取、依赖已满足、但没有同角色在线 worker 的任务 → 需要有人开新窗口接手
function rolesNeedingWorkers() {
  const { tasks, agents } = data.state;
  const approved = new Set(tasks.filter((t) => t.status === 'approved').map((t) => t.id));
  const onlineRoles = new Set(agents.filter((a) => a.status === 'online').map((a) => a.role.trim().toLowerCase()));
  const byRole = new Map();
  for (const t of tasks) {
    if (t.status !== 'pending' || !t.dependsOn.every((d) => approved.has(d))) continue;
    if (onlineRoles.has(t.role.trim().toLowerCase())) continue;
    if (!byRole.has(t.role)) byRole.set(t.role, []);
    byRole.get(t.role).push(t);
  }
  return byRole;
}

function renderNeeds() {
  const box = document.getElementById('needs');
  const byRole = rolesNeedingWorkers();
  if (byRole.size === 0) { box.hidden = true; box.replaceChildren(); return; }
  const summary = [...byRole].map(([role, ts]) => `${role}（${ts.map((t) => t.id + (t.handoff ? ' 待接手' : '')).join('、')}）`).join('，');
  fill(box,
    el('div', { class: 'needs-row' },
      el('b', null, '有任务没人做'),
      el('span', null, `缺少这些角色的在线 worker：${summary}`),
      el('button', { class: 'btn', onclick: (e) => { e.stopPropagation(); showPrompts = !showPrompts; render(); } },
        showPrompts ? '收起提示词' : '显示提示词')),
    showPrompts ? el('div', null,
      el('p', { class: 'hint' }, '打开一个新的 agent 窗口（可以换账号），工作目录选项目目录，把下面这句话发给它。它会自动接手，在已有改动上继续。想给这个窗口起名字，就在第一行末尾加「，名字 账号B」。'),
      [...byRole.keys()].map((role) => promptBox(role))) : null);
  box.hidden = false;
}

// ---------- worker 可能停了：弹框请用户确认 ----------
// 手上有进行中任务、但很久没动静的 worker（服务标记 stale）。任务不会自动转手，
// 用户确认「窗口没了」才收回交给别人；确认「还在」就继续等它。点「稍后」只是这次先不弹。
const staleLater = new Set();
let staleError = null;

async function staleAction(path, body) {
  try {
    const res = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    const out = await res.json();
    staleError = out.ok ? null : out.message;
  } catch { staleError = '连不上 ateam 服务。'; }
  await poll();
  renderStaleDialog();
}

function staleAgents() {
  return data.state.agents.filter((a) => a.status === 'online' && a.stale && a.currentTask);
}

function renderStaleDialog() {
  const box = document.getElementById('stale-dialog');
  for (const id of [...staleLater]) if (!staleAgents().some((a) => a.id === id)) staleLater.delete(id);
  const list = staleAgents().filter((a) => !staleLater.has(a.id));
  if (!list.length) { box.hidden = true; box.replaceChildren(); return; }
  const items = list.map((a) => {
    const t = data.state.tasks.find((x) => x.id === a.currentTask);
    return el('div', { class: 'stale-item' },
      el('p', null, el('b', null, agentLabel(a.id)), `（${a.role}）已经 ${Math.round((Date.now() - a.lastSeenAt) / 60000)} 分钟没动静，手上是 `,
        el('b', null, `${a.currentTask}${t ? ` ${t.title}` : ''}`), '。'),
      el('p', { class: 'hint' }, '它可能在跑很长的命令（导入数据、构建），也可能窗口停了或 token 用完了。去它的 agent 窗口看一眼：'),
      el('div', { class: 'actions' },
        el('button', { class: 'btn primary', onclick: (e) => { e.stopPropagation(); staleAction('/api/agents/still-there', { id: a.id }); } }, '还在干活，继续等'),
        el('button', { class: 'btn warn', onclick: (e) => { e.stopPropagation(); staleAction('/api/reclaim', { id: a.currentTask, text: '用户确认原窗口没了' }); } }, '窗口没了，换人接手'),
        el('button', { class: 'btn ghost', onclick: (e) => { e.stopPropagation(); staleLater.add(a.id); renderStaleDialog(); } }, '稍后再说')),
      el('p', { class: 'hint' }, '窗口还在但停住了：把下面这句叫醒话发给它，不用换人。'),
      promptBlock(wakePrompt(a), renderStaleDialog));
  });
  fill(box, el('div', { class: 'modal', onclick: (e) => e.stopPropagation() },
    el('h3', null, list.length > 1 ? `${list.length} 个 worker 可能停了` : 'worker 可能停了'),
    el('p', { class: 'hint' }, '任务还在它手上，不会自动交给别人。你确认之后才会换人。'),
    items,
    staleError ? el('p', { class: 'hint' }, staleError) : null));
  box.hidden = false;
}

// 需要你操作的事：待验收的需求、缺 worker 的角色、有活干时 leader 没连上。
// 数量显示在标签页标题和图标上，看板不在前台时也能看到。
const BASE_TITLE = 'ateam 调度台';
let lastBadge = null;
// 每件事 { key, text, body }：key 用来给浏览器通知去重，text 是按钮提示，body 是通知正文
function attentionItems() {
  if (!data) return [];
  const items = [];
  for (const j of data.state.jobs.slice().reverse()) {
    if (j.status === 'awaiting_acceptance') items.push({ key: `accept:${j.id}`, text: `${j.id} 待你验收`, body: `${j.id} ${j.title} 待你验收` });
  }
  for (const role of rolesNeedingWorkers().keys()) {
    items.push({ key: `needs:${role.toLowerCase()}`, text: `${role} 缺 worker`, body: `${role} 的任务没人做，需要开一个 ${role} worker` });
  }
  if (data.stale) items.push({ key: 'stale', text: '服务需要重启', body: 'ateam 的代码已更新，请重启 ateam serve' });
  for (const t of data.state.tasks) {
    if ((t.critiques || []).some((c) => c.status === 'disputed')) {
      items.push({ key: `dispute:${t.id}`, text: `${t.id} 审卡意见等你裁决`, body: `${t.id} ${t.title}：leader 不同意审卡意见，等你裁决` });
    }
  }
  for (const t of data.state.tasks) {
    if (!t.assignTo || (t.status !== 'pending' && t.status !== 'held')) continue;
    const a = data.state.agents.find((x) => x.id === t.assignTo);
    if (!a || a.status !== 'online') {
      items.push({ key: `assign:${t.id}`, text: `${t.id} 指派的 ${t.assignTo} 不在线`, body: `${t.id} 指派给了 ${t.assignTo}，但它不在线，任务在等它` });
    }
  }
  for (const a of data.state.agents) {
    const cancelled = pendingCancel(a);
    if (cancelled) {
      items.push({ key: `cancel:${a.id}:${cancelled.id}`, text: `${a.id} 还在做已作废的 ${cancelled.id}`, body: `${cancelled.id} 已作废，但 ${a.id} 还不知道，可以去它的窗口叫停` });
    }
    if (a.status === 'online' && a.stale && a.currentTask) {
      items.push({ key: `quiet:${a.id}`, text: `${a.id} 可能停了`, body: `${a.id} 很久没动静（手上 ${a.currentTask}），请确认窗口还在不在` });
    }
  }
  const busy = data.state.jobs.some((j) => j.status === 'planning' || j.status === 'active');
  if (busy && data.leader && !data.leader.online) items.push({ key: 'leader', text: 'leader 未连接', body: 'leader 没有连接，需求还没做完' });
  return items;
}

// ---------- 浏览器通知 ----------
// 一件事持续 1 分钟才通知（worker 掉线马上重连、leader 短暂断开都不打扰），同一件事只通知一次，
// 事情消失后再出现会再通知。打开页面时已经存在的事不通知（标题上已经有数字了）。
const NOTIFY_SETTLE_MS = 60 * 1000;
const notifySeen = new Map(); // key -> 第一次看到的时间
const notifyDone = new Set();
let notifyPrimed = false;
const canNotify = () => typeof Notification !== 'undefined';

function checkNotify(items) {
  const keys = new Set(items.map((i) => i.key));
  for (const key of [...notifySeen.keys()]) {
    if (!keys.has(key)) { notifySeen.delete(key); notifyDone.delete(key); }
  }
  for (const i of items) {
    if (!notifySeen.has(i.key)) {
      notifySeen.set(i.key, Date.now());
      if (!notifyPrimed) notifyDone.add(i.key);
    }
  }
  notifyPrimed = true;
  if (!canNotify() || Notification.permission !== 'granted') return;
  const fresh = items.filter((i) => !notifyDone.has(i.key) && Date.now() - notifySeen.get(i.key) >= NOTIFY_SETTLE_MS);
  if (!fresh.length) return;
  for (const i of fresh) notifyDone.add(i.key);
  const project = (data.root || '').split('/').filter(Boolean).pop() || '';
  const body = fresh.length === 1 ? fresh[0].body : `${fresh.length} 件事需要你处理：${fresh.map((i) => i.text).join('；')}`;
  try {
    const n = new Notification(`ateam${project ? ` · ${project}` : ''}`, { body, tag: `ateam-${project}`, silent: true });
    n.onclick = () => { window.focus(); n.close(); };
  } catch {}
}

function renderNotifyButton() {
  const btn = document.getElementById('notify-btn');
  const show = canNotify() && Notification.permission === 'default';
  btn.hidden = !show;
}

async function enableNotify() {
  if (!canNotify()) return;
  try { await Notification.requestPermission(); } catch {}
  renderNotifyButton();
  if (Notification.permission === 'granted') {
    try { new Notification('ateam 通知已开启', { body: '有需求待验收、任务缺 worker、leader 掉线时会在这里提醒你。看板标签页要开着（可以在后台）。', silent: true }); } catch {}
  }
}

function setBadge(text, color) {
  const key = `${text}|${color}`;
  if (key === lastBadge) return;
  lastBadge = key;
  document.title = text ? `(${text}) ${BASE_TITLE}` : BASE_TITLE;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">`
    + `<rect x="2" y="2" width="28" height="28" rx="7" fill="#2f7d55"/>`
    + `<text x="16" y="22" font-size="16" font-family="sans-serif" font-weight="700" text-anchor="middle" fill="#fff">a</text>`
    + (text ? `<circle cx="25" cy="7" r="7" fill="${color}"/>` : '')
    + '</svg>';
  let link = document.querySelector('link[rel="icon"]');
  if (!link) { link = document.createElement('link'); link.rel = 'icon'; document.head.append(link); }
  link.href = `data:image/svg+xml,${encodeURIComponent(svg)}`;
}

function renderAttention() {
  document.getElementById('stale').hidden = !data?.stale;
  const items = attentionItems();
  setBadge(items.length ? String(items.length) : '', '#d9534f');
  checkNotify(items);
  renderNotifyButton();
  const btn = document.getElementById('attention');
  if (!items.length) { btn.hidden = true; return; }
  btn.hidden = false;
  btn.textContent = `需要你处理 ${items.length}`;
  btn.title = items.map((i) => i.text).join('\n');
}

async function poll() {
  try {
    // 带上次的 ETag：状态没变时服务只回 304，不用重新下载和解析整份状态
    const res = await fetch('/api/state?view=dashboard', { cache: 'no-store', headers: lastEtag ? { 'if-none-match': lastEtag } : {} });
    if (res.status !== 200 && res.status !== 304) throw new Error(`HTTP ${res.status}`);
    document.getElementById('banner').hidden = true;
    const json = res.status === 304 ? lastJson : await res.text();
    lastEtag = res.headers.get('etag') || '';
    if (json !== lastJson) {
      lastJson = json;
      data = JSON.parse(json);
      render();
    } else {
      renderWorkers(); // 只刷新「心跳 N 分钟前」
    }
    renderAttention();
  } catch {
    document.getElementById('banner').hidden = false;
    lastJson = null; // 恢复连接后重新渲染，刷新提醒
    lastEtag = '';
    setBadge('!', '#d9534f');
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (attentionOpen) { attentionOpen = false; renderAttentionList(); return; }
  if (helper.open) { helper = { open: false, focus: null }; renderHelper(); return; }
  if (view.report) closeReport();
  else if (view.task) closeDrawer();
});
// 点抽屉以外的地方关闭抽屉；点任务卡片则切换到那张卡片（卡片自己的点击处理负责打开）
document.addEventListener('click', (e) => {
  if (attentionOpen && (e.target.id === 'attention-list' || !e.target.closest('#attention, #attention-list'))) { attentionOpen = false; renderAttentionList(); }
  if (helper.open && !e.target.closest('#helper, #helper-btn')) { helper = { open: false, focus: null }; renderHelper(); }
  if (!view.task) return;
  if (e.target.closest('#drawer, .card, #stale-dialog')) return;
  closeDrawer();
});
document.getElementById('notify-btn').addEventListener('click', (e) => { e.stopPropagation(); enableNotify(); });

// 「需要你处理」：点开一个列表，每件事一行，点哪件就去处理哪件
let attentionOpen = false;

function goAttention(key) {
  attentionOpen = false;
  renderAttentionList();
  const [kind, id] = key.split(':');
  if (kind === 'accept') {
    view = { job: id, task: null, report: false };
    saveView();
    render();
    document.getElementById('main').scrollTop = 0;
  } else if (kind === 'needs') {
    showPrompts = true;
    render();
    document.getElementById('needs').scrollIntoView({ block: 'nearest' });
  } else if (kind === 'leader') {
    helper = { open: true, focus: null, tab: 'lead' };
    renderHelper();
  } else if (kind === 'quiet') {
    staleLater.delete(id);
    renderStaleDialog();
  } else if (kind === 'assign' || kind === 'dispute') {
    const t = data.state.tasks.find((x) => x.id === id);
    if (t) { view = { job: t.jobId, task: t.id, report: false }; saveView(); render(); renderDrawer(true); }
  } else if (kind === 'cancel') {
    helper = { open: true, focus: id };
    renderHelper();
  }
  // stale（服务需要重启）：顶部黄色提示条已经写了怎么做
}

// 弹框：待验收的需求可以勾选后一次验收通过；其它事每件一行，点「去处理」跳过去
let acceptPick = null;    // 勾选的需求编号；null 表示还没动过，默认全选
let acceptConfirm = false; // 「验收通过」两步确认
let acceptMsg = '';

function renderAttentionList() {
  const box = document.getElementById('attention-list');
  const items = attentionOpen ? attentionItems() : [];
  if (!items.length) { attentionOpen = false; box.hidden = true; box.replaceChildren(); return; }
  const jobs = data.state.jobs.filter((j) => j.status === 'awaiting_acceptance').reverse();
  if (acceptPick === null) acceptPick = new Set(jobs.map((j) => j.id));
  for (const id of [...acceptPick]) if (!jobs.some((j) => j.id === id)) acceptPick.delete(id);
  const others = items.filter((i) => !i.key.startsWith('accept:'));
  const stop = (fn) => (e) => { e.stopPropagation(); fn(); };
  const picked = jobs.filter((j) => acceptPick.has(j.id));
  const allOn = picked.length === jobs.length;

  const acceptSec = jobs.length ? [
    el('div', { class: 'att-head' },
      el('h4', null, `待你验收（${jobs.length}）`),
      el('button', { class: 'btn ghost sm', onclick: stop(() => { acceptPick = new Set(allOn ? [] : jobs.map((j) => j.id)); acceptConfirm = false; renderAttentionList(); }) }, allOn ? '全不选' : '全选')),
    jobs.map((j) => {
      const tasks = data.state.tasks.filter((t) => t.jobId === j.id && t.status !== 'cancelled');
      const box2 = el('input', { type: 'checkbox' });
      box2.checked = acceptPick.has(j.id);
      box2.addEventListener('change', () => { if (box2.checked) acceptPick.add(j.id); else acceptPick.delete(j.id); acceptConfirm = false; renderAttentionList(); });
      return el('div', { class: 'att-row' },
        el('label', { class: 'att-pick' }, box2,
          el('span', null, el('b', null, j.id), ` ${j.title}`, el('span', { class: 'hint' }, `　${tasks.length} 个任务，${fmtTime(j.updatedAt)} 提交汇报`))),
        el('button', { class: 'btn ghost sm', onclick: stop(() => { attentionOpen = false; renderAttentionList(); view = { job: j.id, task: null, report: true }; saveView(); render(); }) }, '看汇报'));
    }),
    el('div', { class: 'actions' },
      acceptConfirm ? el('button', { class: 'btn ghost', onclick: stop(() => { acceptConfirm = false; renderAttentionList(); }) }, '取消') : null,
      el('button', {
        class: 'btn primary', disabled: picked.length === 0,
        onclick: stop(async () => {
          if (!acceptConfirm) { acceptConfirm = true; renderAttentionList(); return; }
          acceptConfirm = false;
          try {
            const res = await fetch('/api/jobs/accept', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ ids: picked.map((j) => j.id) }) });
            const out = await res.json();
            acceptMsg = out.ok ? `已验收通过 ${picked.length} 个需求。` : out.message;
          } catch { acceptMsg = '连不上 ateam 服务。'; }
          acceptPick = null;
          await poll();
          renderAttentionList();
        }),
      }, acceptConfirm ? `确认验收通过这 ${picked.length} 个` : `验收通过选中的（${picked.length}）`),
      acceptMsg ? el('span', { class: 'hint' }, acceptMsg) : null),
  ] : (acceptMsg ? el('p', { class: 'hint' }, acceptMsg) : null);

  const otherSec = others.length ? [
    el('div', { class: 'att-head' }, el('h4', null, `其它（${others.length}）`)),
    others.map((i) => el('div', { class: 'att-row' },
      el('span', null, i.body),
      i.key === 'stale' ? el('span', { class: 'hint' }, '见页面顶部提示') : el('button', { class: 'btn sm', onclick: stop(() => goAttention(i.key)) }, '去处理'))),
  ] : null;

  fill(box, el('div', { class: 'modal att-modal', onclick: (e) => e.stopPropagation() },
    el('div', { class: 'att-head' },
      el('h3', null, `需要你处理（${items.length}）`),
      el('button', { class: 'btn ghost sm', onclick: stop(() => { attentionOpen = false; renderAttentionList(); }) }, '关闭')),
    acceptSec, otherSec));
  box.hidden = false;
}

document.getElementById('attention').addEventListener('click', (e) => {
  e.stopPropagation();
  attentionOpen = !attentionOpen;
  acceptPick = null;
  acceptConfirm = false;
  acceptMsg = '';
  renderAttentionList();
});
document.getElementById('helper-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  helper = helper.open ? { open: false, focus: null } : { open: true, focus: null };
  renderHelper();
});
loadView();
poll();
setInterval(poll, 3000);
// 服务有变化时推送过来，立即刷新：后台标签页的定时器会被浏览器暂停，推送不会，标题上的提醒才能及时更新
let pollPending = false;
function pollSoon() {
  if (pollPending) return;
  pollPending = true;
  setTimeout(() => { pollPending = false; poll(); }, 300);
}
try {
  const stream = new EventSource('/api/stream');
  stream.onmessage = () => { if (document.hidden) poll(); else pollSoon(); };
} catch {}
// 切回标签页时马上刷新一次
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
</script>
