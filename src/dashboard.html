<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ateam 调度台</title>
<style>
/* 浅色沿用最初的灰绿底色（不用纯白，免得刺眼），卡片样式参考 Jira；深色中性深灰。
   默认跟随系统，右上角可以手动切换（data-theme） */
:root {
  --bg: #e9ece6;
  --rail: #e3e7e0;
  --surface: #f4f6f1;
  --raised: #f9faf7;
  --raised-hover: #f1f4ee;
  --sunken: #dde2da;
  --ink: #1f2a24;
  --muted: #4c5a51;
  --faint: #66746b;
  --line: #c9cfc6;
  --line-soft: #d8ddd5;
  --brand: #2d5d9f;
  --brand-soft: #dbe4ee;
  --brand-ink: #24508c;
  --on-color: #ffffff;
  --pending: #8b958e;
  --working: #2d5d9f;
  --rework: #b5562b;
  --asking: #a87f0e;
  --submitted: #6a4fa3;
  --approved: #2f7d4f;
  --held: #8a3b5c;
  --focus: #2d5d9f;
  /* 角色色：按角色名固定分配，前端/后端等常用名有固定颜色 */
  --role-0: #1d6f8c; --role-1: #9c4f1c; --role-2: #5b6b1e; --role-3: #7a3f8f; --role-4: #a3324a; --role-5: #8a6a0c;
  --shadow-card: 0 1px 1px rgba(22,38,28,.22), 0 0 1px rgba(22,38,28,.3);
  --shadow-lift: 0 4px 8px -2px rgba(22,38,28,.22), 0 0 1px rgba(22,38,28,.3);
  --shadow-pop: 0 8px 12px rgba(22,38,28,.14), 0 0 1px rgba(22,38,28,.3);
  --backdrop: rgba(20, 30, 24, .4);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d2125; --rail: #1a1d21; --surface: #22272b; --raised: #22272b; --raised-hover: #282e33; --sunken: #161a1d;
    --ink: #c7d1db; --muted: #9fadbc; --faint: #8c9bab; --line: #313942; --line-soft: #2c333a;
    --brand: #579dff; --brand-soft: #1c2b41; --brand-ink: #85b8ff; --on-color: #1d2125;
    --pending: #738496; --working: #579dff; --rework: #f87168; --asking: #e2b203; --submitted: #9f8fef; --approved: #4bce97; --held: #e774bb; --focus: #579dff;
    --role-0: #579dff; --role-1: #fea362; --role-2: #4bce97; --role-3: #9f8fef; --role-4: #f87168; --role-5: #e2b203;
    --shadow-card: 0 0 0 1px rgba(188,214,240,.05), 0 1px 1px rgba(3,4,4,.5), 0 0 1px rgba(3,4,4,.5);
    --shadow-lift: 0 0 0 1px rgba(188,214,240,.10), 0 8px 12px rgba(3,4,4,.36), 0 0 1px rgba(3,4,4,.5);
    --shadow-pop: 0 0 0 1px rgba(188,214,240,.08), 0 8px 12px rgba(3,4,4,.36);
    --backdrop: rgba(3, 4, 4, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1d2125; --rail: #1a1d21; --surface: #22272b; --raised: #22272b; --raised-hover: #282e33; --sunken: #161a1d;
  --ink: #c7d1db; --muted: #9fadbc; --faint: #8c9bab; --line: #313942; --line-soft: #2c333a;
  --brand: #579dff; --brand-soft: #1c2b41; --brand-ink: #85b8ff; --on-color: #1d2125;
  --pending: #738496; --working: #579dff; --rework: #f87168; --asking: #e2b203; --submitted: #9f8fef; --approved: #4bce97; --held: #e774bb; --focus: #579dff;
  --role-0: #579dff; --role-1: #fea362; --role-2: #4bce97; --role-3: #9f8fef; --role-4: #f87168; --role-5: #e2b203;
  --shadow-card: 0 0 0 1px rgba(188,214,240,.05), 0 1px 1px rgba(3,4,4,.5), 0 0 1px rgba(3,4,4,.5);
  --shadow-lift: 0 0 0 1px rgba(188,214,240,.10), 0 8px 12px rgba(3,4,4,.36), 0 0 1px rgba(3,4,4,.5);
  --shadow-pop: 0 0 0 1px rgba(188,214,240,.08), 0 8px 12px rgba(3,4,4,.36);
  --backdrop: rgba(3, 4, 4, .6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
::selection { background: color-mix(in srgb, var(--brand) 25%, transparent); }
/* 细滚动条 */
* { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--faint) 45%, transparent) transparent; }
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--faint) 40%, transparent); border-radius: 99px; border: 2px solid transparent; background-clip: padding-box; }
*::-webkit-scrollbar-track { background: transparent; }
button { font: inherit; color: inherit; }
.meta { color: var(--muted); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

header.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  min-height: 56px; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--surface);
}
header.top h1 { margin: 0; display: flex; align-items: center; gap: 9px; font-size: 15.5px; font-weight: 650; white-space: nowrap; }
.brand-mark { width: 24px; height: 24px; border-radius: 6px; background: var(--brand); display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 5px; flex: none; }
.brand-mark i { background: var(--on-color); border-radius: 1.5px; }
.brand-mark i:nth-child(4) { opacity: .45; }
.vr { width: 1px; height: 20px; background: var(--line); flex: none; }
.workers { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; flex: 1; }
.worker {
  appearance: none; display: inline-flex; align-items: center; gap: 7px;
  height: 30px; padding: 0 11px 0 4px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); color: var(--ink); font: inherit; font-size: 12.5px; line-height: 1; white-space: nowrap;
}
/* 头像：角色色圆点 + 首字母，右下角是在线状态 */
.worker .av {
  position: relative; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none;
  font-size: 10.5px; font-weight: 700; color: var(--on-color); background: var(--rc, var(--brand));
}
.worker .av::after {
  content: ""; position: absolute; right: -2px; bottom: -2px; width: 8px; height: 8px; border-radius: 50%;
  background: var(--approved); box-shadow: 0 0 0 2px var(--surface);
}
.worker .task { color: var(--faint); }
.worker.offline { color: var(--faint); border-style: dashed; padding-left: 11px; }
/* leader 标签：放在最前面；未连接时红点 */
.leader-chip { --rc: var(--ink); margin-right: 4px; }
.leader-chip.offline-lead { border-color: color-mix(in srgb, var(--rework) 45%, var(--line)); }
.leader-chip.offline-lead .av::after { background: var(--rework); }
.leader-chip.offline-lead .task { color: var(--rework); }
button.worker { cursor: pointer; }
button.worker:hover { background: var(--sunken); }
.helper-btn { margin-left: auto; }
.btn.attention { box-shadow: none; background: var(--rework); color: var(--on-color); font-weight: 600; }
.btn.attention:hover { background: color-mix(in srgb, #000 12%, var(--rework)); }
.btn.icon { width: 32px; padding: 0; }
.btn.icon svg { width: 16px; height: 16px; }
.btn.attention[hidden] { display: none; }
/* 按钮里的数字：圆角小徽标，不和文字挤在一起 */
.cnt { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 4px;
  font-size: 12px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.btn.attention { gap: 8px; height: 32px; padding: 0 8px 0 12px; border-radius: 6px; }
.btn.attention .cnt { background: color-mix(in srgb, #fff 22%, transparent); color: var(--on-color); }

.att-modal { width: min(640px, 100%); }
/* 「需要你处理」：从页头按钮下面弹出的气泡，不盖暗整个页面 */
.att-pop { position: fixed; z-index: 30; top: 60px; right: 20px; }
.att-pop[hidden] { display: none; }
.att-pop .att-modal { width: min(620px, calc(100vw - 32px)); max-height: min(75vh, 720px); box-shadow: 0 0 0 1px var(--line), var(--shadow-pop); }
/* 缺人一行展开的提示词：缩进到文字下面，浅底一块 */
.att-prompt { margin: 0 0 10px 66px; padding: 10px 12px; border-radius: 6px; background: var(--sunken); }
.att-prompt .hint { margin: 0; font-size: 12.5px; line-height: 1.6; }
.att-prompt .pblock { margin-top: 8px; }
.att-prompt .pblock code { background: var(--surface); }
.att-pop::before { content: ""; position: absolute; z-index: 1; top: -6px; right: var(--arrow-x, 40px); width: 10px; height: 10px; transform: rotate(45deg);
  background: var(--surface); box-shadow: -1px -1px 0 var(--line); }
.att-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.att-head h4 { font-size: 13px; color: var(--faint); margin: 14px 0 4px; font-weight: 600; }
.att-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line-soft); font-size: 13px; }
.att-head + .att-row { border-top: none; }
/* 待你验收：每个需求一张可勾选的卡片；表头的复选框就是全选，和卡片里的复选框对齐 */
.acc-head { display: flex; align-items: center; gap: 12px; margin: 14px 0 8px; padding: 0 13px; font-size: 13px; font-weight: 600; color: var(--faint); cursor: pointer; }
.acc-list { display: flex; flex-direction: column; gap: 8px; }
.acc-row {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line-soft); border-radius: 6px;
  background: var(--surface); cursor: pointer; transition: background .12s, border-color .12s;
}
.acc-row:hover { background: var(--raised-hover); }
.acc-row.on { border-color: color-mix(in srgb, var(--brand) 45%, transparent); background: color-mix(in srgb, var(--brand) 6%, var(--surface)); }
.acc-row .txt { flex: 1; min-width: 0; font-size: 13.5px; line-height: 20px; }
.acc-row .txt b { font-weight: 650; margin-right: 6px; }
.acc-row .txt .hint { line-height: 18px; margin-top: 2px; }
.acc-row input { align-self: flex-start; margin-top: 2px; }
.acc-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 12px; }
/* 复选框：自绘，跟主题色走（开关样式的 .switch 另有定义） */
input[type="checkbox"]:not(.switch) {
  appearance: none; flex: none; width: 16px; height: 16px; margin: 0; border-radius: 3px; cursor: pointer;
  border: 1.5px solid color-mix(in srgb, var(--faint) 70%, transparent); background: var(--surface);
  display: inline-grid; place-items: center; transition: background .12s, border-color .12s;
}
input[type="checkbox"]:not(.switch):hover { border-color: var(--brand); }
input[type="checkbox"]:not(.switch):checked { background: var(--brand); border-color: var(--brand); }
input[type="checkbox"]:not(.switch):indeterminate { background: var(--brand); border-color: var(--brand); }
input[type="checkbox"]:not(.switch):indeterminate::after { content: ""; width: 8px; height: 2px; background: var(--on-color); border-radius: 1px; }
input[type="checkbox"]:not(.switch):checked::after {
  content: ""; width: 4px; height: 8px; margin-top: -2px;
  border: solid var(--on-color); border-width: 0 2px 2px 0; transform: rotate(45deg);
}
.btn.attention + .helper-btn, #notify-btn + .helper-btn { margin-left: 0; }
.helper-btn + .btn.icon { margin-left: -8px; }
#notify-btn[hidden] { display: none; }
/* 提示词面板：顶部右侧弹出 */
/* 使用说明：右侧整高面板，和任务抽屉同一套样式；顶部标题和标签页固定 */
.helper {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 15; width: min(560px, 100vw); overflow-y: auto;
  background: var(--surface); box-shadow: var(--shadow-pop), -16px 0 32px -12px rgba(9, 30, 66, .18);
}
.panel-top { position: sticky; top: 0; z-index: 1; background: var(--surface); padding: 12px 12px 0 24px; border-bottom: 1px solid var(--line-soft); }
.panel-body { padding: 4px 24px 32px; }
.helper[hidden] { display: none; }
/* 设置：每项一行，开关在右边 */
.setting { display: flex; align-items: center; gap: 16px; padding: 12px 0; border-top: 1px solid var(--line-soft); font-size: 13px; cursor: pointer; }
.helper-sec + .setting { border-top: none; }
.setting > span { display: flex; flex-direction: column; gap: 2px; flex: 1; order: -1; }
.setting > span .hint { line-height: 1.6; }
.switch {
  appearance: none; flex: none; position: relative; width: 36px; height: 20px; margin: 0; border-radius: 99px; cursor: pointer;
  background: color-mix(in srgb, var(--faint) 40%, transparent); transition: background-color .15s;
}
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.switch:checked { background: var(--brand); }
.switch:checked::after { transform: translateX(16px); }
.setting-num { width: 72px; height: 32px; padding: 0 8px; text-align: right; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink); font: inherit; flex: none; }
.rules-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.seg { display: inline-flex; padding: 2px; border-radius: 6px; background: var(--sunken); }
.seg button { border: 0; background: none; padding: 4px 12px; border-radius: 4px; font: inherit; font-size: 13px; color: var(--muted); cursor: pointer; }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--raised); color: var(--ink); box-shadow: var(--shadow-card); }
.rules-counts { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.rules-count, .role-pill {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 11px;
  background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-soft); color: var(--muted); font-size: 12px; white-space: nowrap;
}
.rules-count b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.role-pills { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 12px; font-size: 12.5px; color: var(--faint); }
.role-pill { border: 0; font: inherit; font-size: 12.5px; height: 26px; padding: 0 11px; border-radius: 13px; cursor: pointer; }
.role-pill:hover { color: var(--ink); }
.role-pill.on { background: var(--brand-soft); box-shadow: inset 0 0 0 1px var(--brand); color: var(--brand-ink); font-weight: 600; }
.role-pills .got { margin-left: auto; }
.rules-editor {
  display: block; width: 100%; min-height: 360px; margin-top: 10px; padding: 12px 14px; resize: vertical;
  border: 0; border-radius: 6px; background: var(--raised); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line);
  font: 12.5px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
}
.rules-editor:focus { outline: none; box-shadow: inset 0 0 0 1.5px var(--focus); }
.rules-view { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; max-height: 460px; overflow: auto; }
.rules-sec { padding: 10px 14px 8px; border-radius: 6px; background: var(--raised); box-shadow: inset 0 0 0 1px var(--line-soft); }
.rules-sec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 12px; color: var(--faint); }
.rules-tag { padding: 1px 7px; border-radius: 4px; background: var(--brand-soft); color: var(--brand-ink); font: 600 11.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
.rules-tag.all { background: var(--sunken); color: var(--muted); }
.rules-sec .md { font-size: 13px; line-height: 1.65; }
.rules-sec .md ul { margin: 0; padding-left: 18px; }
.rules-sec .md li + li { margin-top: 4px; }
.rules-empty { margin-top: 10px; padding: 28px 0; text-align: center; border-radius: 6px; background: var(--surface); color: var(--faint); font-size: 13px; }
.rules-warn { margin: 10px 0 0; padding: 6px 10px; border-radius: 4px; background: color-mix(in srgb, var(--rework) 10%, transparent); color: var(--rework); font-size: 12.5px; }
.rules-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.rules-foot .path { margin-left: auto; font-size: 12px; color: var(--faint); }
.tab-hint code { padding: 0 4px; border-radius: 3px; background: var(--surface); color: var(--ink); font-size: 12px; }
.btn:disabled { opacity: .45; cursor: default; }
.helper-head { display: flex; align-items: center; gap: 6px; }
.helper-head b { font-size: 17px; font-weight: 650; margin-right: auto; }
.tabs { display: flex; gap: 2px; margin: 6px 0 0 -14px; }
.tab-hint { margin: 14px 0 0; padding: 8px 12px; border-radius: 4px; background: var(--sunken); color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.tab {
  appearance: none; border: none; background: none; cursor: pointer; font: inherit; font-size: 13px;
  color: var(--muted); padding: 6px 14px; margin-bottom: -1px; border-bottom: 2px solid transparent;
}
.tab:hover { color: var(--ink); }
.tab.on { color: var(--brand); font-weight: 600; border-bottom-color: var(--brand); }
.helper-sec { display: flex; align-items: center; gap: 8px; margin: 24px 0 4px; }
.helper-sec h4 { font-size: 14px; color: var(--ink); margin: 0; font-weight: 650; margin-right: auto; }
.helper .hint { margin: 2px 0 0; line-height: 1.6; }
/* 每个 worker 一张卡片：上面一行信息 + 操作，下面是提示词 */
.wcard { background: var(--raised); border-radius: 6px; box-shadow: var(--shadow-card); padding: 12px 14px 14px; margin-top: 10px; }
.wcard-head > .av { width: 28px; height: 28px; font-size: 11px; }
.wcard .who-line { display: flex; flex-direction: column; min-width: 0; }
.wcard .who-line .hint { font-size: 12px; }
.wcard.focus { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); background: color-mix(in srgb, var(--brand-soft) 50%, transparent); }
.wcard-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.wcard-head .grow { margin-right: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; }
.pill { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 3px; font-size: 11.5px; font-weight: 700; background: color-mix(in srgb, var(--asking) 16%, transparent); color: var(--asking); }

.worker.offline .dot { background: var(--pending); }
.worker .meta { color: var(--muted); }
/* 页面顶部的提示条：浅色底、左侧色条、圆形图标 */
.banner, .needs {
  --c: var(--rework);
  position: relative; margin: 12px 20px 0; padding: 10px 16px 10px 46px; border-radius: 6px; font-size: 13px; line-height: 1.6;
  background: color-mix(in srgb, var(--c) 9%, var(--surface)); color: var(--ink);
  box-shadow: inset 3px 0 0 var(--c), 0 0 0 1px color-mix(in srgb, var(--c) 28%, transparent);
}
.banner::before, .needs::before {
  content: "!"; position: absolute; left: 16px; top: 11px; width: 18px; height: 18px; border-radius: 50%;
  display: grid; place-items: center; font-size: 12px; font-weight: 800; color: var(--on-color); background: var(--c);
}
.banner[hidden], .needs[hidden] { display: none; }
/* 浮动气泡：右上角叠放，不把页面内容往下推；右上角有关闭按钮 */
.toasts { position: fixed; z-index: 24; top: 64px; right: 20px; width: min(560px, calc(100vw - 32px)); display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toasts > .banner { margin: 0; padding-right: 40px; pointer-events: auto;
  background: color-mix(in srgb, var(--c) 7%, var(--surface));
  box-shadow: inset 3px 0 0 var(--c), 0 0 0 1px color-mix(in srgb, var(--c) 28%, transparent), var(--shadow-pop); animation: pop .14s ease-out; }
.toast-x { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 4px; background: transparent; color: var(--faint); cursor: pointer; }
.toast-x:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); color: var(--ink); }
.toast-x svg { width: 14px; height: 14px; }
.needs.pop { padding-right: 40px; }
.banner.stale { --c: var(--asking); }
/* 「有任务没人做」第一行带 32px 高的按钮，图标对齐这一行的中线 */
.needs::before { top: 17px; }
.needs { --c: var(--asking); }
/* 「有任务没人做」：从「需要你处理」里点缺人那一项打开的气泡，箭头对着「需要你处理」按钮 */
.needs.pop { padding-right: 40px; }
.needs.pop { position: fixed; z-index: 25; top: 60px; right: 20px; margin: 0; width: min(600px, calc(100vw - 32px)); max-height: min(70vh, 640px); overflow-y: auto;

/* 弹出的提词小窗（?prompter=T12）：整个窗口就是一条字幕，放在屏幕最下方 */

}
/* 顶部细进度条：走到第几步一眼可见 */

/* 悬浮窗里 :hover 不可靠（鼠标从顶部原生拖动条离开时网页收不到离开事件，按钮会一直显示），改由脚本控制：动了鼠标才显示，停 2.5 秒自动收起 */

.job .title { font-weight: 600; font-size: 13.5px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.job[aria-current="true"] .title { color: var(--brand-ink); }
.job .title .jid, .job-head .jid { color: var(--faint); font-weight: 500; margin-right: 6px; }
.job .sub .accepted { color: var(--approved); font-weight: 600; }
/* 已作废的需求：和作废的卡一样置灰，标题划掉 */
main.job-dropped .board, main.job-dropped .progress, main.job-dropped .job-side, main.job-dropped .report-bar { filter: grayscale(1); opacity: .6; }
main.job-dropped .board:hover { opacity: .85; }
main.job-dropped .card .t { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--faint) 70%, transparent); }
.since.dead-dep { color: var(--rework); font-weight: 600; }
.job.dropped .title { color: var(--faint); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--faint) 70%, transparent); }
.job.dropped .strip { opacity: .35; filter: grayscale(1); }
.accepted-toggle {
  display: flex; align-items: center; gap: 6px; width: 100%; margin-top: 10px; padding: 10px 12px 10px 14px;
  border: none; border-top: 1px solid var(--line-soft); background: none; cursor: pointer;
  color: var(--muted); font-size: 13px; font-weight: 600; text-align: left;
}
.accepted-toggle:hover { color: var(--ink); }
/* 已作废需求的提示条 */
.job-cancelled { padding: 8px 12px; border-radius: 6px; font-size: 13px; line-height: 1.6; color: var(--muted);
  background: color-mix(in srgb, var(--faint) 10%, var(--surface)); box-shadow: inset 3px 0 0 var(--faint); }
.report-bar .hint { flex-basis: 100%; color: var(--muted); font-size: 12.5px; }
.job .sub { color: var(--faint); font-size: 12px; display: flex; justify-content: space-between; margin-top: 5px; }

/* 需求进度：每个任务一格，按状态着色 */
.strip { display: flex; gap: 1px; margin-top: 7px; height: 4px; border-radius: 99px; overflow: hidden; }
.strip span { flex: 1; background: color-mix(in srgb, var(--pending) 30%, transparent); }
.strip span.s-approved { background: var(--approved); }
.strip span.s-working { background: var(--working); }
.strip span.s-rework { background: var(--rework); }
.strip span.s-asking { background: var(--asking); }
.strip span.s-submitted { background: var(--submitted); }
.strip span.s-held { background: var(--held); }
.strip.big { flex: 1; min-width: 200px; height: 8px; gap: 2px; margin: 0; border-radius: 0; overflow: visible; }
.strip.big span { position: relative; border-radius: 2px; }
.strip.big span:first-child { border-radius: 99px 2px 2px 99px; }
.strip.big span:last-child { border-radius: 2px 99px 99px 2px; }
.strip.big span:only-child { border-radius: 99px; }
.strip.big span.s-working::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent);
  background-size: 200% 100%; animation: sheen 2.4s linear infinite;
}
@keyframes sheen { from { background-position: 150% 0; } to { background-position: -50% 0; } }

main { padding: 22px 28px 16px; min-width: 0; display: flex; flex-direction: column; }
main > * { flex: none; }
/* 空状态：居中的图标 + 一句标题 + 下一步该做什么 */
.empty-state { margin: auto; padding: 48px 16px; max-width: 420px; text-align: center; color: var(--muted); }
.empty-state .ico-wrap { width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 50%; display: grid; place-items: center; background: var(--sunken); color: var(--faint); }
.empty-state .ico-wrap svg { width: 26px; height: 26px; }
.empty-state h3 { margin: 0 0 6px; font-size: 15px; font-weight: 650; color: var(--ink); }
.empty-state p { margin: 0 0 14px; font-size: 13px; line-height: 1.7; }
nav.jobs .empty-state { padding: 28px 8px; }
nav.jobs .empty-state .ico-wrap { width: 44px; height: 44px; }
nav.jobs .empty-state .ico-wrap svg { width: 20px; height: 20px; }
/* 骨架屏：第一次拿到数据前的占位 */
.sk { border-radius: 4px; background: linear-gradient(90deg, var(--sunken) 0, color-mix(in srgb, var(--sunken) 40%, var(--surface)) 50%, var(--sunken) 100%); background-size: 200% 100%; animation: sk 1.4s ease-in-out infinite; }
@keyframes sk { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.sk-job { height: 64px; margin: 4px 0; }
.sk-line { height: 14px; margin: 8px 0; }
.sk-title { height: 26px; width: 55%; margin: 18px 0 12px; }
.sk-board { flex: 1 0 0; min-height: 420px; display: grid; grid-template-columns: repeat(7, minmax(120px, 1fr)); gap: 8px; margin-top: 22px; }
.sk-lane { border-radius: 6px; background: var(--sunken); padding: 40px 6px 6px; }
.sk-card { height: 116px; margin-bottom: 6px; background: color-mix(in srgb, var(--raised) 70%, transparent); border-radius: 4px; }
.job-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 24px; align-items: start; }
.job-head .crumbs { grid-column: 1 / -1; font-size: 12.5px; color: var(--faint); }
.job-head h2.job-title { font-size: 22px; line-height: 1.4; color: var(--ink); font-weight: 650; margin: 0; }
.job-head h2.job-title.dropped { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--faint) 70%, transparent); }
.job-head .head-acts { padding-top: 4px; }
.job-head .desc { grid-column: 1 / -1; color: var(--muted); margin: 2px 0 0; max-width: 78ch; white-space: pre-wrap; font-size: 13.5px; line-height: 1.7; }
.job-head .desc.clamped { max-height: 5.1em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 40%, transparent); mask-image: linear-gradient(#000 40%, transparent); }
.job-head .more { grid-column: 1 / -1; justify-self: start; border: none; background: none; color: var(--brand); font-size: 13px; padding: 0; cursor: pointer; }
.job-head .more:hover { text-decoration: underline; }
.job-head .origin-box { grid-column: 1 / -1; }
/* 普通需求：左边标题和说明（说明铺满左栏，不留缝），右边一张概览卡：数字、各角色进度、最近动态。
   卡片不撑高头部：高度跟左栏走（说明收起时矮、展开时高），放不下的动态在卡里滚动 */
.job-head .crumbs { display: flex; align-items: center; gap: 10px; }
.job-head .crumbs .lozenge { height: 20px; font-size: 11.5px; }
.job-head.has-side { grid-template-columns: minmax(0, 1fr) minmax(340px, 480px); gap: 0 28px; align-items: stretch; }
.job-head.has-side .desc { max-width: none; }
.job-main { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-content: start; min-width: 0; }
.job-main > * { grid-column: 1 / -1; }
.job-main > h2.job-title { grid-column: 1; grid-row: 2; }
.job-main > .head-acts { grid-column: 2; grid-row: 2; align-self: start; }
.job-side { position: relative; }
.job-side.bare { min-height: 0; }
.job-side .inner { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden;
  padding: 14px 16px 10px; border: 1px solid var(--line-soft); border-radius: 8px; background: var(--surface); }
.job-side.bare .inner { position: static; }
.kpis { flex: none; display: grid; grid-template-columns: repeat(4, auto) minmax(0, 1fr); }
.kpi { display: grid; gap: 2px; padding: 0 14px; border-left: 1px solid var(--line-soft); min-width: 0; }
.kpi:first-child { padding-left: 0; border-left: none; }
.kpi b { font-size: 18px; line-height: 24px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.kpi b small { font-size: 12px; font-weight: 500; color: var(--faint); margin-left: 1px; }
.kpi.dur b { font-size: 13.5px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; }
.kpi span { font-size: 11.5px; line-height: 16px; color: var(--faint); white-space: nowrap; }
.kpi.warn b { color: var(--rework); }
.roles { flex: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px 18px; }
.role .rl { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; line-height: 18px; color: var(--muted); }
.role .rl b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.role > i { display: block; position: relative; height: 4px; margin-top: 3px; border-radius: 2px; background: var(--sunken); overflow: hidden; }
.role > i > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--working); }
.role.full > i > i { background: var(--approved); }
.activity { flex: 1; min-height: 0; display: flex; flex-direction: column; padding-top: 10px; border-top: 1px solid var(--line-soft); }
.side-h { flex: none; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; font-size: 12px; font-weight: 650; color: var(--muted); }
.side-h .sub { font-weight: 400; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default; }
.acts { list-style: none; margin: 0 -8px; padding: 0; overflow: hidden; min-height: 0; flex: 1; }
.acts li[hidden], .activity[hidden] { display: none; }
.acts li { display: grid; grid-template-columns: 7px auto minmax(0, 1fr); align-items: center; gap: 10px; padding: 2px 8px; border-radius: 4px; font-size: 12.5px; line-height: 22px; }
.acts li.link { cursor: pointer; }
.acts li.link:hover, .acts li.link:focus-visible { background: var(--sunken); }
.acts li i { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--pending)); }
.acts .when { color: var(--faint); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.acts .what { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.acts .what .key { color: var(--muted); margin-right: 6px; }
.acts .what .who { color: var(--faint); font-size: 12px; margin-left: 8px; }
/* 窄屏：概览卡挪到说明下面，自己撑高；数字和角色进度并排 */
@media (max-width: 1180px) {
  .job-head.has-side { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .job-side { min-height: 0; }
  /* 高度由内容撑开（不能跟宽屏一样 height:100%，Safari 会按旧高度算，把下面裁掉）；
     数字和角色进度能并排就并排，放不下角色进度折到下一行 */
  .job-side .inner, .job-side.bare .inner { position: static; height: auto; overflow: visible; display: flex; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 12px 28px; padding: 12px 16px; }
  .job-side .roles { flex: 1 1 260px; }
  .job-side .activity { flex: 1 1 100%; min-height: auto; }
  /* 宽屏里动态列表靠 min-height:0 在卡内滚动；窄屏要按真实高度撑开，否则 Safari 把行高算矮，卡片压到下面的进度条上 */
  .job-side .acts { flex: none; min-height: auto; overflow: visible; }
}
.lozenge {
  display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 3px; white-space: nowrap;
  font-size: 11.5px; font-weight: 700; color: var(--c, var(--faint)); background: color-mix(in srgb, var(--c, var(--faint)) 15%, transparent);
}
.progress { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; margin: 16px 0; }
.stats { display: flex; flex-wrap: wrap; align-items: center; color: var(--faint); font-size: 12.5px; white-space: nowrap; }
.stats span + span { border-left: 1px solid var(--line); margin-left: 14px; padding-left: 14px; }
.stats b { color: var(--ink); font-weight: 650; font-size: 13px; margin-left: 5px; }

/* 需求页上的汇报提示条：一行，点按钮进入阅读页 */
.report-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  background: color-mix(in srgb, var(--approved) 8%, var(--surface)); border-radius: 6px;
  box-shadow: inset 3px 0 0 var(--approved), 0 0 0 1px color-mix(in srgb, var(--approved) 25%, transparent);
  padding: 10px 14px 10px 16px; margin-bottom: 16px;
}
.report-bar .what { font-weight: 600; color: var(--approved); }
.report-bar .when { color: var(--muted); font-size: 12.5px; margin-right: auto; }
.btn.primary { box-shadow: none; background: var(--brand); color: var(--on-color); font-weight: 600; }
.btn.primary:hover { background: color-mix(in srgb, #000 12%, var(--brand)); }
.btn.warn { box-shadow: none; background: var(--rework); color: var(--on-color); font-weight: 600; }
.btn.warn:hover { background: color-mix(in srgb, #000 12%, var(--rework)); }

/* 汇报阅读页：全屏，正文居中 */
.modal-back { position: fixed; inset: 0; z-index: 30; background: var(--backdrop); display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal-back[hidden] { display: none; }
.modal {
  width: min(560px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column;
  background: var(--surface); border-radius: 8px; box-shadow: var(--shadow-pop); overflow: hidden;
  animation: pop .14s ease-out;
}
.modal-back.again .modal, .att-pop.again .modal { animation: none; }
@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.985); } }
.modal-head { display: flex; align-items: center; gap: 8px; padding: 16px 12px 12px 24px; flex: none; }
.modal .modal-head h3 { margin: 0 auto 0 0; font-size: 17px; font-weight: 650; }
.modal-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 24px 16px; overscroll-behavior: contain; }
.modal-foot { flex: none; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 24px 16px; border-top: 1px solid var(--line-soft); }
.modal-foot .hint { margin-right: auto; }
.modal h3 { margin: 0 0 6px; font-size: 17px; font-weight: 650; }
.modal .lead { margin: 0 0 12px; color: var(--muted); font-size: 13px; line-height: 1.6; }
.modal .stale-item { background: var(--raised); border-radius: 6px; box-shadow: var(--shadow-card); padding: 12px 14px; margin-top: 10px; }
.modal .stale-item p { margin: 0 0 6px; font-size: 13.5px; line-height: 1.6; }
.modal .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
/* 决定框：每个选项是一张可点的卡片，标题 + 一句说明 */
.choices { display: grid; gap: 8px; margin-top: 8px; }
.choice {
  display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; cursor: pointer;
  padding: 10px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--raised);
}
.choice:hover { border-color: var(--brand); background: color-mix(in srgb, var(--brand-soft) 45%, var(--raised)); }
.choice.on { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
.choice .radio { flex: none; width: 16px; height: 16px; margin-top: 2px; border-radius: 50%; border: 2px solid var(--faint); }
.choice:hover .radio, .choice.on .radio { border-color: var(--brand); box-shadow: inset 0 0 0 3px var(--raised), inset 0 0 0 8px var(--brand); }
.choice b { display: block; font-size: 13.5px; font-weight: 600; }
.choice span.d { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.55; margin-top: 2px; }
/* 「需要你处理」列表：每件事一行，前面是类别小色块 */
.att-row .kind { flex: none; width: 52px; justify-content: center; margin-right: 4px; }
.att-row .what { flex: 1; min-width: 0; display: flex; align-items: center; gap: 0 10px; line-height: 1.5; }
.att-row .btn.sm { flex: none; min-width: 72px; }
.modal-body > .att-row:first-child { border-top: none; }
.report-page { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; }
.report-page[hidden] { display: none; }
.report-top {
  position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px;
  height: 56px; padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.report-top .crumb { color: var(--faint); font-size: 13px; margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.report-top .crumb b { color: var(--ink); font-weight: 600; }
.report-top .btn svg { width: 16px; height: 16px; }
/* 正文居中，宽屏时右边是目录 */
.report-wrap { display: grid; grid-template-columns: minmax(0, 780px); justify-content: center; gap: 32px; padding: 32px 20px 80px; }
@media (min-width: 1180px) { .report-wrap.has-toc { grid-template-columns: minmax(0, 780px) 220px; } }
.report-toc { display: none; }
@media (min-width: 1180px) {
  .report-wrap.has-toc .report-toc { display: block; position: sticky; top: 88px; align-self: start; font-size: 13px; }
}
.report-toc h5 { margin: 0 0 8px; font-size: 12px; color: var(--faint); font-weight: 600; }
.report-toc a { display: block; padding: 4px 0 4px 12px; border-left: 2px solid var(--line); color: var(--muted); text-decoration: none; line-height: 1.5; }
.report-toc a:hover { color: var(--brand); border-left-color: var(--brand); }
.report-sheet {
  min-width: 0; padding: 36px 48px 44px;
  background: var(--raised); border-radius: 8px; box-shadow: var(--shadow-card);
}
.report-title { margin: 0 0 14px; font-size: 26px; line-height: 1.35; font-weight: 700; }
.report-meta { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 20px; margin-bottom: 8px; border-bottom: 1px solid var(--line-soft); }
.report-meta span { display: inline-flex; align-items: baseline; gap: 6px; padding: 4px 10px; border-radius: 4px; background: var(--sunken); color: var(--faint); font-size: 12.5px; }
.report-meta b { color: var(--ink); font-weight: 650; font-size: 13px; }
.report-sheet .md { font-size: 15px; line-height: 1.8; }
.report-sheet .md h1 { font-size: 22px; line-height: 1.35; margin: 24px 0 14px; }
.report-sheet .md h2 { font-size: 18px; margin: 34px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line-soft); scroll-margin-top: 72px; }
.report-sheet .md h3 { font-size: 15.5px; margin: 24px 0 8px; }
.report-sheet .md blockquote { border-left-color: var(--brand); background: var(--sunken); padding: 6px 14px; border-radius: 0 4px 4px 0; }
.report-sheet .md table { font-size: 13.5px; }
.report-sheet .md th { background: var(--sunken); }
.report-sheet .accept-tip { margin-top: 28px; padding: 12px 16px; border-radius: 6px; background: color-mix(in srgb, var(--approved) 9%, var(--surface)); box-shadow: inset 3px 0 0 var(--approved); color: var(--ink); font-size: 13.5px; }
.report-sheet .md li { margin: 4px 0; }
.report-sheet .md code { font-size: 13px; }
@media (max-width: 700px) { .report-wrap { padding: 0; } .report-sheet { border-radius: 0; box-shadow: none; padding: 20px 16px 40px; } }

/* 看板：七列等宽，铺满剩余高度，列内各自滚动（参考 Jira） */
.board { flex: 1 0 0; min-height: 420px; display: grid; grid-template-columns: repeat(7, minmax(188px, 1fr)); gap: 8px; overflow-x: auto; }
/* 窄屏时七列放不下要横向滚动；Mac 默认滚动条不显示，用户不知道右边还有列。给看板一条常显的滚动条 */
.board::-webkit-scrollbar { height: 10px; }
.board::-webkit-scrollbar-track { background: transparent; }
.board::-webkit-scrollbar-thumb { border-radius: 5px; border: 2px solid var(--bg); background: color-mix(in srgb, var(--faint) 55%, transparent); }
.board::-webkit-scrollbar-thumb:hover { background: var(--faint); }
.lane { background: var(--sunken); border-radius: 6px; display: flex; flex-direction: column; min-height: 0; }
.lane h3 { display: flex; align-items: center; gap: 7px; margin: 0; padding: 10px 12px 8px; flex: none; font-size: 12px; font-weight: 600; color: var(--muted); }
.lane h3::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.lane h3 .label { margin-right: auto; }
.lane h3 .n {
  min-width: 20px; height: 18px; padding: 0 6px; border-radius: 99px; display: grid; place-items: center;
  font-size: 11.5px; font-weight: 600; color: var(--faint); background: color-mix(in srgb, var(--faint) 14%, transparent);
}
.lane.has h3 .n { color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
.lane .cards { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 6px 6px; }
.lane .empty-hint { padding: 20px 0; text-align: center; font-size: 12px; color: color-mix(in srgb, var(--faint) 80%, transparent); }

/* 卡片：统一高度。标题最多两行；中间一行放标记（放不下的往右淡出，不换行、不压标题）；底部是图标、编号、角色、负责人 */
.card {
  position: relative; display: flex; flex-direction: column; width: 100%; height: 116px; text-align: left; cursor: pointer;
  margin-bottom: 6px; padding: 10px 10px 9px 12px; border: none; border-radius: 4px;
  background: var(--raised); color: var(--ink); box-shadow: var(--shadow-card);
  transition: box-shadow .12s ease, background-color .12s ease;
}
.card:hover { background: var(--raised-hover); box-shadow: var(--shadow-lift); }
.card:active { box-shadow: var(--shadow-card); }
.card .t {
  flex: none; font-size: 13.5px; font-weight: 500; line-height: 1.5; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card .flags {
  flex: none; display: flex; flex-wrap: nowrap; align-items: center; gap: 6px; margin-top: 6px; min-height: 18px; overflow: hidden;
  -webkit-mask-image: linear-gradient(to left, transparent 0, #000 14px); mask-image: linear-gradient(to left, transparent 0, #000 14px);
}
.card .flags > * { flex: none; }

  position: absolute; top: 10px; right: 10px; z-index: 1; display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 10px 0 8px;

  font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; opacity: 0; transition: opacity .15s ease, background-color .15s ease, color .15s ease;
}

.side-hold:hover { color: var(--ink); background: var(--raised-hover); }

.btn.pause-btn svg { width: 13px; height: 13px; flex: none; }
.prompter-strip .head .strip-pause {
  flex: none; display: inline-flex; align-items: center; gap: 5px; font: inherit; font-size: 12.5px; font-weight: 600; padding: 3px 11px; cursor: pointer;
  border: 1px solid #a87f0e; border-radius: 6px; background: rgba(168, 127, 14, .18); color: #f2d27a;
}

/* 指派给：参考 Jira 的经办人选择器，按钮显示头像 + 名字，展开是带头像和状态的列表 */

/* 任务详情抽屉（参考 Jira 的任务详情）：顶部固定一条工具栏；宽屏时右侧是「详情」栏 */
.drawer {

.drawer .facts dt { color: var(--faint); }
.drawer .facts dd { margin: 0; min-height: 22px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px; color: var(--ink); overflow-wrap: anywhere; }

.drawer ol.checklist { list-style: none; margin: 0; padding: 0; counter-reset: ac; }
.drawer ol.checklist li { position: relative; counter-increment: ac; padding: 6px 0 6px 32px; font-size: 13.5px; line-height: 1.6; border-top: 1px solid var(--line-soft); }
.drawer ol.checklist li:first-child { border-top: none; }
.drawer ol.checklist li::before {
  content: counter(ac); position: absolute; left: 0; top: 7px; width: 20px; height: 20px; border-radius: 50%;
  display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--muted); background: var(--sunken);
}

code, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
.timeline { list-style: none; margin: 0; padding: 0; }

.cancelled-row:hover { background: var(--raised-hover); color: var(--ink); }
.cancelled-row .key { font-weight: 600; text-decoration: line-through; color: var(--faint); }
.cancelled-row .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cancelled-row .why { color: var(--faint); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cancelled-row .av { width: 22px; height: 22px; font-size: 10px; filter: grayscale(1); opacity: .7; }
@media (max-width: 700px) { .cancelled-row { grid-template-columns: 48px minmax(0, 1fr) 24px; } .cancelled-row .tag, .cancelled-row .why { display: none; } }

/* 宽屏：页面本身不滚动，需求列表和看板各自滚动。
   否则页面滚动条和抽屉的滚动条会在右边并排出现两条 */
@media (min-width: 901px) {
  body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  body > header.top { flex: none; }
  .layout { flex: 1; min-height: 0; grid-template-rows: minmax(0, 1fr); }
  nav.jobs, main { overflow-y: auto; scrollbar-width: thin; }
  /* 看板高度 = 主区可视高度：头部（标题、说明、概览）在上面，往上滑就能把头部滑走、让看板占满一屏；
     原来看板只填剩下的空间，主区没有可滚的内容，滑不动 */
  @supports (height: 1cqh) {
    main { container-type: size; }
    main > .board { flex: none; height: calc(100cqh - 38px); }
  }
}
/* 拖动滚动时不选中文字 */
html.drag-scrolling, html.drag-scrolling * { user-select: none !important; -webkit-user-select: none !important; cursor: grabbing !important; }
.drawer, .helper { scrollbar-width: thin; overscroll-behavior: contain; }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  nav.jobs { border-right: none; border-bottom: 1px solid var(--line); }
  main { padding: 16px; }
  .board { flex: none; min-height: 0; grid-template-columns: 1fr; overflow-x: visible; }
  .lane .cards { overflow: visible; }
}
@media (prefers-reduced-motion: reduce) {
  .drawer, .card, .switch, .switch::after { transition: none; }

}

<script>
'use strict';

const LANES = [
  { key: 'pending', label: '待领取' },
  { key: 'working', label: '进行中' },
  { key: 'rework', label: '返工中' },
  { key: 'asking', label: '等待答复' },
  { key: 'submitted', label: '待 review' },
  { key: 'approved', label: '已通过' },
  { key: 'held', label: '已挂起' },
];
const LANE_LABEL = { ...Object.fromEntries(LANES.map((l) => [l.key, l.label])), cancelled: '已作废' };
const JOB_STATUS = { planning: '规划中', active: '进行中', awaiting_acceptance: '待你验收', accepted: '已验收', cancelled: '已作废' };
const JOB_LOZENGE = { planning: 'pending', active: 'working', awaiting_acceptance: 'asking', accepted: 'approved', cancelled: 'cancelled' };
let descOpenJob = null; // 展开了说明的需求
let acceptArm = null; // 「验收通过」两步确认：记需求编号

async function acceptJob(id) {
  try {
    await fetch('/api/jobs/accept', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ ids: [id] }) });
  } catch {}
  acceptArm = null;
  await poll();
}

// 待验收需求的「验收通过」按钮，点两次生效
function acceptButtons(job) {
  if (job.status !== 'awaiting_acceptance') return null;
  if (acceptArm !== job.id) {
    return el('button', { class: 'btn', onclick: (e) => { e.stopPropagation(); acceptArm = job.id; render(); } }, '验收通过');
  }
  return [
    el('button', { class: 'btn ghost', onclick: (e) => { e.stopPropagation(); acceptArm = null; render(); } }, '取消'),
    el('button', { class: 'btn primary', onclick: (e) => { e.stopPropagation(); acceptJob(job.id); } }, `确认 ${job.id} 验收通过`),
  ];
}
const ACCEPT_HINT = '测过没问题就点「验收通过」；有问题就在对话里告诉 leader 哪里不对，它会在这个需求下加修复任务。';
const HISTORY = {
  created: ['创建', 'pending'], claimed: ['领取', 'working'], progress: ['进度', 'working'],
  asked: ['提问', 'asking'], answered: ['答复', 'asking'], submitted: ['交付', 'submitted'],
  approved: ['通过', 'approved'], rejected: ['打回', 'rework'], handoff: ['掉线交接', 'held'],
  held: ['挂起', 'held'], released: ['放回', 'pending'], edited: ['修改', 'pending'], cancelled: ['作废', 'cancelled'],
  demo_ended: ['运行结束', 'approved'], demo_saved: ['操作记录', 'approved'],
  note: ['补充说明', 'pending'], critique: ['审卡', 'held'], demo_paused: ['暂停', 'asking'], demo_resumed: ['继续', 'working'],
};
// 演播卡的状态：名称、lozenge 颜色
const DEMO_STATUS = { ready: ['待演播', 'pending'], queued: ['等待开始', 'asking'], demoing: ['演播中', 'working'], wrapping: ['收尾中', 'submitted'], cancelled: ['已作废', 'cancelled'] };
const RUN_OUTCOME = { done: '跑完', stopped: '叫停', interrupted: '中断' };
const RUN_MODE = { rehearsal: '预演', show: '演播' };

let data = null;
let lastJson = '';
let lastEtag = '';
let view = { job: null, task: null, report: false };
let showPrompts = false;
let copied = null; // 刚复制的提示词，用来显示「已复制」
// 抽屉是否展开到大半屏；记在本浏览器里，下次打开保持
let drawerWide = false;
try { drawerWide = localStorage.getItem('ateam.drawerWide') === '1'; } catch {}

// ---------- 小工具 ----------

// 用一组子节点替换 node 的内容；嵌套数组会展开，null/false 跳过，字符串转成文本
function fill(node, ...children) {
  node.replaceChildren(...children.flat(Infinity).filter((c) => c != null && c !== false));
}

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat(Infinity)) {
    if (c == null || c === false) continue;
    node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return node;
}

const icon = (id, cls = '') => {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', `ico ${cls}`);
  svg.setAttribute('aria-hidden', 'true');
  const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  use.setAttribute('href', `#i-${id}`);
  svg.append(use);
  return svg;
};
// 头像上的字：frontend-13 这类编号显示尾号，其他显示首字
function avText(name) {
  const m = String(name).match(/-(\d+)$/);
  return m ? m[1] : String(name).trim().charAt(0).toUpperCase();
}
function avatar(id, role) {
  if (!id) return el('span', { class: 'av none', title: '还没人领' });
  const a = data.state.agents.find((x) => x.id === id);
  return el('span', { class: 'av', style: roleStyle(role ?? a?.role ?? ''), title: agentLabel(id) }, avText(a?.name || id));
}

// 空状态：图标 + 标题 + 下一步做什么（可带一个按钮）
function emptyState(iconId, title, text, action) {
  return el('div', { class: 'empty-state' },
    el('div', { class: 'ico-wrap' }, icon(iconId)),
    el('h3', null, title),
    text ? el('p', null, text) : null,
    action || null);
}
// 弹框的标题栏：标题 + 右侧按钮（默认一个关闭图标）
function modalHead(title, onClose, extra) {
  return el('div', { class: 'modal-head' },
    el('h3', null, title),
    extra || null,
    onClose ? el('button', { class: 'btn ghost icon', title: '关闭', 'aria-label': '关闭', onclick: (e) => { e.stopPropagation(); onClose(); } }, icon('close')) : null);
}
const openGuide = (tab) => el('button', { class: 'btn primary', onclick: (e) => { e.stopPropagation(); helper = { open: true, focus: null, tab }; renderHelper(); } }, tab === 'lead' ? '查看 leader 提示词' : '打开使用说明');

const pad = (n) => String(n).padStart(2, '0');
function fmtTime(ts) {
  const d = new Date(ts);
  return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function ago(ts) {
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (s < 60) return `${s} 秒前`;
  if (s < 3600) return `${Math.floor(s / 60)} 分钟前`;
  return `${Math.floor(s / 3600)} 小时前`;
}

// 时长：45 秒 / 23 分钟 / 2 小时 5 分 / 1 天 3 小时
function dur(ms) {
  const m = Math.floor(Math.max(0, ms) / 60000);
  if (m < 1) return `${Math.round(Math.max(0, ms) / 1000)} 秒`;
  if (m < 60) return `${m} 分钟`;
  if (m < 1440) return `${Math.floor(m / 60)} 小时${m % 60 ? ` ${m % 60} 分` : ''}`;
  return `${Math.floor(m / 1440)} 天${Math.floor(m % 1440 / 60) ? ` ${Math.floor(m % 1440 / 60)} 小时` : ''}`;
}
// 已通过任务的总用时：第一次被领取 → 最后一次通过（含 review、打回返工）
function spent(t) {
  const start = t.history.find((h) => h.type === 'claimed');
  const end = t.history.findLast((h) => h.type === 'approved');
  return start && end ? new Date(end.ts) - new Date(start.ts) : null;
}

// 卡片上的时间：在当前这一列待了多久。等 leader 的（等待答复、待 review）超过 10 分钟、
// 做了超过 30 分钟就标橙色。已通过显示总用时；待领取但依赖还没通过的显示「等依赖」
// 只显示时钟 + 时长，含义写在鼠标悬停提示里
const SINCE = {
  pending: [['created', 'released', 'handoff', 'rejected', 'cancelled']],
  working: [['claimed'], 30], rework: [['rejected'], 30],
  asking: [['asked'], 10], submitted: [['submitted'], 10],
  held: [['rejected', 'handoff', 'released', 'created']],
};
const LANE_TIME_TIP = { pending: '排队时长', working: '处理时长', rework: '返工时长', asking: '等待答复时长', submitted: '等待 review 时长', held: '挂起时长' };
function laneTime(t, lane) {
  if (lane === 'approved') {
    const ms = spent(t);
    return ms == null ? null : el('span', { class: 'since', title: '总耗时' }, icon('clock'), dur(ms));
  }
  // 依赖的卡已作废：永远等不到，标红让人去改依赖（正常流程不会出现，老数据才有）
  const deadDeps = t.status === 'pending' || t.status === 'held' ? t.dependsOn.filter((id) => data.state.tasks.find((x) => x.id === id)?.status === 'cancelled') : [];
  if (deadDeps.length) {
    return el('span', { class: 'since dead-dep', title: `依赖的 ${deadDeps.join('、')} 已作废，这张卡永远等不到依赖完成，不会被派发。请让 leader 用 ateam task edit ${t.id} --after ... 去掉这个依赖` }, icon('clock'), `依赖 ${deadDeps.join('、')} 已作废`);
  }
  if (lane === 'pending' && t.dependsOn.some((id) => data.state.tasks.find((x) => x.id === id)?.status !== 'approved')) {
    return el('span', { class: 'since', title: `等待依赖任务通过：${t.dependsOn.join('、')}` }, icon('clock'), '等依赖');
  }
  const rule = SINCE[lane];
  const h = rule && t.history.findLast((x) => rule[0].includes(x.type));
  if (!h) return null;
  const since = new Date(h.ts).getTime();
  const node = el('span', { class: 'since', title: LANE_TIME_TIP[lane], 'data-since': since, 'data-late': rule[1] ? rule[1] * 60000 : null }, icon('clock'), el('span'));
  tickSince(node);
  return node;
}
function tickSince(n) {
  const ms = Date.now() - Number(n.dataset.since);
  n.lastChild.textContent = dur(ms);
  n.classList.toggle('late', !!n.dataset.late && ms > Number(n.dataset.late));
}

function laneOf(t) {
  if (t.status === 'working' && t.rejectCount > 0) return 'rework';
  return t.status;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// 极简 markdown：先转义 HTML，再处理标题、列表、代码块、行内代码、粗体
// 极简 markdown：先转义 HTML，再处理标题、（可嵌套的）列表、代码块、表格、引用、行内代码、粗体、链接
function renderMarkdown(src) {
  const lines = escapeHtml(String(src ?? '').replace(/\t/g, '  ')).split('\n');
  const out = [];
  const stack = []; // 打开的列表：{ tag, indent }
  let para = [];
  const inline = (t) => t
    .replace(/`([^`]+)`/g, (_, c) => `<code>${c.replace(/\*/g, '&#42;')}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const flushPara = () => { if (para.length) { out.push(`<p>${para.map(inline).join('<br>')}</p>`); para = []; } };
  const closeLists = (indent = -1) => {
    while (stack.length && stack[stack.length - 1].indent > indent) out.push(`</li></${stack.pop().tag}>`);
  };
  const closeAll = () => { flushPara(); closeLists(); };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    let m;
    if ((m = line.match(/^(\s*)```/))) {
      closeAll();
      const code = [];
      while (++i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i].slice(m[1].length));
      out.push(`<pre><code>${code.join('\n')}</code></pre>`);
      continue;
    }
    if (!line.trim()) { flushPara(); continue; }
    if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { closeAll(); const n = Math.min(m[1].length, 3); out.push(`<h${n}>${inline(m[2])}</h${n}>`); continue; }
    if ((m = line.match(/^\s*&gt;\s?(.*)$/))) { closeAll(); out.push(`<blockquote>${inline(m[1])}</blockquote>`); continue; }
    if (/^\s*\|.*\|\s*$/.test(line)) {
      closeAll();
      const rows = [];
      for (; i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i]); i++) rows.push(lines[i]);
      i--;
      const cells = (r) => r.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
      const body = rows.filter((r) => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      const head = rows.length > 1 && /^\s*\|[\s:|-]+\|\s*$/.test(rows[1]) ? body.shift() : null;
      out.push(`<table>${head ? `<thead><tr>${cells(head).map((c) => `<th>${inline(c)}</th>`).join('')}</tr></thead>` : ''}<tbody>${body.map((r) => `<tr>${cells(r).map((c) => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
      continue;
    }
    if ((m = line.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/))) {
      flushPara();
      const indent = m[1].length;
      const tag = /\d/.test(m[2]) ? 'ol' : 'ul';
      closeLists(indent);
      const top = stack[stack.length - 1];
      if (top && top.indent === indent && top.tag === tag) out.push('</li><li>');
      else {
        if (top && top.indent === indent) out.push(`</li></${stack.pop().tag}>`);
        out.push(`<${tag}><li>`);
        stack.push({ tag, indent });
      }
      out.push(inline(m[3]));
      continue;
    }
    // 列表项下面缩进的续行，归到当前列表项
    if (stack.length && /^\s+/.test(line)) { out.push(`<br>${inline(line.trim())}`); continue; }
    closeLists();
    para.push(line.trim());
  }
  closeAll();
  return out.join('\n');
}

function strip(tasks, big) {
  return el('div', { class: big ? 'strip big' : 'strip', 'aria-hidden': 'true' },
    tasks.map((t) => el('span', { class: `s-${laneOf(t)}`, title: `${t.id} ${LANE_LABEL[laneOf(t)]}` })));
}

function reviewStats(tasks) {
  let reviews = 0;
  let rejects = 0;
  for (const t of tasks) {
    for (const h of t.history) {
      if (h.type === 'approved') reviews++;
      if (h.type === 'rejected') { reviews++; rejects++; }
    }
  }
  const approved = tasks.filter((t) => t.status === 'approved');
  const firstPass = approved.filter((t) => t.rejectCount === 0).length;
  const rate = approved.length ? `${Math.round((firstPass / approved.length) * 100)}%` : '—';
  return { reviews, rejects, rate, approved: approved.length };
}

// ---------- 渲染 ----------

// 审卡 worker 的进度：它这一批卡里还没审的，第一张就是正在审的
function criticProgress(a) {
  const reviewed = (t) => (t.critiquedRev ?? -1) === (t.rev ?? 0);
  const left = (a.critiqueBatch || [])
    .map((id) => data.state.tasks.find((t) => t.id === id))
    .filter((t) => t && t.status !== 'cancelled' && !reviewed(t));
  const leaving = a.dismiss || data.config?.criticAutoLeave ? '，审完下线' : '';
  if (left.length) return `审 ${left[0].id}${left.length > 1 ? `，这批还剩 ${left.length} 张` : ''}${leaving}`;
  const last = a.lastCritiqued?.length ? `，刚审完 ${a.lastCritiqued.join('、')}` : '';
  return `等新卡${last}`;
}

  // 审卡 worker 和 leader 一样常驻，紧挨着 leader 放

// 在线 worker 超过 3 分钟没有任何动静（挂着 wait 的 worker 最多 90 秒就会刷新一次心跳）→ 多半停住了
const STALE_MS = 3 * 60 * 1000;
function isStale(a) {
  return a.status === 'online' && Date.now() - a.lastSeenAt > STALE_MS;
}

let helper = { open: false, focus: null };
let dismissAllArm = false; // 「全部下线」两步确认
let dismissArm = null; // 单个 worker 下线的两步确认（手上有任务，或是本角色最后一个时）

// 本角色唯一在线的 worker（已安排「做完再下线」的不算）：每个角色至少留一个，下线前要用户确认
function isLastOfRole(a) {
  if (a.dismiss) return false;
  const role = a.role.trim().toLowerCase();
  return data.state.agents.filter((x) => x.status === 'online' && !x.dismiss && x.role.trim().toLowerCase() === role).length === 1;
}

function dismissButtons(a) {
  const stop = (fn) => (e) => { e.stopPropagation(); fn(); };
  const last = isLastOfRole(a);
  const lastTip = last ? `${a.role} 角色只剩它一个，下线后这个角色的新任务没人领` : '';
  // 已安排做完再下线：可以撤销，或改成立即下线
  if (a.dismiss) {
    return [
      el('button', { class: 'btn ghost sm', title: '撤销「做完再下线」，它会继续领新任务', onclick: stop(() => keepAgents([a.id])) }, '撤销'),
      el('button', { class: 'btn ghost sm', title: '立即下线；进行中的任务退回待领取', onclick: stop(() => dismissAgents({ ids: [a.id], userApproved: true })) }, '立即下线'),
    ];
  }
  const critic = a.role.trim().toLowerCase() === 'critic';
  if (dismissArm !== a.id) {
    return el('button', {
      class: 'btn ghost sm',
      onclick: stop(() => {
        // 手上有任务（可以选做完再下线）、审卡 worker（可以选审完再下线），或是本角色最后一个 worker：先确认
        if (a.currentTask || last || critic) { dismissArm = a.id; renderHelper(); return; }
        dismissAgents({ ids: [a.id] });
      }),
    }, '下线');
  }
  const cancel = el('button', { class: 'btn ghost sm', onclick: stop(() => { dismissArm = null; renderHelper(); }) }, '取消');
  const suffix = last ? `（${a.role} 最后一个）` : '';
  if (critic) {
    return [
      cancel,
      el('button', {
        class: 'btn sm', title: '把待审的卡（包括审的过程中新来的）都审完，没有待审的卡了才下线',
        onclick: stop(() => { dismissArm = null; dismissAgents({ ids: [a.id], userApproved: true, afterTask: true }); }),
      }, '审完再下线'),
      el('button', {
        class: 'btn warn sm', title: '马上停下，没审的卡留着，下次开审卡 worker 再审',
        onclick: stop(() => { dismissArm = null; dismissAgents({ ids: [a.id], userApproved: true }); }),
      }, '立即下线'),
    ];
  }
  if (!a.currentTask) {
    return [cancel, el('button', {
      class: 'btn warn sm', title: lastTip,
      onclick: stop(() => { dismissArm = null; dismissAgents({ ids: [a.id], userApproved: true }); }),
    }, `确认下线${suffix}`)];
  }
  return [
    cancel,
    el('button', {
      class: 'btn sm', title: `做完 ${a.currentTask}（通过或作废）后下线，期间不领新任务。${lastTip}`,
      onclick: stop(() => { dismissArm = null; dismissAgents({ ids: [a.id], userApproved: true, afterTask: true }); }),
    }, `做完 ${a.currentTask} 再下线`),
    el('button', {
      class: 'btn warn sm', title: `马上停下，${a.currentTask} 若还在进行中就退回待领取。${lastTip}`,
      onclick: stop(() => { dismissArm = null; dismissAgents({ ids: [a.id], userApproved: true }); }),
    }, `立即下线${suffix}`),
  ];
}

// 手上的任务被作废、但 worker 还没收到通知（它正在干活，要等下一次调用 ateam 命令才知道）。
// 用户可以在 agent 窗口里点停止，把这句话发过去，让它马上停手。
function pendingCancel(a) {
  if (a.status !== 'online' || !a.cancelNotice?.wasWorking) return null;
  return data.state.tasks.find((t) => t.id === a.cancelNotice.taskId) || null;

function stopPrompt(a, t) {

}

function wakePrompt(a) {
  const doing = a.currentTask ? `继续做 ${a.currentTask}，做完提交后` : '';
  return `继续。你是 ateam worker ${a.id}（角色 ${a.role}）。${doing}运行 ateam wait --as ${a.id} 回到主循环，中途不要停下来汇报。如果提示租约已失效，就重新 ateam join --role ${a.role} --id ${a.id}${a.name ? ` --name ${a.name}` : ''}。`;

// 项目规则编辑器的状态。规则不在 /api/state 里，进入「项目规则」页时单独读取
let rules = { loaded: false, saved: '', draft: '', status: '', roles: [], previewRole: '' };

// 规则分段，和 src/rules.js 同一套规则（改动两边保持一致）：
// 第一个 `## ` 之前和 `## ALL` 段发给所有人，`## backend`、`## frontend, test` 只发给这些角色
function parseRules(text) {
  const out = [];
  let cur = { heading: null, roles: 'all', lines: [] };
  for (const line of String(text || '').split('\n')) {
    const m = line.match(/^## (.*)$/);
    if (!m) { cur.lines.push(line); continue; }
    out.push(cur);
    const heading = m[1].trim();
    cur = { heading, roles: heading.toLowerCase() === 'all' ? 'all' : heading.split(/[,，、\s]+/).map((r) => r.trim().toLowerCase()).filter(Boolean), lines: [] };
  }
  out.push(cur);
  return out.map((x) => ({ heading: x.heading, roles: x.roles, body: x.lines.join('\n') }));
}

// 同 src/rules.js 的 hasContent：只有空行和 # 标题行的段算空
function hasContent(body) {
  return String(body || '').split('\n').some((l) => l.trim() && !/^#{1,6}\s/.test(l.trim()));
}

function unreceivedRoles(text, known) {
  const set = new Set(known.map((r) => r.toLowerCase()));
  const out = [];
  for (const x of parseRules(text)) {
    if (x.roles === 'all') continue;
    for (const r of x.roles) if (!set.has(r) && !out.includes(r)) out.push(r);
  }
  return out;
}

async function loadRules() {
  try {
    const res = await fetch('/api/rules', { cache: 'no-store' });
    const json = await res.json();
    const saved = json.rules || '';
    // 上次没保存的草稿保留着（比如按 Esc 关了面板）
    const keepDraft = rules.loaded && rules.draft !== rules.saved;
    rules = { ...rules, loaded: true, saved, draft: keepDraft ? rules.draft : saved, status: keepDraft ? '有未保存的修改。' : '', roles: json.roles || [] };
  } catch {
    rules = { ...rules, loaded: true, status: '读取失败，请确认服务在运行（规则功能需要新版服务）。' };
  }
  renderHelper(true);
}

async function saveRules() {
  try {
    const res = await fetch('/api/rules', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text: rules.draft, userApproved: true }) });
    const json = await res.json();
    if (!json.ok) throw new Error(json.message);
    rules = { ...rules, loaded: true, saved: json.rules, draft: json.rules, status: '已保存。之后派发的任务按角色带上。' };
  } catch (err) {
    rules = { ...rules, status: `保存失败：${err.message}` };
  }
  renderHelper(true);
}

// 规则每段的条数（- 开头的行），ALL 和开头无标题段合并，顺序同文件
function ruleCounts(text) {
  const counts = new Map();
  for (const x of parseRules(text)) {
    const name = x.roles === 'all' ? 'ALL' : x.roles.join(', ');
    counts.set(name, (counts.get(name) || 0) + x.body.split('\n').filter((l) => /^- /.test(l.trim())).length);
  }
  return [...counts].filter(([, n]) => n > 0);
}

function rulesEditor() {
  if (!rules.loaded) return el('p', { class: 'hint' }, '读取中……');
  const mode = rules.mode === 'view' ? 'view' : 'edit';
  const dirty = rules.draft !== rules.saved;
  const setMode = (m) => (e) => { e.stopPropagation(); rules.mode = m; renderHelper(true); };
  const counts = el('div', { class: 'rules-counts' });
  const warn = el('p', { class: 'rules-warn' });
  function refreshMeta() {
    fill(counts, ruleCounts(rules.draft).map(([name, n]) => el('span', { class: 'rules-count' }, name, el('b', {}, String(n)))));
    const lost = unreceivedRoles(rules.draft, rules.roles);
    warn.textContent = lost.length ? `这些段目前没有角色会收到：${lost.join('、')}。全员段的小标题只认 ## ALL。` : '';
    warn.hidden = !lost.length;
  }
  refreshMeta();

  let body;
  if (mode === 'edit') {
    const area = el('textarea', {
      class: 'rules-editor', spellcheck: 'false',
      placeholder: '比如：\n- 不写新的测试代码\n\n## backend\n- 提交前先跑一遍编译\n\n## frontend, test\n- 页面文字不出现接口路径',
    });
    area.value = rules.draft;
    area.addEventListener('input', () => {
      rules.draft = area.value;
      const changed = rules.draft !== rules.saved;
      saveBtn.disabled = !changed;
      resetBtn.disabled = !changed;
      refreshMeta();
    });
    body = area;
  } else {
    // 按角色查看：这个角色领卡时收到哪些段（用当前内容，含没保存的修改）
    const roles = [...new Set([...rules.roles, ...parseRules(rules.draft).flatMap((x) => (x.roles === 'all' ? [] : x.roles))])].sort();
    if (!roles.includes(rules.previewRole)) rules.previewRole = roles[0] || '';
    const role = rules.previewRole;
    const list = parseRules(rules.draft);
    const split = list.some((x) => x.heading !== null);
    const secs = list.filter((x) => (!split || x.roles === 'all' || x.roles.includes(role)) && hasContent(x.body));
    const total = secs.reduce((n, x) => n + x.body.split('\n').filter((l) => /^- /.test(l.trim())).length, 0);
    const md = (text) => { const d = el('div', { class: 'md' }); d.innerHTML = renderMarkdown(text); return d; }; // renderMarkdown 先转义了 HTML
    body = [
      el('div', { class: 'role-pills' }, '角色',
        roles.map((r) => el('button', { class: `role-pill${r === role ? ' on' : ''}`, onclick: (e) => { e.stopPropagation(); rules.previewRole = r; renderHelper(true); } }, r)),
        roles.length ? el('span', { class: 'got' }, `领卡时收到 ${total} 条`) : null),
      secs.length
        ? el('div', { class: 'rules-view' }, secs.map((x) => el('section', { class: 'rules-sec' },
          el('div', { class: 'rules-sec-head' },
            el('span', { class: `rules-tag${x.roles === 'all' ? ' all' : ''}` }, x.heading ?? 'ALL'),
            x.heading === null ? (split ? '第一个小标题之前' : '还没分段，所有角色都收到') : x.roles === 'all' ? '所有角色' : null),
          md(x.body.trim()))))
        : el('div', { class: 'rules-empty' }, role ? `${role} 收不到任何规则` : '还没有项目规则'),
    ];
  }

  const saveBtn = el('button', { class: 'btn primary sm', disabled: !dirty, onclick: (e) => { e.stopPropagation(); saveRules(); } }, '保存');
  const resetBtn = el('button', { class: 'btn ghost sm', disabled: !dirty, onclick: (e) => { e.stopPropagation(); rules = { ...rules, draft: rules.saved, status: '' }; renderHelper(true); } }, '还原');
  const code = (t) => el('code', {}, t);
  return el('div', { class: 'rules-page' },
    el('p', { class: 'tab-hint' }, '每个任务都要遵守的约定，worker 领卡时自动附上。用 ', code('## backend'), '、', code('## frontend, test'),
      ' 分段，只发给这些角色；', code('## ALL'), ' 段和第一个小标题之前的内容发给所有人。一行一条，支持 markdown。'),
    el('div', { class: 'rules-bar' },
      el('div', { class: 'seg' },
        el('button', { class: mode === 'edit' ? 'on' : '', onclick: setMode('edit') }, '编辑'),
        el('button', { class: mode === 'view' ? 'on' : '', onclick: setMode('view') }, '按角色查看')),
      counts),
    warn,
    body,
    // 按角色查看是只读的：不放保存 / 还原；有没保存的修改时提示回到编辑里保存
    el('div', { class: 'rules-foot' },
      mode === 'edit' ? [saveBtn, resetBtn, rules.status ? el('span', { class: 'hint' }, rules.status) : null]
        : el('span', { class: 'hint' }, dirty ? '只读预览，含还没保存的修改；回到「编辑」里保存' : '只读预览，要改请切到「编辑」'),
      el('span', { class: 'path' }, '保存在 .ateam/rules.md · leader 用命令行改需要你同意')));
}

function renderHelper(force = false) {
  const panel = document.getElementById('helper');
  if (!helper.open || !data) { panel.hidden = true; panel.replaceChildren(); return; }
  // 正在编辑规则：轮询刷新不重画面板，免得输入框被替换、打字丢失
  if (!force && helper.tab === 'rules' && panel.querySelector('.rules-page')) return;
  if (!force && helper.tab === 'settings' && document.activeElement?.classList?.contains('setting-num') && panel.contains(document.activeElement)) return;
  if (helper.mode === 'offline') { renderOfflinePanel(panel); return; }
  const { agents, tasks } = data.state;
  const online = agents.filter((a) => a.status === 'online');
  const offline = agents.filter((a) => a.status !== 'online' && !a.hidden)
    .sort((x, y) => y.lastSeenAt - x.lastSeenAt);
  // 角色：标准四个角色 + 还没完成的任务用到的角色 + 所有（未移除的）worker 用过的角色
  const roles = new Map(STANDARD_ROLES.map((r) => [r.key, r.key]));
  for (const t of tasks) if (t.status !== 'approved' && t.status !== 'cancelled') roles.set(t.role.trim().toLowerCase(), t.role);
  for (const a of agents) if (!a.hidden) roles.set(a.role.trim().toLowerCase(), a.role);
  const ordered = online.slice().sort((x, y) => (y.id === helper.focus) - (x.id === helper.focus) || isStale(y) - isStale(x));
  const closeBtn = el('button', { class: 'btn ghost icon', title: '关闭', 'aria-label': '关闭', onclick: (e) => { e.stopPropagation(); helper = { open: false, focus: null }; dismissAllArm = false; renderHelper(); } }, icon('close'));
  const dismissAll = online.length ? [
    dismissAllArm ? el('button', { class: 'btn ghost sm', onclick: (e) => { e.stopPropagation(); dismissAllArm = false; renderHelper(); } }, '取消') : null,
