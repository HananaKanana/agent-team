      class: dismissAllArm ? 'btn warn sm' : 'btn sm',
      title: '所有 worker 立即下线；进行中的任务退回待领取',
      onclick: (e) => {
        e.stopPropagation();
        if (!dismissAllArm) { dismissAllArm = true; renderHelper(); return; }
        dismissAllArm = false;
        dismissAgents({ all: true, userApproved: true });
      },
    }, dismissAllArm ? '确认全部下线' : '全部下线'),
  ] : null;
  const tab = ['lead', 'install', 'rules', 'settings'].includes(helper.tab) ? helper.tab : 'worker';
  const tabBtn = (key, label) => el('button', {
    type: 'button', role: 'tab', class: `tab${tab === key ? ' on' : ''}`, 'aria-selected': tab === key ? 'true' : 'false',
    onclick: (e) => {
      e.stopPropagation();
      helper = { ...helper, tab: key };
      dismissAllArm = false;
      if (key === 'rules') loadRules();
      settingsMsg = '';
      renderHelper(true);
    },
  }, label);
  const scroll = panel.hidden ? 0 : panel.scrollTop;
  fill(panel,
    el('div', { class: 'panel-top' },
      el('div', { class: 'helper-head' }, el('b', null, '使用说明'), closeBtn),
      el('div', { class: 'tabs', role: 'tablist' }, tabBtn('worker', 'worker'), tabBtn('lead', 'leader'), tabBtn('install', '安装'), tabBtn('rules', '项目规则'), tabBtn('settings', '设置'))),
    el('div', { class: 'panel-body' },
    tab === 'rules' || tab === 'settings' ? null : el('p', { class: 'tab-hint' }, data.root ? `项目目录：${data.root}。每段话发到对应的 agent 窗口里。` : '每段话发到对应的 agent 窗口里。'),
    tab === 'settings' ? settingsPage() : tab === 'rules' ? rulesEditor() : tab === 'install' ? installGuide() : tab === 'worker' ? [
    el('div', { class: 'helper-sec' }, el('h4', null, '① 开 worker')),
    el('p', { class: 'hint' }, '打开新的 agent 窗口（可以换账号），工作目录选项目目录，发对应角色的那句话。想起名字就在第一行末尾加「，名字 账号B」。'),
    [...roles.values()].map((role) => {
      const key = role.trim().toLowerCase();
      const std = STANDARD_ROLES.find((r) => r.key === key);
      const waiting = tasks.filter((t) => t.status === 'pending' && t.role.trim().toLowerCase() === key).length;
      const working = online.filter((a) => a.role.trim().toLowerCase() === key).length;
      return el('div', { class: 'wcard' },
        el('div', { class: 'wcard-head' },
          el('span', { class: 'tag role', style: roleStyle(role) }, role),
          std ? el('b', null, std.label) : null,
          el('span', { class: 'hint grow' }, std ? std.what : ''),
          el('span', { class: 'hint' }, `在线 ${working}，待领取 ${waiting}`)),
        promptBlock(workerPrompt(role), renderHelper));
    }),
    el('div', { class: 'helper-sec' }, el('h4', null, `② 干活中：在线的 worker（${online.length}）`), dismissAll),
    el('p', { class: 'hint' }, dismissAllArm
      ? '确认后所有 worker 立即下线；进行中的任务退回待领取，已有改动保留。'
      : 'worker 停下来不动时，复制它的叫醒话，发到它自己的 agent 窗口。'),
    ordered.length ? ordered.map((a) => el('div', { class: `wcard${a.id === helper.focus ? ' focus' : ''}` },
      el('div', { class: 'wcard-head' },
        avatar(a.id, a.role),
        el('span', { class: 'grow' },
          el('span', { class: 'who-line' },
            el('b', null, agentLabel(a.id)),
            el('span', { class: 'hint' }, `${a.role.trim().toLowerCase() === 'critic' ? criticProgress(a) : (a.currentTask ? `在做 ${a.currentTask}` : '空闲')} · 心跳 ${ago(a.lastSeenAt)}`)),
          el('span', { class: 'tag role', style: roleStyle(a.role) }, a.role),
          isStale(a) ? el('span', { class: 'pill' }, '可能停了') : null,
          a.leaveAsked ? el('span', { class: 'pill', title: '空闲太久，向 leader 申请下线' }, '申请下线') : null,
          a.dismiss ? el('span', { class: 'pill', title: a.role.trim().toLowerCase() === 'critic' ? '审完待审的卡后下线' : '做完手上的任务后下线，不再领新任务' }, a.role.trim().toLowerCase() === 'critic' ? '审完下线' : '做完下线') : null,
          pendingCancel(a) ? el('span', { class: 'pill', title: '它还在做一个已作废的任务' }, `${pendingCancel(a).id} 已作废，它还不知道`) : null),
        dismissButtons(a)),
      pendingCancel(a) ? [
        el('p', { class: 'hint' }, `${pendingCancel(a).id} 已被作废，但它正在干活，要等下一次调用 ateam 命令才会知道。想让它马上停：在它的 agent 窗口里点停止，把下面这句话发过去。`),
        promptBlock(stopPrompt(a, pendingCancel(a)), renderHelper),
      ] : promptBlock(wakePrompt(a), renderHelper))) : el('p', { class: 'hint' }, '没有在线的 worker。'),
    offline.length ? [
      el('div', { class: 'helper-sec' }, el('h4', null, `③ 掉线了：重连（${offline.length}）`)),
      el('p', { class: 'hint' }, '窗口还在、只是掉线了：把重连话发到它自己的 agent 窗口，它会用原编号重新加入、接着干活，窗口标题不用改。'),
      offline.map((a) => el('div', { class: 'wcard' },
        el('div', { class: 'wcard-head' },
          avatar(a.id, a.role),
          el('span', { class: 'grow' },
            el('span', { class: 'who-line' }, el('b', null, agentLabel(a.id)), el('span', { class: 'hint' }, `最后心跳 ${ago(a.lastSeenAt)}`)),
            el('span', { class: 'tag role', style: roleStyle(a.role) }, a.role))),
        promptBlock(reconnectPrompt(a), renderHelper))),
    ] : null,
    el('div', { class: 'helper-sec' }, el('h4', null, '④ 收工')),
    el('p', { class: 'hint' }, '需求都做完了：在 ② 里点「全部下线」，worker 会立即停下。leader 那边对它说「让大家收工」也一样。'),
    ] : [
    el('p', { class: 'hint' }, '在项目目录里开一个 Claude Code 会话，发下面这句话。leader 只需要一个。'),
    el('div', { class: 'wcard' },
      el('div', { class: 'wcard-head' }, el('b', null, '加入'), el('span', { class: 'hint' }, '新开会话、或者上下文满了重开会话，都用这一句')),
      promptBlock(leadPrompt(), renderHelper)),
    el('p', { class: 'hint' }, '加入后直接在对话里跟 leader 说需求，比如「需求是……」。它会拆任务、派给 worker，并告诉你需要开几个什么角色的 worker。'),
    ]),
  );
  panel.hidden = false;
  panel.scrollTop = scroll;
}

// 已验收的需求收进左侧底部一个可展开的分组，默认收起
let acceptedOpen = false;
try { acceptedOpen = localStorage.getItem('ateam.acceptedOpen') === '1'; } catch {}
// 已作废的需求：单独一组，默认收起
let cancelledJobsOpen = false;
try { cancelledJobsOpen = localStorage.getItem('ateam.cancelledJobsOpen') === '1'; } catch {}

function renderJobs() {
  const nav = document.getElementById('jobs');
  const { jobs, tasks } = data.state;
  const jobItem = (j) => {
    const jt = tasks.filter((t) => t.jobId === j.id && t.status !== 'cancelled');
    const done = jt.filter((t) => t.status === 'approved').length;
    if (j.demo) {
      const live = jt.find((t) => t.status === 'queued' || t.status === 'demoing');
      return el('button', {
        class: `job${j.status === 'cancelled' ? ' dropped' : ''}`, 'aria-current': view.job === j.id ? 'true' : 'false',
        onclick: () => { view.job = j.id; view.task = null; view.report = false; saveView(); render(); },
      },
      el('div', { class: 'title' }, el('span', { class: 'jid' }, j.id), j.title),
      el('div', { class: 'sub' }, el('span', { class: 'tag' }, '演播'), el('span', null, live ? (live.status === 'demoing' ? `${modeWord(live)}中` : DEMO_STATUS[live.status][0]) : `${jt.length} 张演播卡`)));
    }
    return el('button', {
      class: `job${j.status === 'cancelled' ? ' dropped' : ''}`, 'aria-current': view.job === j.id ? 'true' : 'false',
      onclick: () => { view.job = j.id; view.task = null; view.report = false; saveView(); render(); },
    },
    el('div', { class: 'title' }, el('span', { class: 'jid' }, j.id), j.title),
    el('div', { class: 'sub' }, j.status === 'accepted' ? el('span', { class: 'accepted' }, '✓ 已验收') : el('span', null, JOB_STATUS[j.status] || j.status), el('span', null, `${done}/${jt.length} 已通过`)),
    jt.length ? strip(jt, false) : null);
  };
  const newest = jobs.slice().reverse();
  const open = newest.filter((j) => j.status !== 'accepted' && j.status !== 'cancelled');
  const done = newest.filter((j) => j.status === 'accepted');
  const dropped = newest.filter((j) => j.status === 'cancelled');
  const droppedGroup = dropped.length ? [
    el('button', {
      class: 'accepted-toggle', 'aria-expanded': cancelledJobsOpen ? 'true' : 'false',
      onclick: () => {
        cancelledJobsOpen = !cancelledJobsOpen;
        try { localStorage.setItem('ateam.cancelledJobsOpen', cancelledJobsOpen ? '1' : '0'); } catch {}
        renderJobs();
      },
    }, el('span', null, cancelledJobsOpen ? '▾' : '▸'), `已作废（${dropped.length}）`),
    cancelledJobsOpen ? dropped.map(jobItem) : null,
  ] : [];
  const doneGroup = done.length ? [
    el('button', {
      class: 'accepted-toggle', 'aria-expanded': acceptedOpen ? 'true' : 'false',
      onclick: () => {
        acceptedOpen = !acceptedOpen;
        try { localStorage.setItem('ateam.acceptedOpen', acceptedOpen ? '1' : '0'); } catch {}
        renderJobs();
      },
    }, el('span', null, acceptedOpen ? '▾' : '▸'), `已验收（${done.length}）`),
    acceptedOpen ? done.map(jobItem) : null,
  ] : [];
  const empty = jobs.length ? (open.length ? [] : [emptyState('done', '需求都验收完了', '有新需求时直接跟 leader 说。')])
    : [emptyState('inbox', '还没有需求', '对 leader 说出你的需求，它会在这里建立任务。')];
  fill(nav, el('h2', null, '需求'), open.map(jobItem), empty, doneGroup, droppedGroup);
}

function renderMain() {
  const main = document.getElementById('main');
  const job = data.state.jobs.find((j) => j.id === view.job);
  // 已作废的需求：代码还在、但需求不算了。卡片状态照实保留，整页置灰、卡片标题划掉
  main.classList.toggle('job-dropped', job?.status === 'cancelled');
  if (!job) {
    main.removeAttribute('aria-busy');
    fill(main, data.state.jobs.length
      ? emptyState('pointer', '选一个需求', '在左侧选择一个需求，查看它的任务看板。')
      : emptyState('inbox', '等 leader 建第一个需求',
        data.leader?.online ? 'leader 已经在线，直接在它的对话里说需求就行，比如「需求是……」。' : '先开一个 leader：在项目目录里开 Claude Code 会话，发 leader 的加入提示词，然后跟它说需求。',
        data.leader?.online ? null : openGuide('lead')));
    return;
  }
  const all = data.state.tasks.filter((t) => t.jobId === job.id);
  const tasks = all.filter((t) => t.status !== 'cancelled');
  const cancelled = all.filter((t) => t.status === 'cancelled');
  // 说明较长时默认收起几行，可以展开
  const longDesc = (job.description || '').length > 160 || (job.description || '').split('\n').length > 3;
  const descOpen = descOpenJob === job.id;
  const headMain = [
    el('div', { class: 'crumbs' }, `需求 / ${job.id}`,
      job.demo ? null : el('span', { class: `lozenge c-${JOB_LOZENGE[job.status] || 'pending'}` }, JOB_STATUS[job.status] || job.status)),
    el('h2', { class: `job-title${job.status === 'cancelled' ? ' dropped' : ''}` }, job.title),
    job.demo ? el('div', { class: 'head-acts' }, el('span', { class: 'lozenge c-held' }, '演播需求')) : null,
    job.onHold && job.status !== 'cancelled' ? el('div', { class: 'job-cancelled job-hold' },
      `${fmtTime(job.onHold.at)} ${job.onHold.by === 'user' ? '你' : 'leader'}暂停了领取${job.onHold.reason ? `：${job.onHold.reason}` : ''}。待领取的卡都不会派发，正在做的照常做完。`,
      el('button', { class: 'link-btn', onclick: (e) => { e.stopPropagation(); holdAction('jobs', job.id, false); } }, '恢复领取')) : null,
    job.status === 'cancelled' ? el('div', { class: 'job-cancelled' },
      `${job.cancelledAt ? fmtTime(job.cancelledAt) + ' ' : ''}作废${job.cancelReason ? `：${job.cancelReason}` : ''}。已通过的卡和代码保留，没做完的卡已作废。`) : null,
    job.description ? (() => {
      const box = el('div', { class: `desc md${longDesc && !descOpen ? ' clamped' : ''}` });
      box.innerHTML = renderMarkdown(job.description); // renderMarkdown 先转义了 HTML
      return box;
    })() : null,
    longDesc ? el('button', { class: 'more', onclick: () => { descOpenJob = descOpen ? null : job.id; renderMain(); } }, descOpen ? '收起说明' : '展开全部说明') : null,
    job.origin ? el('details', { class: 'origin-box' },
      el('summary', null, '你提需求时的原话'),
      (() => { const d = el('div', { class: 'md' }); d.innerHTML = renderMarkdown(job.origin); return d; })()) : null];
  const head = job.demo
    ? el('div', { class: 'job-head' }, headMain)
    : el('div', { class: 'job-head has-side' }, el('div', { class: 'job-main' }, headMain), jobSide(job, tasks, longDesc && !descOpen));
  if (job.demo) {
    main.removeAttribute('aria-busy');
    // 一张卡时右边放它的步骤大纲；多张时放正在运行的那张（没有就第一张）
    const focus = tasks.find((t) => ['queued', 'demoing', 'wrapping'].includes(t.status)) || tasks[0];
    const outlineScroll = main.querySelector('.outline ol')?.scrollTop;
    fill(main, head, tasks.length
      ? el('div', { class: 'demo-layout' },
        el('div', { class: 'demo-left' }, el('div', { class: 'demo-list' }, tasks.map(demoRow)), stagePanels(focus)),
        stepOutline(focus))
      : emptyState('split', '还没有演播卡', '跟 leader 说要演播什么，它会和你定好步骤、写好脚本，再建演播卡。'),
    cancelledSection(cancelled));
    // 重画后保持大纲的滚动位置；当前步换了就把它滚到可见处
    const ol = main.querySelector('.outline ol');
    if (ol) {
      if (outlineScroll != null) ol.scrollTop = outlineScroll;
      const now = ol.querySelector('li.now');
      if (now && now.dataset.n !== lastOutlineStep) { ol.scrollTop = now.offsetTop - ol.clientHeight / 2 + now.offsetHeight / 2; lastOutlineStep = now.dataset.n; }
    }
    return;
  }
  // 统计数字挪到了头部右侧的概览里，这里只留进度条
  const stats = el('div', { class: 'progress' }, tasks.length ? strip(tasks, true) : null);

  let report = null;
  if (job.status === 'awaiting_acceptance' && job.report) {
    report = el('div', { class: 'report-bar' },
      el('span', { class: 'what' }, 'leader 已提交汇报，等你验收'),
      el('span', { class: 'when' }, `${fmtTime(job.updatedAt)} 提交`),
      el('button', { class: 'btn primary', onclick: (e) => { e.stopPropagation(); openReport(); } }, '查看汇报'),
      acceptButtons(job),
      el('span', { class: 'hint' }, ACCEPT_HINT));
  } else if (job.status === 'accepted' && job.report) {
    report = el('div', { class: 'report-bar' },
      el('span', { class: 'what' }, '已验收通过'),
      el('span', { class: 'when' }, job.acceptedAt ? `${fmtTime(job.acceptedAt)} 验收` : ''),
      el('button', { class: 'btn', onclick: (e) => { e.stopPropagation(); openReport(); } }, '查看汇报'));
  }

  const board = el('div', { class: 'board' }, LANES.map((lane) => {
    const cards = tasks.filter((t) => laneOf(t) === lane.key);
    // 待领取一列按派发顺序排：优先的在最上面（与服务端 dispatchOrder 一致）
    if (lane.key === 'pending') cards.sort((a, b) => ((b.priority ?? 0) - (a.priority ?? 0)) || (b.handoff - a.handoff) || (Number(a.id.slice(1)) - Number(b.id.slice(1))));
    // 已通过一列：越新通过的越靠上
    if (lane.key === 'approved') cards.sort((a, b) => (approvedAt(b) - approvedAt(a)) || (Number(b.id.slice(1)) - Number(a.id.slice(1))));
    return el('section', { class: `lane c-${lane.key}${cards.length ? ' has' : ''}${lane.key === 'pending' && job.onHold ? ' held' : ''}`, 'aria-label': lane.label, 'data-lane': lane.key },
      el('h3', null, el('span', { class: 'label' }, lane.label),
        lane.key === 'pending' && job.onHold ? el('span', { class: 'lane-held' }, '已暂停') : null,
        el('span', { class: 'n' }, cards.length)),
      el('div', { class: 'cards' }, cards.length ? cards.map((t) => card(t, lane.key)) : el('div', { class: 'empty-hint' }, '暂无')));
  }));

  const cancelledBox = cancelledSection(cancelled);

  const scrolls = Object.fromEntries([...main.querySelectorAll('.lane[data-lane] .cards')].map((c) => [c.parentNode.dataset.lane, c.scrollTop]));
  main.removeAttribute('aria-busy');
  fill(main, head, tasks.length ? stats : null, report, tasks.length ? board : emptyState('split', 'leader 正在拆任务', '拆好后任务会出现在这里。需要哪些角色的 worker，leader 会在对话里告诉你。'), cancelledBox);
  fitActs();
  for (const c of main.querySelectorAll('.lane[data-lane] .cards')) c.scrollTop = scrolls[c.parentNode.dataset.lane] || 0;
}

// 需求头部右侧：概览（统计、耗时、角色进度、参与者）+ 最近动态（各任务时间线合在一起，新的在上）
const ACTIVITY_TYPES = new Set(['claimed', 'asked', 'answered', 'submitted', 'approved', 'rejected', 'handoff', 'cancelled', 'critique']);
function jobSide(job, tasks, collapsed) {
  const st = reviewStats(tasks);
  const endAt = job.acceptedAt || job.cancelledAt;
  const end = endAt ? new Date(endAt) : Date.now();
  const took = dur(end - new Date(job.createdAt));
  const roles = new Map();
  for (const t of tasks) {
    const r = roles.get(t.role) || { done: 0, all: 0 };
    r.all++; if (t.status === 'approved') r.done++;
    roles.set(t.role, r);
  }
  const workers = [...new Set(tasks.flatMap((t) => t.history.filter((h) => h.type === 'claimed').map((h) => h.actor)))];
  const acts = tasks.flatMap((t) => t.history.filter((h) => ACTIVITY_TYPES.has(h.type)).map((h) => ({ ...h, task: t })));
  if (job.acceptedAt) acts.push({ ts: job.acceptedAt, type: 'job_accepted' });
  acts.sort((a, b) => new Date(b.ts) - new Date(a.ts));
  // 说明收起时不放动态（卡片只留概览，和收起的说明一样矮）；展开后先多渲染一些，fitActs 按卡片剩下的高度留条数
  const shown = collapsed ? [] : acts.slice(0, 30);
  const open = (id) => { view.task = id; saveView(); renderDrawer(true); };
  const kpi = (value, label, cls = '', title) => el('div', { class: `kpi ${cls}`, title }, el('b', null, value), el('span', null, label));
  // 整个需求暂停 / 恢复领取：概览卡右上角，平时鼠标移入卡片才出现，暂停中一直显示
  const holdBtn = job.demo || job.status === 'accepted' || job.status === 'cancelled' ? null : el('button', {
    class: `side-hold${job.onHold ? ' on' : ''}`,
    title: job.onHold ? '这个需求待领取的卡暂停派发中。点一下恢复' : '这个需求待领取的卡（包括之后新加的）先不派发，正在做的不受影响',
    onclick: (e) => { e.stopPropagation(); holdAction('jobs', job.id, !job.onHold); },
  }, icon(job.onHold ? 'play' : 'pause'), job.onHold ? '已暂停 · 恢复' : '暂停领取');
  return el('aside', { class: `job-side${shown.length ? '' : ' bare'}`, 'aria-label': '概览和最近动态' },
    el('div', { class: 'inner' }, holdBtn,
      el('div', { class: 'kpis' },
        kpi([`${st.approved}`, el('small', null, `/${tasks.length}`)], '已通过'),
        kpi(`${st.reviews}`, 'review'),
        kpi(st.rate, '一次通过'),
        kpi(`${st.rejects}`, '打回', st.rejects ? 'warn' : ''),
        kpi(took, endAt ? '耗时' : '已用时', 'dur', job.acceptedAt ? '从建需求到验收' : job.cancelledAt ? '从建需求到作废' : '从建需求到现在')),
      roles.size ? el('div', { class: 'roles' },
        [...roles].map(([role, r]) => el('div', { class: `role${r.done === r.all ? ' full' : ''}`, title: `${role}：${r.done}/${r.all} 已通过` },
          el('div', { class: 'rl' }, el('span', null, role), el('b', null, `${r.done}/${r.all}`)),
          el('i', null, el('i', { style: `width:${Math.round((r.done / r.all) * 100)}%` }))))) : null,
      // 没有动态就不占地方（刚建的需求、还没人领）
      shown.length ? el('div', { class: 'activity' },
        el('div', { class: 'side-h' }, el('span', null, '最近动态'),
          el('span', { class: 'sub', title: workers.map(agentName).join('\n') }, `${workers.length} 个 worker 参与 · 共 ${acts.length} 条`)),
        el('ol', { class: 'acts' }, shown.map((a) => {
          if (a.type === 'job_accepted') return el('li', { class: 'c-approved' }, el('i'), el('span', { class: 'when' }, fmtTime(a.ts)), el('span', { class: 'what' }, '需求验收通过'));
          const [label, color] = HISTORY[a.type] || [a.type, 'pending'];
          return el('li', { class: `c-${color} link`, title: `${a.task.id} ${a.task.title}${a.text ? `\n${a.text}` : ''}`, tabindex: '0', role: 'button',
            onclick: () => open(a.task.id), onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(a.task.id); } } },
          el('i'), el('span', { class: 'when' }, fmtTime(a.ts)),
          el('span', { class: 'what' }, el('span', { class: 'key' }, a.task.id), label, el('span', { class: 'who' }, agentName(a.actor))));
        }))) : null));
}

// 最近动态的条数跟着卡片高度走（卡片高度 = 左栏高度）：放满为止，只显示完整的行；
// 放不下 3 条就把卡片撑高到刚好 3 条。窄屏卡片自己撑高，固定最多 5 条
const MIN_ACTS = 3;
function fitActs() {
  const side = document.querySelector('#main .job-side');
  const ol = side?.querySelector('.acts');
  if (!ol) return;
  const items = [...ol.children];
  for (const li of items) li.hidden = false;
  side.style.minHeight = '';
  const narrow = getComputedStyle(side.querySelector('.inner')).position === 'static';
  if (narrow) { items.forEach((li, i) => { li.hidden = i >= 5; }); return; }
  const fits = () => { const max = ol.getBoundingClientRect().bottom; return items.filter((li) => li.getBoundingClientRect().bottom <= max + 0.5).length; };
  let n = fits();
  const want = Math.min(MIN_ACTS, items.length);
  if (n < want) {
    side.style.minHeight = `${side.getBoundingClientRect().height + (want - n) * items[0].getBoundingClientRect().height + 2}px`;
    n = Math.max(fits(), want);
  }
  items.forEach((li, i) => { li.hidden = i >= n; });
}
addEventListener('resize', () => fitActs());

// 已作废：默认收起，展开后一行一张，点开看详情

function approvedAt(t) {

}

function card(t, lane) {

      top ? el('span', { class: 'tag urgent' }, '优先') : null,

// ---------- 演播卡 ----------
const isDemoTask = (t) => t.kind === 'demo';
// 造成「派发暂停」的演播卡：等 worker 领的，或正在演播、没被叫停的（与服务端 demoFrozen 一致）
const frozenDemo = () => data.state.tasks.find((t) => isDemoTask(t) && (t.status === 'queued' || (t.status === 'demoing' && !t.stopRequested)));
let demoError = null; // { id, message }

async function demoAction(kind, t, mode, steps) {
  try {
    const res = await fetch(`/api/demo/${kind}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: t.id, mode, ...(steps ? { steps } : {}) }) });
    const out = await res.json();
    demoError = out.ok ? null : { id: t.id, message: out.message };
  } catch { demoError = { id: t.id, message: '连不上 ateam 服务。' }; }
  await poll();
  render();
  return !demoError;
}

// 一场演播选中的步骤（没有 = 完整演播），和服务端 stepsLabel 同一种写法
const runSteps = (t) => t.runs?.[t.runs.length - 1]?.steps || null;
function stepsLabel(steps) {
  if (!steps?.length) return '';
  const contiguous = steps.every((n, i) => i === 0 || n === steps[i - 1] + 1);
  return contiguous && steps.length > 1 ? `第 ${steps[0]}–${steps[steps.length - 1]} 步` : `第 ${steps.join('、')} 步`;
}
// 部分演播时当前步在本场里是第几步：「本场 2/10」
function sceneOf(t) {
  const steps = runSteps(t);
  const n = t.demoStep?.n;
  if (!steps || !n) return '';
  return `本场 ${steps.indexOf(n) + 1}/${steps.length}`;
}

// 「开始演播」弹窗：从头完整演播 / 从第 N 步开始 / 只演选中的几步。预演不弹（预演总是完整走）
let showDlg = null; // { id, pick: 'all' | 'from' | 'some', from, some: Set, error, resume }
function openShowDialog(t) {
  const last = t.runs?.[t.runs.length - 1];
  const resume = last && (last.outcome === 'interrupted' || last.outcome === 'stopped') && last.lastStep ? last.lastStep : null;
  showDlg = { id: t.id, pick: resume ? 'from' : 'all', from: resume || 1, some: new Set(), error: null, resume };
  renderShowDialog();
}
function closeShowDialog() { showDlg = null; renderShowDialog(); }
function renderShowDialog() {
  const box = document.getElementById('show-dialog');
  const t = showDlg && data?.state.tasks.find((x) => x.id === showDlg.id);
  if (!t || t.status !== 'ready') { showDlg = null; box.hidden = true; box.replaceChildren(); return; }
  const sc = loadScript(t);
  const steps = sc?.steps || [];
  const total = steps.length;
  const d = showDlg;
  const stop = (fn) => (e) => { e.stopPropagation(); fn(e); };
  const set = (patch) => { Object.assign(d, patch, { error: null }); renderShowDialog(); };
  const choice = (key, title, desc) => el('button', { class: `choice${d.pick === key ? ' on' : ''}`, onclick: stop(() => set({ pick: key })) },
    el('span', { class: 'radio' }), el('span', null, el('b', null, title), el('span', { class: 'd' }, desc)));
  const picked = d.pick === 'all' ? null
    : d.pick === 'from' ? steps.filter((st) => st.n >= d.from).map((st) => st.n)
    : [...d.some].sort((a, b) => a - b);
  const label = d.pick === 'all' ? '开始演播'
    : d.pick === 'from' ? `从第 ${d.from} 步开始演播（${d.from}–${total}）`
    : `演播选中的 ${picked.length} 步`;
  const blockers = data.demoBlockers?.[t.id] ?? [];
  const go = async () => {
    const ok = await demoAction('start', t, 'show', picked && picked.length < total ? picked : null);
    if (ok) closeShowDialog();
    else if (showDlg) { showDlg.error = demoError?.message || '开始失败'; renderShowDialog(); }
  };
  let detail = null;
  if (!sc) detail = el('p', { class: 'hint' }, '正在读取脚本步骤…');
  else if (d.pick === 'from') {
    detail = el('select', { class: 'step-select', onchange: (e) => set({ from: Number(e.target.value) }) },
      steps.map((st) => el('option', { value: st.n, selected: st.n === d.from }, `${st.n}. ${st.text}`)));
  } else if (d.pick === 'some') {
    detail = el('div', { class: 'step-pick' },
      el('div', { class: 'pick-tools' },
        el('button', { class: 'btn ghost sm', onclick: stop(() => set({ some: new Set(steps.map((st) => st.n)) })) }, '全选'),
        el('button', { class: 'btn ghost sm', onclick: stop(() => set({ some: new Set() })) }, '全不选'),
        el('span', { class: 'hint' }, `已选 ${d.some.size} / ${total} 步`)),
      el('div', { class: 'pick-list' }, steps.map((st) => el('label', { class: d.some.has(st.n) ? 'on' : '' },
        el('input', { type: 'checkbox', checked: d.some.has(st.n), onchange: (e) => { const some = new Set(d.some); e.target.checked ? some.add(st.n) : some.delete(st.n); set({ some }); } }),
        el('span', { class: 'no' }, st.n), el('span', null, st.text)))));
  }
  // 重画会换掉整个弹窗：先记下步骤列表和正文的滚动位置，画完放回去，勾选时不跳回顶部
  const keep = ['.pick-list', '.modal-body'].map((sel) => [sel, box.querySelector(sel)?.scrollTop ?? 0]);
  box.classList.toggle('again', !box.hidden); // 已经开着时重绘不再播弹出动画
  box.onclick = (e) => { if (e.target === box) closeShowDialog(); };
  fill(box, el('div', { class: 'modal show-modal', onclick: (e) => e.stopPropagation() },
    modalHead(`开始演播：${t.title}`, closeShowDialog),
    el('div', { class: 'modal-body' },
      t.mayChange ? el('p', { class: 'lead warn-line' }, '页面可能有变动，建议先重新预演。') : null,
      el('div', { class: 'choices' },
        choice('all', '从头完整演播', `从第 1 步演到第 ${total || '…'} 步。`),
        choice('from', d.resume ? `从第 ${d.resume} 步继续` : '从第 N 步开始', d.resume ? '上一场停在这里，从这一步演到最后。' : '从选中的那一步演到最后一步。'),
        choice('some', '只演选中的几步', '只演勾选的步骤，其余跳过。')),
      detail,
      d.pick !== 'all' ? el('p', { class: 'hint' }, '跳过的步骤不会补跑，它们留下的数据和页面要已经在（比如上一场留下的）。没跑到最后一步的话，演完不清理数据。') : null,
      d.error ? el('p', { class: 'hint', style: 'color: var(--rework)' }, d.error) : null),
    el('div', { class: 'modal-foot' },
      blockers.length ? el('span', { class: 'hint' }, `现在不能开始：${blockers.join('；')}`) : null,
      el('button', { class: 'btn', onclick: stop(closeShowDialog) }, '取消'),
      el('button', { class: 'btn primary', disabled: !sc || blockers.length > 0 || (picked && !picked.length), onclick: stop(go) }, label))));
  box.hidden = false;
  for (const [sel, top] of keep) { const n = box.querySelector(sel); if (n) n.scrollTop = top; }
}

const runMode = (t) => t.runs?.[t.runs.length - 1]?.mode ?? 'show';
const modeWord = (t) => (t.status === 'queued' ? t.pendingMode : runMode(t)) === 'rehearsal' ? '预演' : '演播';
// 预演状态：未预演 / 已预演 / 页面可能有变动
function rehearsalTag(t) {
  if (!t.rehearsedAt) return el('span', { class: 'lozenge c-pending', title: '还没完整预演过，只能先预演' }, '未预演');
  if (t.mayChange) return el('span', { class: 'lozenge c-asking', title: `${fmtTime(t.rehearsedAt)} 预演后有新代码通过了 review，建议先重新预演` }, '页面可能有变动');
  return el('span', { class: 'lozenge c-approved', title: `${fmtTime(t.rehearsedAt)} 预演` }, '已预演');
}
function demoButton(t) {
  const stop = (e) => e.stopPropagation();
  if (t.status === 'ready') {
    const blockers = data.demoBlockers?.[t.id] ?? [];
    const why = blockers.join('；');
    const start = (mode, label, primary, tip) => el('button', {
      class: `btn${primary ? ' primary' : ''}`, disabled: blockers.length > 0, title: why || tip,
      onclick: (e) => { stop(e); if (mode === 'show') openShowDialog(t); else demoAction('start', t, mode); },
    }, label);
    if (!t.rehearsedAt) return start('rehearsal', '开始预演', true, '慢慢走一遍，写出逐步的操作记录；开始后派发暂停');
    return [
      start('show', '开始演播', true, t.mayChange ? '页面可能有变动，建议先重新预演' : '按操作记录快速执行；开始后派发暂停'),
      start('rehearsal', '重新预演', false, '重新走一遍，核实并改正操作记录'),
    ];
  }
  if (t.status === 'demoing' && !t.stopRequested) {
    return [pauseButton(t, 'btn'), el('button', { class: 'btn warn', onclick: (e) => { stop(e); demoAction('stop', t); } }, `停止${modeWord(t)}`)];
  }
  if (t.status === 'queued') {
    return el('button', { class: 'btn warn', onclick: (e) => { stop(e); demoAction('stop', t); } }, `停止${modeWord(t)}`);
  }
  // 收尾中（或老数据里叫停了还停在演播中）：worker 迟迟不收尾时，用户可以直接结束
  if (t.status === 'wrapping' || (t.status === 'demoing' && t.stopRequested)) {
    return el('button', { class: 'btn', title: `不等 ${agentName(t.assignee)} 收尾了，卡直接回到待演播（这次还没提交的操作记录不保存）`, onclick: (e) => { stop(e); demoAction('release', t); } }, '结束收尾');
  }
  return null;
}

// 当前进行到哪一步 + 已演播多久（演播中）；等 worker 领（等待开始）；收尾中
function demoProgress(t) {
  if (t.status === 'queued') return el('span', null, `等 ${t.role} worker 领取…`);
  if (t.status === 'wrapping') return el('span', null, `${agentName(t.assignee)} 在收尾：清理数据、写操作记录`);
  if (t.status !== 'demoing') return null;
  const run = t.runs?.[t.runs.length - 1];

}

// 暂停 / 继续：worker 做完当前这一步后停住，点继续接着做下一步
function pauseButton(t, cls) {
  const paused = !!t.paused;
  return el('button', {
    class: `${cls} pause-btn`, title: paused ? '让 worker 接着做下一步' : '当前这一步做完后停住，浏览器停在当前页面，方便讲解、回答提问',
    onclick: (e) => { e.stopPropagation(); demoAction(paused ? 'resume' : 'pause', t); },
  }, icon(paused ? 'play' : 'pause'), paused ? '继续' : '暂停');
}

        el('td', { class: 'note' }, r.steps?.length ? el('span', { class: 'only' }, r.steps.length > 1 && r.steps.every((n, i) => i === 0 || n === r.steps[i - 1] + 1) ? stepsLabel(r.steps) : `选 ${r.steps.length} 步：${r.steps.join('、')}`) : null, r.result || '—', r.slowSteps?.length ? el('div', { class: 'hint' }, `慢档：第 ${r.slowSteps.join('、')} 步`) : null))))) : el('div', { class: 'empty' }, '还没运行过'));
  return [top, history];
}
// 缓存键：提交、运行次数，以及当前步（预演中 worker 边走边写操作记录，每走一步重读一次脚本）
const opsKey = (t) => `${t.commits.length}:${(t.runs || []).length}:${t.status}:${t.demoStep?.ts ?? ''}`;
// 读脚本（操作记录 + 步骤列表），读完重画；返回缓存，还没读到时返回 null
function loadScript(t) {
  const key = opsKey(t);
  const hit = opsCache.get(t.id);
  if (!hit) { refetchOps(t, null); return null; }
  if (hit.key !== key && !hit.loading) refetchOps(t, hit);
  return hit.steps ? hit : null; // 重读期间返回旧数据
}
// 右栏：脚本步骤大纲。走过的灰、慢档的红、当前步高亮并展开讲解
function stepOutline(t) {
  const sc = loadScript(t);
  const s = t.status === 'demoing' ? t.demoStep : null;
  const run = t.runs?.[t.runs.length - 1];
  const slow = new Set(run?.slowSteps || []);
  const cur = s?.n ?? 0;
  const only = t.status === 'demoing' ? runSteps(t) : null;
  const recCount = sc ? sc.steps.filter((st) => sc.recorded?.has(st.n)).length : 0;
  const head = el('h4', null, '脚本步骤', el('span', { class: 'hint', title: '已录：操作记录里有合法的动作块，演播时能直接回放' }, sc ? `共 ${sc.steps.length} 步 · 已录 ${recCount}` : ''),
    sc && recCount < sc.steps.length ? el('span', { class: 'hint legend', title: '编号是红色虚线圈的步骤还没录动作块' }, el('i'), '未录') : null);
  if (!sc) return el('aside', { class: 'outline' }, head, el('div', { class: 'empty' }, '读取中…'));
  if (sc.error && !sc.steps.length) return el('aside', { class: 'outline' }, head, el('div', { class: 'empty' }, sc.error));
  if (!sc.steps.length) return el('aside', { class: 'outline' }, head, el('div', { class: 'empty' }, '脚本里没有找到「## 演示步骤」'));
  return el('aside', { class: 'outline' }, head, el('ol', null, sc.steps.map((st) => {
    const rec = sc.recorded?.has(st.n);
    const skip = only && !only.includes(st.n);
    const cls = [skip ? 'skip' : '', !skip && st.n < cur ? 'done' : '', st.n === cur ? 'now' : '', slow.has(st.n) && (cur ? st.n <= cur : true) ? 'slow' : '', rec ? '' : 'unrec'].filter(Boolean).join(' ');
    return el('li', { class: cls, 'data-n': st.n, title: rec ? '已录动作块，演播时直接回放' : '还没录动作块，演播到这一步会变慢' },
      el('span', { class: 'no' }, st.n < cur && !slow.has(st.n) && !skip ? '✓' : st.n),
      el('div', null, el('div', { class: 'what' }, st.text, skip ? el('span', { class: 'skip-tag' }, '本场跳过') : null),
        st.narration && (st.n === cur || !cur) ? el('div', { class: 'say' }, st.narration) : null));
  })));
}

// 读脚本：操作记录 + 步骤列表。prev 是旧数据，读的时候先留着，读完再换
function refetchOps(t, prev) {
  const key = opsKey(t);
  {
    opsCache.set(t.id, { ...(prev || {}), key, loading: true });
    fetch(`/api/demo/ops?id=${encodeURIComponent(t.id)}`).then((r) => r.json()).then((out) => {
      const ops = (out.ops || '').replace(/<!--[\s\S]*?-->/g, '').trim();
      opsCache.set(t.id, { key, raw: ops, html: ops ? renderMarkdown(ops) : '', steps: out.steps || [], recorded: new Set(out.recorded || []), viewport: out.viewport || null, error: out.ok ? out.error : out.message });
    }).catch(() => opsCache.set(t.id, { ...(prev || {}), key, steps: prev?.steps || [], error: '连不上 ateam 服务。' })).then(() => { if (view.task === t.id) renderDrawer(false); if (view.job === t.jobId) renderMain(); if (showDlg?.id === t.id) renderShowDialog(); });
  }
}

// 设为优先 / 取消优先：只影响同角色 worker 领任务的先后
let priorityError = null;
let holdError = null;

// 暂停 / 恢复领取：kind 是 tasks 或 jobs
async function holdAction(kind, id, on) {
  try {
    const res = await fetch(`/api/${kind}/hold`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id, on, by: 'user' }) });
    const out = await res.json();
    holdError = out.ok ? null : out.message;
  } catch { holdError = '连不上 ateam 服务。'; }
  await poll();
  render();
  renderDrawer(false);
}

function holdBox(t) {
  const job = data.state.jobs.find((j) => j.id === t.jobId);
  const on = !!t.onHold;
  let hint;
  if (job?.onHold) hint = `整个需求 ${job.id} 暂停了领取，这张卡也不会派发。在需求页的提示里点「恢复领取」。`;
  else if (on) hint = `已暂停${t.onHold.reason ? `（${t.onHold.reason}）` : ''}：卡留在待领取，worker 不会领到它。恢复后按上面的派发顺序派发。`;
  else hint = '先不想让 worker 领这张卡（比如等确认、等别的事），可以暂停领取。依赖它的卡也会跟着等。';

    el('h4', null, '暂停领取'),
    el('p', { class: 'hint' }, hint),
    job?.onHold ? null : el('div', { class: 'prompt' },
      el('button', { class: `btn${on ? ' primary' : ''}`, onclick: (e) => { e.stopPropagation(); holdAction('tasks', t.id, !on); } }, on ? '恢复领取' : '暂停领取'),
      holdError ? el('span', { class: 'hint' }, holdError) : null),
  ];
}
// ---------- 审卡意见 ----------
const CRITIQUE_STATUS = {
  open: '等 leader 回复', proposed: 'leader 同意，等你确认', disputed: 'leader 不同意，等你决定',
  redo: '你已决定，等 leader 照做', resolved: '已处理', closed: '你决定不改', overruled: '你维持了原样',
};

const awaitingUser = (c) => c.status === 'proposed' || c.status === 'disputed';

function critiqueTag(t) {
  const list = t.critiques || [];
  if (list.some(awaitingUser)) return el('span', { class: 'tag warn' }, '审卡：待你决定');
  const open = list.filter((c) => c.status === 'open' || c.status === 'redo').length;
  return open ? el('span', { class: 'tag critique' }, `审卡意见 ${open}`) : null;
}

// 一条审卡意见的完整内容：意见、依据、leader 的回复、你的决定、改了什么
function critiqueItem(c) {
  const md = (text) => { const d = el('div', { class: 'md' }); d.innerHTML = renderMarkdown(text); return d; }; // renderMarkdown 先转义了 HTML
  const replyLabel = c.replyKind === 'agree' ? 'leader 同意，打算这样改：' : c.replyKind === 'dispute' ? 'leader 不同意，理由：' : 'leader：';
  return el('div', { class: 'critique-item' },
    el('div', { class: 'hint' }, `#${c.id} ${c.by}，${fmtTime(c.ts)}${c.because ? `，重新审：${c.because}` : ''}　`, el('b', null, CRITIQUE_STATUS[c.status] || c.status)),
    el('div', { class: 'ci-label' }, '审卡意见'), md(c.text),
    c.basis ? [el('div', { class: 'ci-label' }, '依据'), md(c.basis)] : null,
    c.reply ? [el('div', { class: 'ci-label' }, replyLabel), md(c.reply)] : null,
    c.replyBasis ? [el('div', { class: 'ci-label' }, 'leader 的依据'), md(c.replyBasis)] : null,
    c.ruling ? [el('div', { class: 'ci-label' }, '你的决定'), md(c.ruling)] : null,
    c.doneText ? [el('div', { class: 'ci-label' }, 'leader 已改'), md(c.doneText)] : null);
}

function critiqueBox(t) {
  const list = t.critiques || [];
  if (!list.length) return null;
  const waiting = list.some(awaitingUser);
  return [
    el('h4', null, `审卡意见（${list.length}）`),
    list.map(critiqueItem),
    waiting ? el('div', { class: 'prompt' },
      el('button', { class: 'btn primary', onclick: (e) => { e.stopPropagation(); decideLater.delete(t.id); decideFocus = t.id; renderDecideDialog(); } }, '去决定')) : null,
  ];
}

// ---------- 审卡分歧：弹框让你决定 ----------
// leader 回复了审卡意见（同意或不同意）后，由你决定怎么办。一次显示一张卡，「稍后再说」这次先不弹。
const decideLater = new Set();
let decideFocus = null;
let decideCustom = false;
let decideError = null;

function decideTasks() {
  return data.state.tasks.filter((t) => (t.critiques || []).some(awaitingUser));
}

async function decide(t, side, text) {
  try {
    const res = await fetch('/api/critique/rule', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: t.id, side, text }) });
    const out = await res.json();
    decideError = out.ok ? null : out.message;
  } catch { decideError = '连不上 ateam 服务。'; }
  if (!decideError) { decideCustom = false; decideFocus = null; }
  await poll();
  renderDecideDialog();
}

function renderDecideDialog() {
  const box = document.getElementById('decide-dialog');
  // 正在写自己的意见：轮询刷新不重画，免得打字丢失
  if (decideCustom && box.contains(document.activeElement) && document.activeElement.tagName === 'TEXTAREA') return;
  const all = decideTasks();
  for (const id of [...decideLater]) if (!all.some((t) => t.id === id)) decideLater.delete(id);
  const list = all.filter((t) => !decideLater.has(t.id) || t.id === decideFocus);
  if (!list.length) { box.hidden = true; box.replaceChildren(); return; }
  const t = list.find((x) => x.id === decideFocus) || list[0];
  const waiting = t.critiques.filter(awaitingUser);
  const agreed = waiting.some((c) => c.replyKind === 'agree');
  const job = data.state.jobs.find((j) => j.id === t.jobId);
  const stop = (fn) => (e) => { e.stopPropagation(); fn(); };
  const origin = el('div', { class: 'md origin' });
  origin.innerHTML = renderMarkdown(job?.origin || '（这个需求没有存你的原话）');
  const area = el('textarea', { class: 'rules-editor', rows: '4', placeholder: '写下你要 leader 怎么改，比如「按审卡意见改，但按钮文案保留原来的」' });
  // 每个选项一张卡片：点了就按它决定
  const choice = (title, desc, fn, on) => el('button', { class: `choice${on ? ' on' : ''}`, onclick: stop(fn) },
    el('span', { class: 'radio' }), el('span', null, el('b', null, title), el('span', { class: 'd' }, desc)));
  const options = agreed ? [
    choice('按 leader 的方案改', 'leader 同意审卡的意见，并给出了改法，就照它的改。', () => decide(t, 'leader')),
    choice('按审卡意见原样改', '不用 leader 的改法，照审卡提的原样改。', () => decide(t, 'critic')),
    choice('都不改', '两边都不采纳，卡片保持现状，到此结束。', () => decide(t, 'none')),
  ] : [
    choice('按审卡意见改', '审卡说得对，leader 照审卡的意见改卡。', () => decide(t, 'critic')),
    choice('维持原样', '同意 leader 的看法，卡片不改，到此结束。', () => decide(t, 'leader')),
  ];
  const later = () => { decideLater.add(t.id); decideFocus = null; decideCustom = false; renderDecideDialog(); };
  box.classList.toggle('again', !box.hidden); // 已经开着时重绘不再播弹出动画
  fill(box, el('div', { class: 'modal decide-modal', onclick: (e) => e.stopPropagation() },
    modalHead(all.length > 1 ? `审卡有分歧，等你决定（共 ${all.length} 张）` : '审卡有分歧，等你决定', later),
    el('div', { class: 'modal-body' },
      el('p', { class: 'lead' }, el('b', { style: 'color: var(--ink)' }, `${t.id} ${t.title}`), `　需求 ${t.jobId} · ${t.role} · ${LANE_LABEL[laneOf(t)] || t.status}　`,
        el('button', { class: 'btn ghost sm', onclick: stop(() => { decideLater.add(t.id); renderDecideDialog(); view = { job: t.jobId, task: t.id, report: false }; saveView(); render(); renderDrawer(true); }) }, '看卡片全文')),
      job?.origin ? [el('div', { class: 'ci-label' }, `你提需求时的原话（需求 ${t.jobId}）`), origin] : null,
      waiting.map(critiqueItem),
      el('div', { class: 'ci-label', style: 'margin-top: 16px' }, '你的决定'),
      el('div', { class: 'choices' }, options,
        choice('我来写意见', '两边都不完全对：写下你要 leader 怎么改。', () => { decideCustom = !decideCustom; renderDecideDialog(); }, decideCustom)),
      decideCustom ? [area, el('div', { class: 'actions' },
        el('button', { class: 'btn primary', onclick: stop(() => decide(t, 'custom', area.value)) }, '按我的意见改'))] : null,
      decideError ? el('p', { class: 'hint', style: 'color: var(--rework)' }, decideError) : null),
    el('div', { class: 'modal-foot' },
      el('span', { class: 'hint' }, '决定之后 leader 照做，做完会写明改了什么。'),
      el('button', { class: 'btn', onclick: stop(later) }, '稍后再说'))));
  box.hidden = false;
}

// 指派：用户在看板上把任务交给某个 worker（比如难的任务交给 Claude 的窗口）。只有它能领，它优先领。

// 待领取、依赖已满足、但没有同角色在线 worker 的任务 → 需要有人开新窗口接手
function rolesNeedingWorkers() {
  const { tasks, agents } = data.state;
  const approved = new Set(tasks.filter((t) => t.status === 'approved').map((t) => t.id));
  const onlineRoles = new Set(agents.filter((a) => a.status === 'online').map((a) => a.role.trim().toLowerCase()));
  const byRole = new Map();
  for (const t of tasks) {
    if (t.status !== 'pending' || !t.dependsOn.every((d) => approved.has(d))) continue;
    if (onlineRoles.has(t.role.trim().toLowerCase())) continue;
    if (!byRole.has(t.role)) byRole.set(t.role, []);
    byRole.get(t.role).push(t);
  }
  return byRole;
}

const staleLater = new Set();
let staleError = null;

async function staleAction(path, body) {
  try {
    const res = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    const out = await res.json();
    staleError = out.ok ? null : out.message;

  await poll();
  renderStaleDialog();
}

function renderStaleDialog() {
  const box = document.getElementById('stale-dialog');
  for (const id of [...staleLater]) if (!staleAgents().some((a) => a.id === id)) staleLater.delete(id);
  const list = staleAgents().filter((a) => !staleLater.has(a.id));
  if (!list.length) { box.hidden = true; box.replaceChildren(); return; }
  const items = list.map((a) => {
    const t = data.state.tasks.find((x) => x.id === a.currentTask);
    return el('div', { class: 'stale-item' },
      el('div', { class: 'wcard-head', style: 'margin-bottom: 8px' }, avatar(a.id, a.role),
        el('span', { class: 'who-line' }, el('b', null, agentLabel(a.id)), el('span', { class: 'hint' }, `${a.role} · ${Math.round((Date.now() - a.lastSeenAt) / 60000)} 分钟没动静`))),

        el('button', { class: 'btn warn', onclick: (e) => { e.stopPropagation(); staleAction('/api/reclaim', { id: a.currentTask, text: '用户确认原窗口没了' }); } }, '窗口没了，换人接手'),
        el('button', { class: 'btn ghost', onclick: (e) => { e.stopPropagation(); staleLater.add(a.id); renderStaleDialog(); } }, '稍后再说')),
      el('p', { class: 'hint' }, '窗口还在但停住了：把下面这句叫醒话发给它，不用换人。'),
      promptBlock(wakePrompt(a), renderStaleDialog));
  });
  box.classList.toggle('again', !box.hidden); // 已经开着时重绘不再播弹出动画

    el('div', { class: 'modal-body' },
      el('p', { class: 'lead' }, '任务还在它手上，不会自动交给别人。你确认之后才会换人。'),
      items,
      staleError ? el('p', { class: 'hint', style: 'color: var(--rework)' }, staleError) : null)));
  box.hidden = false;
}

// 每件事 { key, text, body }：key 用来给浏览器通知去重，text 是按钮提示，body 是通知正文
function attentionItems() {
  if (!data) return [];
  const items = [];
  for (const j of data.state.jobs.slice().reverse()) {
    if (j.status === 'awaiting_acceptance') items.push({ key: `accept:${j.id}`, text: `${j.id} 待你验收`, body: `${j.id} ${j.title} 待你验收` });

  for (const [role, ts] of (frozenDemo() ? new Map() : rolesNeedingWorkers())) {
    items.push({ key: `needs:${role.toLowerCase()}`, role, tasks: ts.map((t) => t.id + (t.handoff ? ' 待接手' : '')).join('、'), text: `${role} 缺 worker`, body: `${role} 的任务没人做，需要开一个 ${role} worker` });
  }
  if (data.stale) items.push({ key: 'stale', text: '服务需要重启', body: 'ateam 的代码已更新，请重启 ateam serve' });
  for (const t of data.state.tasks) {
    if ((t.critiques || []).some(awaitingUser)) {
      items.push({ key: `dispute:${t.id}`, text: `${t.id} 审卡分歧等你决定`, body: `${t.id} ${t.title}：审卡和 leader 有分歧，等你决定` });
    }
  }
  for (const t of data.state.tasks) {
    if (!t.assignTo || (t.status !== 'pending' && t.status !== 'held')) continue;
    const a = data.state.agents.find((x) => x.id === t.assignTo);
    if (!a || a.status !== 'online') {
      items.push({ key: `assign:${t.id}`, text: `${t.id} 指派的 ${t.assignTo} 不在线`, body: `${t.id} 指派给了 ${t.assignTo}，但它不在线，任务在等它` });
    }
  }
  for (const a of data.state.agents) {
    const cancelled = pendingCancel(a);
    if (cancelled) {
      items.push({ key: `cancel:${a.id}:${cancelled.id}`, text: `${a.id} 还在做已作废的 ${cancelled.id}`, body: `${cancelled.id} 已作废，但 ${a.id} 还不知道，可以去它的窗口叫停` });
    }
    if (a.status === 'online' && a.stale && a.currentTask) {
      items.push({ key: `quiet:${a.id}`, text: `${a.id} 可能停了`, body: `${a.id} 很久没动静（手上 ${a.currentTask}），请确认窗口还在不在` });
    }
  }
  // 演播需求一直是进行中，但不需要 leader 在线
  const busy = data.state.jobs.some((j) => !j.demo && (j.status === 'planning' || j.status === 'active'));
  if (busy && data.leader && !data.leader.online) items.push({ key: 'leader', text: 'leader 未连接', body: 'leader 没有连接，需求还没做完' });
  return items;
}

// ---------- 浏览器通知 ----------
// 一件事持续 1 分钟才通知（worker 掉线马上重连、leader 短暂断开都不打扰），同一件事只通知一次，
// 事情消失后再出现会再通知。打开页面时已经存在的事不通知（标题上已经有数字了）。
const NOTIFY_SETTLE_MS = 60 * 1000;
const notifySeen = new Map(); // key -> 第一次看到的时间
const notifyDone = new Set();
let notifyPrimed = false;
const canNotify = () => typeof Notification !== 'undefined';

function checkNotify(items) {
  const keys = new Set(items.map((i) => i.key));
  for (const key of [...notifySeen.keys()]) {
    if (!keys.has(key)) { notifySeen.delete(key); notifyDone.delete(key); }
  }
  for (const i of items) {
    if (!notifySeen.has(i.key)) {
      notifySeen.set(i.key, Date.now());
      if (!notifyPrimed) notifyDone.add(i.key);
    }
  }
  notifyPrimed = true;
  if (!canNotify() || Notification.permission !== 'granted') return;
  const fresh = items.filter((i) => !notifyDone.has(i.key) && Date.now() - notifySeen.get(i.key) >= NOTIFY_SETTLE_MS);
  if (!fresh.length) return;
  for (const i of fresh) notifyDone.add(i.key);
  const project = (data.root || '').split('/').filter(Boolean).pop() || '';
  const body = fresh.length === 1 ? fresh[0].body : `${fresh.length} 件事需要你处理：${fresh.map((i) => i.text).join('；')}`;
  try {
    const n = new Notification(`ateam${project ? ` · ${project}` : ''}`, { body, tag: `ateam-${project}`, silent: true });
    n.onclick = () => { window.focus(); n.close(); };
  } catch {}
}

function renderNotifyButton() {
  const btn = document.getElementById('notify-btn');
  const show = canNotify() && Notification.permission === 'default';
  btn.hidden = !show;
}

async function enableNotify() {
  if (!canNotify()) return;
  try { await Notification.requestPermission(); } catch {}
  renderNotifyButton();
  if (Notification.permission === 'granted') {
    try { new Notification('ateam 通知已开启', { body: '有需求待验收、任务缺 worker、leader 掉线时会在这里提醒你。看板标签页要开着（可以在后台）。', silent: true }); } catch {}
  }
}

function setBadge(text, color) {
  const key = `${text}|${color}`;
  if (key === lastBadge) return;
  lastBadge = key;
  document.title = text ? `(${text}) ${BASE_TITLE}` : BASE_TITLE;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">`
    + `<rect x="2" y="2" width="28" height="28" rx="7" fill="#2f7d55"/>`
    + `<text x="16" y="22" font-size="16" font-family="sans-serif" font-weight="700" text-anchor="middle" fill="#fff">a</text>`
    + (text ? `<circle cx="25" cy="7" r="7" fill="${color}"/>` : '')
    + '</svg>';
  let link = document.querySelector('link[rel="icon"]');
  if (!link) { link = document.createElement('link'); link.rel = 'icon'; document.head.append(link); }
  link.href = `data:image/svg+xml,${encodeURIComponent(svg)}`;
}

function renderAttention() {
  document.getElementById('stale').hidden = !data?.stale || toastClosed.has('stale');
  const items = attentionItems();
  setBadge(items.length ? String(items.length) : '', '#d9534f');
  checkNotify(items);
  renderNotifyButton();
  const btn = document.getElementById('attention');
  if (!items.length) { btn.hidden = true; return; }
  btn.hidden = false;
  fill(btn, '需要你处理', el('span', { class: 'cnt' }, String(items.length)));
  btn.title = items.map((i) => i.text).join('\n');
}

async function poll() {
  try {
    // 带上次的 ETag：状态没变时服务只回 304，不用重新下载和解析整份状态
    const res = await fetch('/api/state?view=dashboard', { cache: 'no-store', headers: lastEtag ? { 'if-none-match': lastEtag } : {} });
    if (res.status !== 200 && res.status !== 304) throw new Error(`HTTP ${res.status}`);
    document.getElementById('banner').hidden = true;
    toastClosed.delete('banner'); // 连上了：下次再断开时重新提醒
    const json = res.status === 304 ? lastJson : await res.text();
    lastEtag = res.headers.get('etag') || '';
    if (json !== lastJson) {
      lastJson = json;
      data = JSON.parse(json);
      render();
    } else {
      renderWorkers(); // 只刷新「心跳 N 分钟前」
    }
    if (!PROMPTER_ONLY) renderAttention();
  } catch {
    document.getElementById('banner').hidden = toastClosed.has('banner');
    lastJson = null; // 恢复连接后重新渲染，刷新提醒
    lastEtag = '';
    setBadge('!', '#d9534f');
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (showDlg) { closeShowDialog(); return; }
  if (assignOpen) { assignOpen = null; renderDrawer(false); return; }
  if (attentionOpen) { attentionOpen = false; renderAttentionList(); return; }
  if (helper.open) { helper = { open: false, focus: null }; renderHelper(); return; }
  if (view.report) closeReport();
  else if (view.task) closeDrawer();
});
// 点抽屉以外的地方关闭抽屉；点任务卡片则切换到那张卡片（卡片自己的点击处理负责打开）
document.addEventListener('click', (e) => {
  if (attentionOpen && !e.target.closest('#attention, #attention-list')) { attentionOpen = false; renderAttentionList(); }
  if (helper.open && !e.target.closest('#helper, #helper-btn')) { helper = { open: false, focus: null }; renderHelper(); }
  if (assignOpen && !e.target.closest('.assign-picker')) { assignOpen = null; renderDrawer(false); }
  if (!view.task) return;
  if (e.target.closest('#drawer, .card, .cancelled-row, .demo-row, #demo-banner, #stale-dialog, #decide-dialog, #show-dialog')) return;
  closeDrawer();
});
document.getElementById('notify-btn').addEventListener('click', (e) => { e.stopPropagation(); enableNotify(); });

// 「需要你处理」：点开一个列表，每件事一行，点哪件就去处理哪件
let attentionOpen = false;

function goAttention(key) {
  attentionOpen = false;
  renderAttentionList();
  const [kind, id] = key.split(':');
  if (kind === 'accept') {
    view = { job: id, task: null, report: false };
    saveView();
    render();
    document.getElementById('main').scrollTop = 0;
  } else if (kind === 'needs') {
    needsExpanded.add(id ? [...rolesNeedingWorkers().keys()].find((r) => r.toLowerCase() === id) || id : id);
    attentionOpen = true;
    renderAttentionList();
  } else if (kind === 'leader') {
    helper = { open: true, focus: null, tab: 'lead' };
    renderHelper();
  } else if (kind === 'quiet') {
    staleLater.delete(id);
    renderStaleDialog();
  } else if (kind === 'dispute') {
    decideLater.delete(id);
    decideFocus = id;
    renderDecideDialog();
  } else if (kind === 'assign') {
    const t = data.state.tasks.find((x) => x.id === id);
    if (t) { view = { job: t.jobId, task: t.id, report: false }; saveView(); render(); renderDrawer(true); }
  } else if (kind === 'cancel') {
    helper = { open: true, focus: id };
    renderHelper();
  }
  // stale（服务需要重启）：顶部黄色提示条已经写了怎么做
}

// 「其它」里每件事前面的类别：[文字, 颜色]
const needsExpanded = new Set(); // 「需要你处理」里展开了提示词的缺人角色
const ATT_KIND = {
  needs: ['缺人', 'asking'], stale: ['重启', 'rework'], dispute: ['分歧', 'submitted'], assign: ['指派', 'working'],
  cancel: ['作废', 'rework'], quiet: ['停了', 'asking'], leader: ['leader', 'rework'],
};
// 弹框：待验收的需求可以勾选后一次验收通过；其它事每件一行，点「去处理」跳过去
let acceptPick = null;    // 勾选的需求编号；null 表示还没动过，默认全选
let acceptConfirm = false; // 「验收通过」两步确认
let acceptMsg = '';

function renderAttentionList() {
  const box = document.getElementById('attention-list');
  const items = attentionOpen ? attentionItems() : [];
  if (!items.length) { attentionOpen = false; box.hidden = true; box.replaceChildren(); return; }
  const jobs = data.state.jobs.filter((j) => j.status === 'awaiting_acceptance').reverse();
  if (acceptPick === null) acceptPick = new Set(jobs.map((j) => j.id));
  for (const id of [...acceptPick]) if (!jobs.some((j) => j.id === id)) acceptPick.delete(id);
  const others = items.filter((i) => !i.key.startsWith('accept:'));
  const stop = (fn) => (e) => { e.stopPropagation(); fn(); };
  const picked = jobs.filter((j) => acceptPick.has(j.id));
  const allOn = picked.length === jobs.length;

  const allBox = el('input', { type: 'checkbox', 'aria-label': '全选' });
  allBox.checked = allOn;
  allBox.indeterminate = picked.length > 0 && !allOn;
  allBox.addEventListener('change', () => { acceptPick = new Set(allOn ? [] : jobs.map((j) => j.id)); acceptConfirm = false; renderAttentionList(); });
  const acceptSec = jobs.length ? [
    el('label', { class: 'acc-head', title: allOn ? '全不选' : '全选' }, allBox, `待你验收（${jobs.length}）`),
    el('div', { class: 'acc-list' }, jobs.map((j) => {
      const tasks = data.state.tasks.filter((t) => t.jobId === j.id && t.status !== 'cancelled');
      const box2 = el('input', { type: 'checkbox' });
      box2.checked = acceptPick.has(j.id);
      box2.addEventListener('change', () => { if (box2.checked) acceptPick.add(j.id); else acceptPick.delete(j.id); acceptConfirm = false; renderAttentionList(); });
      return el('label', { class: `acc-row${box2.checked ? ' on' : ''}` }, box2,
        el('span', { class: 'txt' }, el('b', null, j.id), j.title, el('div', { class: 'hint' }, `${tasks.length} 个任务 · ${fmtTime(j.updatedAt)} 提交汇报`)),
        el('button', { class: 'btn sm', onclick: (e) => { e.preventDefault(); e.stopPropagation(); attentionOpen = false; renderAttentionList(); view = { job: j.id, task: null, report: true }; saveView(); render(); } }, '看汇报'));
    })),
    el('div', { class: 'acc-foot' },
      acceptMsg ? el('span', { class: 'hint', style: 'margin-right: auto' }, acceptMsg) : null,
      acceptConfirm ? el('button', { class: 'btn ghost', onclick: stop(() => { acceptConfirm = false; renderAttentionList(); }) }, '取消') : null,
      el('button', {
        class: 'btn primary', disabled: picked.length === 0,
        onclick: stop(async () => {
          if (!acceptConfirm) { acceptConfirm = true; renderAttentionList(); return; }
          acceptConfirm = false;
          try {
            const res = await fetch('/api/jobs/accept', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ ids: picked.map((j) => j.id) }) });
            const out = await res.json();
            acceptMsg = out.ok ? `已验收通过 ${picked.length} 个需求。` : out.message;
          } catch { acceptMsg = '连不上 ateam 服务。'; }
          acceptPick = null;
          await poll();
          renderAttentionList();
        }),
      }, acceptConfirm ? `确认验收通过这 ${picked.length} 个` : `验收通过选中的（${picked.length}）`)),
  ] : (acceptMsg ? el('p', { class: 'hint' }, acceptMsg) : null);

  const otherSec = others.length ? [
    jobs.length ? el('div', { class: 'att-head' }, el('h4', null, `其它（${others.length}）`)) : null,
    others.map((i) => {
      // 缺人：不跳走，就地展开开 worker 的提示词
      const role = i.key.startsWith('needs:') ? i.role : null;
      const open = role && needsExpanded.has(role);
      return [el('div', { class: 'att-row' },
        el('span', { class: 'what' }, el('span', { class: `lozenge kind c-${ATT_KIND[i.key.split(':')[0]]?.[1] || 'pending'}` }, ATT_KIND[i.key.split(':')[0]]?.[0] || '其它'), el('span', null, i.body)),
        i.key === 'stale' ? el('span', { class: 'hint' }, '见右上角提示')
          : role ? el('button', { class: 'btn sm', onclick: stop(() => { open ? needsExpanded.delete(role) : needsExpanded.add(role); renderAttentionList(); }) }, open ? '收起' : '开 worker')
          : el('button', { class: 'btn sm', onclick: stop(() => goAttention(i.key)) }, '去处理')),
        open ? el('div', { class: 'att-prompt' },
          el('p', { class: 'hint' }, `任务：${i.tasks}。打开一个新的 agent 窗口（可以换账号），工作目录选项目目录，把下面这句话发给它，它会自动接手。想给窗口起名字，就在第一行末尾加「，名字 账号B」。`),
          promptBlock(workerPrompt(role), renderAttentionList)) : null];
    }),
  ] : null;

  box.classList.toggle('again', !box.hidden); // 已经开着时重绘不再播弹出动画
  // 气泡的小箭头对准页头的「需要你处理」按钮
  const r = document.getElementById('attention').getBoundingClientRect();
  box.style.setProperty('--arrow-x', `${Math.max(16, window.innerWidth - 20 - (r.left + r.width / 2) - 5)}px`);
  fill(box, el('div', { class: 'modal att-modal', onclick: (e) => e.stopPropagation() },
    modalHead(`需要你处理（${items.length}）`, () => { attentionOpen = false; renderAttentionList(); }),
    el('div', { class: 'modal-body' }, acceptSec, otherSec)));
  box.hidden = false;
}

document.getElementById('attention').addEventListener('click', (e) => {
  e.stopPropagation();
  attentionOpen = !attentionOpen;
  if (attentionOpen && helper.open) { helper = { open: false, focus: null }; renderHelper(); }
  acceptPick = null;
  acceptConfirm = false;
  acceptMsg = '';
  renderAttentionList();
});
document.getElementById('helper-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  helper = helper.open ? { open: false, focus: null } : { open: true, focus: null };
  if (helper.open && attentionOpen) { attentionOpen = false; renderAttentionList(); }
  renderHelper();
});
loadView();
poll();
setInterval(poll, 3000);
// 卡片上的时间每秒走一次，不等数据变化
setInterval(() => { for (const n of document.querySelectorAll('.since[data-since]')) tickSince(n); }, 1000);
// 服务有变化时推送过来，立即刷新：后台标签页的定时器会被浏览器暂停，推送不会，标题上的提醒才能及时更新
let pollPending = false;
function pollSoon() {
  if (pollPending) return;
  pollPending = true;
  setTimeout(() => { pollPending = false; poll(); }, 300);
}
try {
  const stream = new EventSource('/api/stream');
  stream.onmessage = () => { if (document.hidden) poll(); else pollSoon(); };
} catch {}
// 切回标签页时马上刷新一次
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });

// Mac 外接触摸屏（设置里开启「触屏模式」才生效）：macOS 把单指当成鼠标按住拖动，页面不会滚。这里在可滚动区域按住上下拖就滚动，
// 松手带一点惯性；拖过之后的那次点击吞掉，不误开卡片。输入框、代码块不接管，照常能选中文字
(() => {
  if (PROMPTER_ONLY) return;
  const SKIP = 'input, textarea, select, pre, code, .pblock, [contenteditable]';
  const scroller = (node) => {
    for (let n = node; n && n !== document.documentElement; n = n.parentElement) {
      if (/(auto|scroll)/.test(getComputedStyle(n).overflowY) && n.scrollHeight > n.clientHeight + 1) return n;
    }
    return null;
  };
  let st = null;
  let glide = 0;
  addEventListener('pointerdown', (e) => {
    cancelAnimationFrame(glide);
    if (!touchScroll) return; // 设置里的「触屏模式」，默认关闭
    if (e.button !== 0 || e.pointerType === 'pen' || e.target.closest(SKIP)) return;
    const box = scroller(e.target);
    if (box) st = { box, id: e.pointerId, y: e.clientY, top: box.scrollTop, dragging: false, v: 0, lastY: e.clientY, lastT: e.timeStamp };
  }, true);
  addEventListener('pointermove', (e) => {
    if (!st || e.pointerId !== st.id) return;
    const dy = e.clientY - st.y;
    if (!st.dragging) {
      if (Math.abs(dy) < 8) return;
      st.dragging = true;
      document.documentElement.classList.add('drag-scrolling');
      getSelection()?.removeAllRanges();
    }
    st.box.scrollTop = st.top - dy;
    const dt = e.timeStamp - st.lastT;
    if (dt > 0) st.v = (e.clientY - st.lastY) / dt;
    st.lastY = e.clientY;
    st.lastT = e.timeStamp;
    e.preventDefault();
  }, true);
  const end = () => {
    if (st?.dragging) {
      document.documentElement.classList.remove('drag-scrolling');
      const swallow = (ev) => { ev.stopPropagation(); ev.preventDefault(); };
      addEventListener('click', swallow, { capture: true, once: true });
      setTimeout(() => removeEventListener('click', swallow, true), 0);
      // 惯性：按松手前的速度继续滚，逐渐减速
      const { box } = st;
      let v = st.v * 16;
      let last = performance.now();
      const step = (now) => {
        const k = (now - last) / 16;
        last = now;
        box.scrollTop -= v * k;
        v *= Math.pow(0.94, k);
        if (Math.abs(v) > 0.3) glide = requestAnimationFrame(step);
      };
      if (Math.abs(v) > 1) glide = requestAnimationFrame(step);
    }
    st = null;
  };
  addEventListener('pointerup', end, true);
  addEventListener('pointercancel', end, true);
})();
</script>
