<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ateam 调度台</title>
<style>
:root {
  --bg: #e9ece6;
  --surface: #f7f8f4;
  --sunken: #dfe3dc;
  --ink: #1f2a24;
  --muted: #5f6e64;
  --line: #c9cfc6;
  --pending: #8b958e;
  --working: #2d5d9f;
  --rework: #b5562b;
  --asking: #a87f0e;
  --submitted: #6a4fa3;
  --approved: #2f7d4f;
  --held: #8a3b5c;
  --focus: #2d5d9f;
  /* 角色色：按角色名固定分配，前端/后端等常用名有固定颜色 */
  --role-0: #1d6f8c; --role-1: #9c4f1c; --role-2: #5b6b1e; --role-3: #7a3f8f; --role-4: #a3324a; --role-5: #3d5a99;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141a17;
    --surface: #1c2420;
    --sunken: #101512;
    --ink: #e3e9e2;
    --muted: #93a197;
    --line: #2f3a34;
    --pending: #7d877f;
    --working: #6d9be0;
    --rework: #e08a5f;
    --asking: #d9b44a;
    --submitted: #a88ee0;
    --approved: #5fbf86;
    --held: #d27a9f;
    --focus: #6d9be0;
    --role-0: #5cb8d6; --role-1: #e39a62; --role-2: #a9bd5a; --role-3: #c58ad8; --role-4: #e57890; --role-5: #8ea9e8;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  font-variant-numeric: tabular-nums;
  min-height: 100vh;
}
button { font: inherit; color: inherit; }
.meta { color: var(--muted); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

header.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px;
  padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--surface);
}
header.top h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: .02em; }
.workers { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
.worker {
  appearance: none; display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 11px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--bg); color: var(--ink); font: inherit; font-size: 12.5px; line-height: 1;
}
.worker .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--approved); flex: none; }
.worker .task { color: var(--muted); }
.worker.offline { color: var(--muted); opacity: .6; }
/* leader 标签：放在最前面，和 worker 之间留一道间隔；未连接时红点 */
.leader-chip { margin-right: 6px; }
.leader-chip.offline-lead { border-color: color-mix(in srgb, var(--rework) 45%, var(--line)); }
.leader-chip.offline-lead .dot { background: var(--rework); }
.leader-chip.offline-lead .task { color: var(--rework); }
button.worker { cursor: pointer; }
button.worker:hover { border-color: var(--muted); }
.helper-btn { margin-left: auto; }
/* 提示词面板：顶部右侧弹出 */
.helper {
  position: fixed; top: 56px; right: 16px; z-index: 15; width: min(520px, calc(100vw - 32px));
  max-height: calc(100vh - 80px); overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 12px 32px rgba(15, 25, 20, .22); padding: 14px 16px 16px;
}
.helper[hidden] { display: none; }
.helper-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.helper-head b { font-size: 15px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 8px 0 10px; }
.tab {
  appearance: none; border: none; background: none; cursor: pointer; font: inherit; font-size: 13px;
  color: var(--muted); padding: 6px 14px; margin-bottom: -1px; border-bottom: 2px solid transparent;
}
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
.helper-sec { display: flex; align-items: center; gap: 8px; margin: 18px 0 2px; }
.helper-sec h4 { font-size: 13px; color: var(--muted); margin: 0; font-weight: 600; margin-right: auto; }
.helper .hint { margin: 2px 0 0; }
/* 每个 worker 一张卡片：上面一行信息 + 操作，下面是提示词 */
.wcard { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px 12px; margin-top: 10px; }
.wcard.focus { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
.wcard-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.wcard-head .grow { margin-right: auto; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.pill { padding: 1px 7px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: color-mix(in srgb, var(--asking) 18%, transparent); color: var(--asking); }

.worker.offline .dot { background: var(--pending); }
.worker .meta { color: var(--muted); }
.banner { padding: 8px 20px; background: var(--rework); color: #fff; font-size: 13px; }
.banner[hidden] { display: none; }
.needs { padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line); border-left: 4px solid var(--asking); }
.needs[hidden] { display: none; }
.needs-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.needs-row + .needs-row { margin-top: 8px; }
.needs b { font-weight: 600; }
.prompt { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 6px; }
/* 提示词块：文字铺满，复制按钮嵌在右上角 */
.pblock { position: relative; margin-top: 8px; }
.pblock code {
  display: block; background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 64px 10px 12px; user-select: all; white-space: pre-wrap; line-height: 1.6; font-size: 12.5px;
}
.pblock .btn { position: absolute; top: 6px; right: 6px; }
/* 按钮：统一高度；primary 实色，ghost 无边框 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  height: 28px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--sunken); }
.btn.sm { height: 24px; padding: 0 9px; font-size: 12px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--sunken); color: var(--ink); }
.btn.done { border-color: var(--approved); color: var(--approved); }
.hint { color: var(--muted); font-size: 12.5px; }

.layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: calc(100vh - 56px); }
nav.jobs { border-right: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; gap: 6px; }
nav.jobs h2, main h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
.job {
  display: block; width: 100%; text-align: left; cursor: pointer;
  padding: 10px 12px; border: 1px solid transparent; border-radius: 8px; background: none;
}
.job:hover { background: var(--surface); }
.job[aria-current="true"] { background: var(--surface); border-color: var(--line); }
.job .title { font-weight: 600; }
.job .sub { color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; margin-top: 4px; }

/* 需求进度：每个任务一格，按状态着色 */
.strip { display: flex; gap: 2px; margin-top: 8px; height: 8px; }
.strip span { flex: 1; border-radius: 2px; background: var(--pending); opacity: .45; }
.strip span.s-approved { background: var(--approved); opacity: 1; }
.strip span.s-working { background: var(--working); opacity: .9; }
.strip span.s-rework { background: var(--rework); opacity: .9; }
.strip span.s-asking { background: var(--asking); opacity: .9; }
.strip span.s-submitted { background: var(--submitted); opacity: .9; }
.strip span.s-held { background: var(--held); opacity: .9; }
.strip.big { height: 14px; gap: 3px; margin: 14px 0 6px; }

main { padding: 20px 24px 40px; min-width: 0; }
.empty { color: var(--muted); padding: 40px 0; max-width: 46ch; }
.job-head h2.job-title { font-size: 22px; color: var(--ink); font-weight: 650; margin: 0; }
.job-head .desc { color: var(--muted); margin: 4px 0 0; max-width: 72ch; white-space: pre-wrap; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 22px; color: var(--muted); font-size: 13px; margin-bottom: 18px; }
.stats b { color: var(--ink); font-weight: 600; }

/* 需求页上的汇报提示条：一行，点按钮进入阅读页 */
.report-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--approved);
  border-radius: 8px; padding: 10px 14px; margin-bottom: 20px;
}
.report-bar .what { font-weight: 600; color: var(--approved); }
.report-bar .when { color: var(--muted); font-size: 12.5px; margin-right: auto; }
.btn.primary { background: var(--approved); border-color: var(--approved); color: #fff; font-weight: 600; }
.btn.primary:hover { background: var(--approved); filter: brightness(1.08); }
.btn.warn { background: var(--rework); border-color: var(--rework); color: #fff; font-weight: 600; }
.btn.warn:hover { background: var(--rework); filter: brightness(1.08); }

/* 汇报阅读页：全屏，正文居中 */
.report-page { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; }
.report-page[hidden] { display: none; }
.report-top {
  position: sticky; top: 0; display: flex; align-items: center; gap: 14px;
  padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.report-top .crumb { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.report-sheet {
  max-width: 760px; margin: 32px auto 80px; padding: 36px 48px 44px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
.report-meta { display: flex; flex-wrap: wrap; gap: 6px 20px; color: var(--muted); font-size: 13px; padding-bottom: 18px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
.report-meta b { color: var(--ink); font-weight: 600; }
.report-sheet .md { font-size: 15px; line-height: 1.8; }
.report-sheet .md h1 { font-size: 24px; line-height: 1.35; margin: 18px 0 14px; }
.report-sheet .md h2 { font-size: 18px; margin: 30px 0 10px; padding-top: 4px; }
.report-sheet .md h3 { font-size: 15.5px; margin: 22px 0 8px; }
.report-sheet .md li { margin: 4px 0; }
.report-sheet .md code { font-size: 13px; }
@media (max-width: 700px) { .report-sheet { margin: 0; border: none; border-radius: 0; padding: 20px 16px 40px; } }

.board { display: grid; grid-template-columns: repeat(7, minmax(168px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.lane { background: var(--sunken); border-radius: 8px; padding: 8px; min-height: 120px; }
.lane h3 { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 600; margin: 2px 4px 8px; }
.lane h3 .n { color: var(--muted); font-weight: 400; }
.lane h3::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--c); align-self: center; margin-right: 6px; }
.lane h3 .label { margin-right: auto; }
.card {
  display: block; width: 100%; text-align: left; cursor: pointer; margin-bottom: 6px;
  background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--c);
  border-radius: 6px; padding: 8px 10px;
}
.card:hover { border-color: var(--c); }
.card .id { color: var(--muted); font-size: 12px; }
.card .t { font-weight: 600; margin: 2px 0 6px; overflow-wrap: anywhere; }
.card .m { display: flex; flex-wrap: wrap; gap: 4px; font-size: 11.5px; }
.tag { padding: 0 6px; border-radius: 4px; background: var(--sunken); color: var(--muted); }
.role { color: #fff; background: var(--rc); font-weight: 600; }
@media (prefers-color-scheme: dark) { .role { color: #101512; } }
.role-text { color: var(--rc); font-weight: 600; }
.tag.warn { background: var(--rework); color: #fff; }
.tag.handoff { background: var(--asking); color: #fff; }

/* 任务详情抽屉 */
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw);
  background: var(--surface); border-left: 1px solid var(--line);
  box-shadow: -12px 0 32px rgba(15, 25, 20, .18);
  overflow-y: auto; padding: 18px 22px 40px; z-index: 10;
  transform: translateX(0); transition: transform .18s ease-out, width .18s ease-out;
}
.drawer.wide { width: min(1100px, 80vw); }
@media (max-width: 900px) { .drawer.wide { width: 100vw; } }
.drawer[hidden] { display: block; transform: translateX(105%); visibility: hidden; }
.drawer-tools { float: right; display: flex; gap: 6px; }
.drawer .close, .drawer .widen { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 2px 10px; cursor: pointer; }
.drawer .widen { font-size: 15px; line-height: 1.3; min-width: 34px; }
.drawer h2 { font-size: 18px; color: var(--ink); margin: 4px 0 4px; }
.drawer h4 { font-size: 13px; color: var(--muted); margin: 18px 0 6px; font-weight: 600; }
.drawer .facts { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; font-size: 13px; }
.drawer .facts dt { color: var(--muted); }
.drawer .facts dd { margin: 0; overflow-wrap: anywhere; }
.drawer .descbox { white-space: pre-wrap; background: var(--bg); border-radius: 6px; padding: 10px 12px; font-size: 13px; }
.drawer ol, .drawer ul.commits { margin: 0; padding-left: 20px; }
code, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
.timeline { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--line); }
.timeline li { position: relative; padding: 0 0 12px 14px; }
.timeline li::before {
  content: ""; position: absolute; left: -6px; top: 6px; width: 10px; height: 10px;
  border-radius: 50%; background: var(--surface); border: 2px solid var(--c, var(--pending));
}
.timeline .when { color: var(--muted); font-size: 12px; }
.timeline .what { font-weight: 600; font-size: 13px; }
.timeline .text { white-space: pre-wrap; font-size: 13px; overflow-wrap: anywhere; }

.md h1, .md h2, .md h3 { color: var(--ink); margin: 14px 0 6px; }
.md h1 { font-size: 19px; } .md h2 { font-size: 16px; } .md h3 { font-size: 14px; }
.md p { margin: 6px 0; }
.md ul, .md ol { margin: 6px 0; padding-left: 22px; }
.md pre { background: var(--bg); padding: 10px 12px; border-radius: 6px; overflow-x: auto; }
.md code { background: var(--bg); padding: 0 4px; border-radius: 3px; }
.md pre code { background: none; padding: 0; }

.c-pending { --c: var(--pending); } .c-working { --c: var(--working); } .c-rework { --c: var(--rework); }
.c-asking { --c: var(--asking); } .c-submitted { --c: var(--submitted); } .c-approved { --c: var(--approved); }
.c-held { --c: var(--held); }
.c-cancelled { --c: var(--pending); }
/* 已作废：放在看板最下面，置灰 */
.cancelled-box { margin-top: 18px; }
.cancelled-box h3 { font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 0 0 8px; }
.cancelled-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.card.cancelled { opacity: .5; filter: grayscale(1); margin-bottom: 0; }
.card.cancelled .t { text-decoration: line-through; font-weight: 500; }
.card.cancelled:hover { opacity: .8; }

@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  nav.jobs { border-right: none; border-bottom: 1px solid var(--line); }
  main { padding: 16px; }
  .board { grid-template-columns: 1fr; overflow-x: visible; }
  .lane { min-height: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .drawer { transition: none; }
}
</style>
</head>
<body>
<header class="top">
  <h1>ateam 调度台</h1>
  <div class="workers" id="workers"></div>
  <button class="btn helper-btn" id="helper-btn" type="button">使用说明</button>
</header>
<section class="needs" id="needs" hidden aria-label="需要 worker"></section>
<div class="banner" id="banner" hidden>连不上 ateam 服务，3 秒后自动重试。请确认 ateam serve 仍在运行。</div>
<div class="layout">
  <nav class="jobs" id="jobs" aria-label="需求列表"></nav>
  <main id="main"></main>
</div>
<aside class="drawer" id="drawer" hidden aria-label="任务详情"></aside>
<div class="helper" id="helper" hidden role="dialog" aria-label="给 worker 的提示词"></div>
<div class="report-page" id="report" hidden role="dialog" aria-label="leader 汇报"></div>

<script>
'use strict';

const LANES = [
  { key: 'pending', label: '待领取' },
  { key: 'working', label: '进行中' },
  { key: 'rework', label: '返工中' },
  { key: 'asking', label: '等待答复' },
  { key: 'submitted', label: '待 review' },
  { key: 'approved', label: '已通过' },
  { key: 'held', label: '已挂起' },
];
const LANE_LABEL = { ...Object.fromEntries(LANES.map((l) => [l.key, l.label])), cancelled: '已作废' };
const JOB_STATUS = { planning: '规划中', active: '进行中', awaiting_acceptance: '待你验收' };
const HISTORY = {
  created: ['创建', 'pending'], claimed: ['领取', 'working'], progress: ['进度', 'working'],
  asked: ['提问', 'asking'], answered: ['答复', 'asking'], submitted: ['交付', 'submitted'],
  approved: ['通过', 'approved'], rejected: ['打回', 'rework'], handoff: ['掉线交接', 'held'],
  held: ['挂起', 'held'], released: ['放回', 'pending'], edited: ['修改', 'pending'], cancelled: ['作废', 'cancelled'],
};

let data = null;
let lastJson = '';
let view = { job: null, task: null, report: false };
let showPrompts = false;
let copied = null; // 刚复制的提示词，用来显示「已复制」
// 抽屉是否展开到大半屏；记在本浏览器里，下次打开保持
let drawerWide = false;
try { drawerWide = localStorage.getItem('ateam.drawerWide') === '1'; } catch {}

// ---------- 小工具 ----------

// 用一组子节点替换 node 的内容；嵌套数组会展开，null/false 跳过，字符串转成文本
function fill(node, ...children) {
  node.replaceChildren(...children.flat(Infinity).filter((c) => c != null && c !== false));
}

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat(Infinity)) {
    if (c == null || c === false) continue;
    node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return node;
}

const pad = (n) => String(n).padStart(2, '0');
function fmtTime(ts) {
  const d = new Date(ts);
  return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function ago(ts) {
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (s < 60) return `${s} 秒前`;
  if (s < 3600) return `${Math.floor(s / 60)} 分钟前`;
  return `${Math.floor(s / 3600)} 小时前`;
}

function laneOf(t) {
  if (t.status === 'working' && t.rejectCount > 0) return 'rework';
  return t.status;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// 极简 markdown：先转义 HTML，再处理标题、列表、代码块、行内代码、粗体
function renderMarkdown(src) {
  const lines = escapeHtml(src).split('\n');
  const out = [];
  let list = null;
  let code = null;
  const inline = (s) => s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const line of lines) {
    if (code !== null) {
      if (/^```/.test(line)) { out.push(`<pre><code>${code.join('\n')}</code></pre>`); code = null; }
      else code.push(line);
      continue;
    }
    if (/^```/.test(line)) { closeList(); code = []; continue; }
    let m;
    if ((m = line.match(/^(#{1,3})\s+(.*)$/))) { closeList(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); continue; }
    if ((m = line.match(/^\s*[-*]\s+(.*)$/))) { if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul'; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    if ((m = line.match(/^\s*\d+\.\s+(.*)$/))) { if (list !== 'ol') { closeList(); out.push('<ol>'); list = 'ol'; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    closeList();
    if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  if (code !== null) out.push(`<pre><code>${code.join('\n')}</code></pre>`);
  closeList();
  return out.join('\n');
}

function strip(tasks, big) {
  return el('div', { class: big ? 'strip big' : 'strip', 'aria-hidden': 'true' },
    tasks.map((t) => el('span', { class: `s-${laneOf(t)}`, title: `${t.id} ${LANE_LABEL[laneOf(t)]}` })));
}

function reviewStats(tasks) {
  let reviews = 0;
  let rejects = 0;
  for (const t of tasks) {
    for (const h of t.history) {
      if (h.type === 'approved') reviews++;
      if (h.type === 'rejected') { reviews++; rejects++; }
    }
  }
  const approved = tasks.filter((t) => t.status === 'approved');
  const firstPass = approved.filter((t) => t.rejectCount === 0).length;
  const rate = approved.length ? `${Math.round((firstPass / approved.length) * 100)}%` : '—';
  return { reviews, rejects, rate, approved: approved.length };
}

// 在线 worker 超过 3 分钟没有任何动静（挂着 wait 的 worker 最多 90 秒就会刷新一次心跳）→ 多半停住了
const STALE_MS = 3 * 60 * 1000;
function isStale(a) {
  return a.status === 'online' && Date.now() - a.lastSeenAt > STALE_MS;
}

let helper = { open: false, focus: null };
let dismissAllArm = false; // 「全部下线」两步确认

function wakePrompt(a) {

}

    roles.size ? [...roles.values()].map((role) => el('div', { class: 'wcard' },
      el('div', { class: 'wcard-head' }, el('span', { class: 'tag role', style: roleStyle(role) }, role)),
      promptBlock(workerPrompt(role), renderHelper)))
      : promptBlock(workerPrompt('<角色，比如 frontend>'), renderHelper),
    el('div', { class: 'helper-sec' }, el('h4', null, `② 干活中：在线的 worker（${online.length}）`), dismissAll),
    el('p', { class: 'hint' }, dismissAllArm
      ? '确认后：空闲的马上下线；手上有任务的做完这个再下线。'
      : 'worker 停下来不动时，复制它的叫醒话，发到它自己的 agent 窗口。'),
    ordered.length ? ordered.map((a) => el('div', { class: `wcard${a.id === helper.focus ? ' focus' : ''}` },
      el('div', { class: 'wcard-head' },
        el('span', { class: 'grow' },
          el('b', null, agentLabel(a.id)),
          el('span', { class: 'role-text', style: roleStyle(a.role) }, a.role),
          el('span', { class: 'hint' }, `${a.currentTask || '空闲'}，心跳 ${ago(a.lastSeenAt)}`),

    offline.length ? [

  panel.hidden = false;
}

    el('h4', null, '原窗口没了？'),
    el('p', { class: 'hint' }, armed
      ? `确定收回？${agentLabel(t.assignee)} 会被标记为掉线，任务退回待领取，由同角色的 worker 接手，已有改动保留。`
      : `如果 ${agentLabel(t.assignee)} 的窗口已经关了或 token 用完，不必等它超时掉线，可以立即收回，交给新 worker 接手。窗口只是停住了的话，用顶部的叫醒话就行。`),
    el('div', { class: 'prompt' },
      el('button', {
        class: armed ? 'btn primary' : 'btn',
        onclick: async (e) => {
          e.stopPropagation();
          if (!armed) { reclaimArm = t.id; reclaimError = null; renderDrawer(false); return; }
          reclaimArm = null;
          try {
            const res = await fetch('/api/reclaim', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: t.id, text: '用户在看板上收回' }) });
            const out = await res.json();
            reclaimError = out.ok ? null : out.message;
          } catch { reclaimError = '连不上 ateam 服务。'; }
          await poll();
          renderDrawer(false);
        },
      }, armed ? '确认收回' : '收回任务'),
      armed ? el('button', { class: 'btn', onclick: (e) => { e.stopPropagation(); reclaimArm = null; renderDrawer(false); } }, '取消') : null,
      reclaimError ? el('span', { class: 'hint' }, reclaimError) : null),
  ];
}

// worker 显示名：起了名字的显示名字，否则显示编号
function agentName(id) {
  return data.state.agents.find((a) => a.id === id)?.name || id;
}
function agentLabel(id) {
  const name = data.state.agents.find((a) => a.id === id)?.name;
  return name ? `${name}（${id}）` : id;
}

// 角色 → 颜色。常用名固定，其他按名字哈希，同一角色永远同一颜色
const ROLE_FIXED = { frontend: 0, fe: 0, 前端: 0, backend: 1, be: 1, 后端: 1, test: 2, qa: 2, 测试: 2, docs: 3, 文档: 3 };
function roleStyle(role) {
  const key = String(role).trim().toLowerCase();
  let i = ROLE_FIXED[key];
  if (i === undefined) {
    let h = 0;
    for (const ch of key) h = (h * 31 + ch.codePointAt(0)) >>> 0;
    i = h % 6;
  }
  return `--rc: var(--role-${i})`;
}

// 提示词：在新的 agent 窗口里对 worker 说的话
// leader 的提示词：在项目目录里开一个 Claude Code 会话发给它
// 「安装」页：一次性安装步骤，命令里的路径用服务所在的真实目录
function installGuide() {
  const tool = (data.toolDir || '~/code/agent-team').replace(/^\/Users\/[^/]+/, '~');
  const project = (data.root || '<你的项目>').replace(/^\/Users\/[^/]+/, '~');
  const port = data.port || 7700;
  const step = (title, hint, cmd) => el('div', { class: 'wcard' },
    el('div', { class: 'wcard-head' }, el('b', null, title)),
    hint ? el('p', { class: 'hint' }, hint) : null,
    cmd ? promptBlock(cmd, renderHelper) : null);
  return [
    el('p', { class: 'hint' }, '只需要做一次。命令在终端里运行。'),
    step('① 注册 ateam 命令', '能打印出命令列表就成功了。',
      `cd ${tool}\nnpm link\nateam help`),
    step('提示找不到 ateam？', 'npm 的全局目录不在 PATH 里。运行下面这行把它加进 ~/.zshrc，然后开一个新终端再试。',
      'echo "export PATH=\\"$(npm prefix -g)/bin:\\$PATH\\"" >> ~/.zshrc'),
    step('② 安装两份 skill（软链，推荐）', 'leader skill 给 Claude Code，worker skill 给 WorkBuddy。软链之后，skill 更新了自动生效。',
      `mkdir -p ~/.claude/skills ~/.workbuddy/skills\nln -s ${tool}/skills/ateam-lead   ~/.claude/skills/ateam-lead\nln -s ${tool}/skills/ateam-worker ~/.workbuddy/skills/ateam-worker`),
    step('或者：复制安装', '以后 skill 更新了，要再运行一次。',
      `mkdir -p ~/.claude/skills ~/.workbuddy/skills\ncp -R ${tool}/skills/ateam-lead   ~/.claude/skills/\ncp -R ${tool}/skills/ateam-worker ~/.workbuddy/skills/`),
    el('div', { class: 'helper-sec' }, el('h4', null, '每个项目')),
    step('③ 在项目根目录启动服务', '项目必须是 git 仓库。这个终端窗口一直开着；看到「项目目录」那一行是你要开发的项目就对了。',
      `cd ${project}\nateam serve`),
    step('同时开第二个项目？', '换一个端口，并让这个项目里的 leader 和 worker 都带上同样的 ATEAM_URL。',
      `ateam serve --port ${port + 1}\nexport ATEAM_URL=http://127.0.0.1:${port + 1}`),
    el('p', { class: 'hint' }, '装好之后：切到「leader」页开 leader，切到「worker」页开 worker。'),
  ];
}

// leader 的加入提示词：不带需求，先就位；新开会话和会话重开都用这一句
function leadPrompt() {
  const dir = data.root ? `\n项目目录：${data.root}` : '';
  return `使用 ateam-lead skill，作为 leader 加入这个项目的团队。${dir}
先运行 ateam status 了解现状，再用 Monitor 后台启动 ateam watch --follow 监听。
如果「待你处理」里有事，先接着处理；没有的话，简单告诉我现状（有哪些 worker 在线、有没有没做完的需求），然后等我说需求。不要自己找活干。`;
}

function workerPrompt(role) {
  const dir = data.root ? `\n项目目录：${data.root}` : '';
  return `使用 ateam-worker skill，角色 ${role}${dir}`;
}

function promptBox(role) {
  return promptBlock(workerPrompt(role), render);
}

// 一段可复制的提示词；rerender 用来刷新「已复制」状态
function promptBlock(text, rerender) {
  const done = copied === text;
  return el('div', { class: 'pblock' },
    el('code', null, text),
    el('button', {
      class: `btn sm${done ? ' done' : ''}`,
      onclick: async (e) => {
        e.stopPropagation();
        try { await navigator.clipboard.writeText(text); copied = text; } catch { copied = null; }
        rerender();
        setTimeout(() => { if (copied === text) { copied = null; rerender(); } }, 2000);
      },
    }, done ? '已复制' : '复制'));
}

// 待领取、依赖已满足、但没有同角色在线 worker 的任务 → 需要有人开新窗口接手
function rolesNeedingWorkers() {
  const { tasks, agents } = data.state;
  const approved = new Set(tasks.filter((t) => t.status === 'approved').map((t) => t.id));
  const onlineRoles = new Set(agents.filter((a) => a.status === 'online').map((a) => a.role.trim().toLowerCase()));
  const byRole = new Map();
  for (const t of tasks) {
    if (t.status !== 'pending' || !t.dependsOn.every((d) => approved.has(d))) continue;
    if (onlineRoles.has(t.role.trim().toLowerCase())) continue;
    if (!byRole.has(t.role)) byRole.set(t.role, []);
    byRole.get(t.role).push(t);
  }
  return byRole;
}

function renderNeeds() {
  const box = document.getElementById('needs');
  const byRole = rolesNeedingWorkers();
  if (byRole.size === 0) { box.hidden = true; box.replaceChildren(); return; }
  const summary = [...byRole].map(([role, ts]) => `${role}（${ts.map((t) => t.id + (t.handoff ? ' 待接手' : '')).join('、')}）`).join('，');
  fill(box,
    el('div', { class: 'needs-row' },
      el('b', null, '有任务没人做'),
      el('span', null, `缺少这些角色的在线 worker：${summary}`),
      el('button', { class: 'btn', onclick: (e) => { e.stopPropagation(); showPrompts = !showPrompts; render(); } },
        showPrompts ? '收起提示词' : '显示提示词')),
    showPrompts ? el('div', null,
      el('p', { class: 'hint' }, '打开一个新的 agent 窗口（可以换账号），工作目录选项目目录，把下面这句话发给它。它会自动接手，在已有改动上继续。想给这个窗口起名字，就在第一行末尾加「，名字 账号B」。'),
      [...byRole.keys()].map((role) => promptBox(role))) : null);
  box.hidden = false;
}

function render() {
  if (!data) return;
  renderNeeds();
  if (!view.job && data.state.jobs.length) view.job = data.state.jobs[data.state.jobs.length - 1].id;
  renderWorkers();
  renderJobs();
  renderMain();
  renderDrawer(false);
  renderReport();
}

function openReport() {
  view.task = null;
  view.report = true;
  saveView();
  render();
  const page = document.getElementById('report');
  page.scrollTop = 0;
  page.querySelector('.btn')?.focus();
}

function closeReport() {
  view.report = false;
  saveView();
  render();
}

function renderReport() {
  const page = document.getElementById('report');
  const job = data.state.jobs.find((j) => j.id === view.job);
  if (!view.report || !job || !job.report) {
    page.hidden = true;
    page.replaceChildren();
    document.body.style.overflow = '';
    return;
  }
  const scroll = page.hidden ? 0 : page.scrollTop;
  const tasks = data.state.tasks.filter((t) => t.jobId === job.id && t.status !== 'cancelled');
  const st = reviewStats(tasks);
  const body = el('div', { class: 'md' });
  body.innerHTML = renderMarkdown(job.report); // renderMarkdown 先转义了 HTML
  fill(page,
    el('div', { class: 'report-top' },
      el('button', { class: 'btn', onclick: closeReport }, '返回看板'),
      el('span', { class: 'crumb' }, `${job.id} ${job.title}`)),
    el('article', { class: 'report-sheet' },
      el('div', { class: 'report-meta' },
        el('span', null, '状态 ', el('b', null, JOB_STATUS[job.status] || job.status)),
        el('span', null, '提交于 ', el('b', null, fmtTime(job.updatedAt))),
        el('span', null, '任务 ', el('b', null, `${st.approved}/${tasks.length}`), ' 已通过'),
        el('span', null, 'review ', el('b', null, st.reviews), ' 次'),
        el('span', null, '一次通过率 ', el('b', null, st.rate))),
      body));
  page.hidden = false;
  page.scrollTop = scroll;
  document.body.style.overflow = 'hidden';
}

// 选中的需求和打开的任务记在地址栏 hash 里，刷新页面后保留
function saveView() {
  const hash = [view.job, view.report ? 'report' : view.task].filter(Boolean).join('/');
  history.replaceState(null, '', hash ? `#${hash}` : location.pathname);
}
function loadView() {
  const [job, second] = location.hash.slice(1).split('/');
  const report = second === 'report';
  view = { job: job || null, task: report ? null : second || null, report };
}

async function poll() {
  try {
    const res = await fetch('/api/state', { cache: 'no-store' });
    const json = await res.text();
    document.getElementById('banner').hidden = true;
    if (json !== lastJson) {
      lastJson = json;
      data = JSON.parse(json);
      render();
    } else {
      renderWorkers(); // 只刷新「心跳 N 分钟前」
    }
  } catch {
    document.getElementById('banner').hidden = false;
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (helper.open) { helper = { open: false, focus: null }; renderHelper(); return; }
  if (view.report) closeReport();
  else if (view.task) closeDrawer();
});
// 点抽屉以外的地方关闭抽屉；点任务卡片则切换到那张卡片（卡片自己的点击处理负责打开）
document.addEventListener('click', (e) => {
  if (helper.open && !e.target.closest('#helper, #helper-btn')) { helper = { open: false, focus: null }; renderHelper(); }
  if (!view.task) return;
  if (e.target.closest('#drawer, .card')) return;
  closeDrawer();
});
document.getElementById('helper-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  helper = helper.open ? { open: false, focus: null } : { open: true, focus: null };
  renderHelper();
});
loadView();
poll();
setInterval(poll, 3000);
</script>
</body>
